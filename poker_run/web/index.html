<script src="engine.js"></script>
<script>
"use strict";
/* ======================================================================
 * Pure helpers (no DOM). Kept separate so they can be exercised from Node:
 * the test harness evaluates this script with no `document` and reads UI.
 * ==================================================================== */
const UI = (function (PR) {
  const SUIT_GLYPH = ["♠︎", "♥︎", "♦︎", "♣︎"];
  const SUIT_LETTER = PR.SUITS;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rankLabel(r) { return r === 8 ? "10" : PR.RANKS[r]; }
  function faceText(g, id) { return rankLabel(g.rank[id]) + SUIT_GLYPH[g.suit[id]]; }
  function isRed(suit) { return suit === 1 || suit === 2; }
  function isModified(g, id) { const f = PR.startFace(id); return g.rank[id] !== f[0] || g.suit[id] !== f[1]; }
  function num(x) { return typeof x === "bigint" ? x.toString() : Number(x).toLocaleString("en-US"); }
  function prettyMod(name) { return name.replace(/_/g, " "); }
  function rulesTitle(name) { return name.charAt(0).toUpperCase() + name.slice(1); }

  // What a ruleset changes compared with classic, as short lines of text (empty for classic).
  function rulesChanges(rules) {
    const R = PR.getRuleset(rules), C = PR.getRuleset("classic");
    const out = [];
    if (R === C) return out;
    const hv = (h) => `${h[2]} base × ${h[3]} mult, +${h[4]}/+${h[5]} per level`;
    R.hands.forEach((h, i) => {
      if (h.join() !== C.hands[i].join()) out.push({ what: h[1], now: hv(h), was: hv(C.hands[i]) });
    });
    for (const name of PR.MODIFIER_IDS) {
      const [p, fx] = R.modifiers[name], [cp, cfx] = C.modifiers[name];
      if (p !== cp || fx !== cfx) {
        out.push({ what: prettyMod(name), now: `$${p}: ${fx}`, was: (p !== cp ? `$${cp}` : "") + (fx !== cfx ? (p !== cp ? ": " : "") + cfx : "") });
      }
    }
    for (const k of ["remove", "paint", "promote"]) {
      if (R["price_" + k] !== C["price_" + k]) out.push({ what: k, now: `$${R["price_" + k]} a card`, was: `$${C["price_" + k]}` });
    }
    if (R.end_in_last_round !== C.end_in_last_round) {
      out.push({ what: "end", now: R.end_in_last_round ? "allowed in the last round" : "not allowed in the last round (play it out)", was: "allowed" });
    }
    return out;
  }

  // Build a game from an instance and a move list. Stops at the first illegal move.
  function buildGame(inst, moves, rules) {
    const g = new PR.Game(inst, rules);
    for (let k = 0; k < moves.length; k++) {
      try { g.apply(moves[k]); } catch (e) {
        if (e instanceof PR.IllegalMove) return { game: g, applied: k, error: e.message };
        throw e;
      }
    }
    return { game: g, applied: moves.length, error: null };
  }

  // Every state of a replay: states[k] is the game after k moves.
  function replayStates(inst, moves, rules) {
    const states = [new PR.Game(inst, rules)];
    for (let k = 0; k < moves.length; k++) {
      const g = states[k].clone();
      try { g.apply(moves[k]); } catch (e) {
        if (e instanceof PR.IllegalMove) return { states, errorAt: k + 1, error: e.message };
        throw e;
      }
      states.push(g);
    }
    return { states, errorAt: null, error: null };
  }

  // Card ids a move refers to (play/discard/remove/paint/promote); only small integers.
  function moveCards(move) {
    const t = PR._py.pySplit(move);
    if (!t.length) return [];
    let ids = [];
    if (t[0] === "play" || t[0] === "discard") ids = t.slice(1);
    else if (["remove", "paint", "promote"].includes(t[0])) ids = t.slice(1, 2);
    const out = [];
    for (const x of ids) {
      try { const v = PR._py.pyInt(x); if (typeof v === "number" && v >= 0 && v < PR.N_CARDS) out.push(v); } catch (e) { /* not a card */ }
    }
    return out;
  }

  // A short human description of a move, given the game before it.
  function describe(g, move) {
    const t = PR._py.pySplit(move);
    const cmd = t[0];
    const cards = moveCards(move);
    const faces = cards.map((c) => faceText(g, c)).join(" ");
    if (cmd === "play") {
      const err = g.tryMove(move);
      if (err) return faces;
      const r = g.evaluate(cards);
      return `${faces} → ${PR.HAND_NAMES[r.hand]} ${num(r.points)}` + (r.money ? ` +$${r.money}` : "");
    }
    if (cmd === "discard") return faces;
    if (cmd === "end") return "end round";
    if (cmd === "buy") return t[1] && Object.prototype.hasOwnProperty.call(g.rules.modifiers, t[1]) ? `buy ${prettyMod(t[1])} -$${g.rules.price(t[1])}` : "buy";
    if (cmd === "sell") return t[1] ? `sell ${prettyMod(t[1])}` : "sell";
    if (cmd === "level") return t[1] && g.levels[t[1]] !== undefined && PR.HAND_CODES.includes(t[1])
      ? `${PR.HAND_NAMES[t[1]]} → level ${g.levels[t[1]] + 1}` : "level";
    if (cmd === "remove") return `remove ${faces}`;
    if (cmd === "paint" && cards.length && t[2] && SUIT_LETTER.includes(t[2])) {
      return `${faces} → ${rankLabel(g.rank[cards[0]])}${SUIT_GLYPH[SUIT_LETTER.indexOf(t[2])]}`;
    }
    if (cmd === "promote" && cards.length && g.rank[cards[0]] < 12) {
      return `${faces} → ${rankLabel(g.rank[cards[0]] + 1)}${SUIT_GLYPH[g.suit[cards[0]]]}`;
    }
    if (cmd === "discards") return "+1 discard per round";
    if (cmd === "handsize") return "+1 hand size";
    if (cmd === "reroll") return "next three offers";
    if (cmd === "next") return `start round ${g.round + 2}`;
    return "";
  }

  // Money you'd get by ending the round now (or after a round-ending play).
  function roundReward(g) {
    const R = g.rules, saving = g.hasMod("savings");
    const cap = R.interest_cap + (saving ? R.effects.savings : 0);
    const per = saving ? R.savings_interest_per : R.interest_per;
    let r = R.round_reward + R.play_bonus * g.plays_left + Math.min(Math.floor(g.money / per), cap);
    if (g.hasMod("spare_hands")) r += R.effects.spare_hands * g.discards_left;
    return r;
  }

  // What the preview panel shows for a selection during a round.
  function preview(g, selected) {
    if (g.phase !== "play" || !selected.length) return null;
    const ids = selected.slice();
    const res = ids.length <= 5 ? g.evaluate(ids, true) : null;
    const playLine = "play " + ids.join(" ");
    const playErr = g.tryMove(playLine);
    let after = null;
    if (!playErr) {
      const c = g.clone();
      c.apply(playLine);
      after = { phase: c.phase, round_score: c.round_score, money: c.money, total: c.total, cleared: c.cleared > g.cleared };
    }
    return { res, playErr, discardErr: g.tryMove("discard " + ids.join(" ")), after };
  }

  function formula(res) {
    if (!res) return "";
    const modBase = res.base - res.handBase - res.cardChips;
    const modMult = res.mult - res.handMult;
    let s = `(${res.handBase} + ${res.cardChips} chips` + (modBase ? ` + ${modBase}` : "") + `) × (${res.handMult}` +
      (modMult ? ` + ${modMult}` : "") + ")";
    if (res.times !== 1) s += ` × ${res.times}`;
    return s + ` = ${num(res.points)}`;
  }

  function verdictText(code, v) {
    if (!v.valid) return v.error;
    const end = v.cleared === v.rounds ? "won the run" : !v.finished ? "stopped early" : "out";
    return `score ${num(v.score)} · cleared ${v.cleared}/${v.rounds} (${end}) · ${v.moves} moves · $${v.money}`;
  }

  function outcome(g) {
    if (!g.over) return null;
    const won = g.cleared === g.inst.rounds;
    return {
      won, score: g.total, cleared: g.cleared, rounds: g.inst.rounds,
      text: won ? `Cleared all ${g.inst.rounds} rounds` :
        `Out in round ${g.round + 1}: ${num(g.round_score)} of ${num(g.target)} points`,
    };
  }

  // Cards of the next round's draw order still in the deck (shop planning).
  function nextRoundPile(g) {
    if (g.phase !== "shop") return [];
    return g.inst.orders[g.round + 1].filter((c) => g.in_deck[c]);
  }

  function sortedHand(g, how) {
    const h = g.hand.slice();
    if (how === "rank") h.sort((a, b) => g.rank[b] - g.rank[a] || g.suit[a] - g.suit[b] || a - b);
    else if (how === "suit") h.sort((a, b) => g.suit[a] - g.suit[b] || g.rank[b] - g.rank[a] || a - b);
    return h;
  }

  function deckOrder(g) {
    const ids = [...Array(PR.N_CARDS).keys()];
    return ids.sort((a, b) => (g.in_deck[b] - g.in_deck[a]) || g.suit[a] - g.suit[b] || g.rank[a] - g.rank[b] || a - b);
  }

  function modState(name, state, rules) {
    const e = PR.getRuleset(rules).effects;
    if (name === "momentum") return state.streak ? `streak ${state.streak} × ${PR.HAND_NAMES[state.last]} (+${e.momentum * state.streak} mult on another one)` : "no streak yet";
    if (name === "collector") return `+${state.bonus} base banked`;
    return "";
  }

  return { SUIT_GLYPH, SUIT_LETTER, esc, rankLabel, faceText, isRed, isModified, num, prettyMod, rulesTitle, rulesChanges,
    buildGame, replayStates, moveCards, describe, roundReward, preview, formula, verdictText, outcome, nextRoundPile, sortedHand, deckOrder, modState };
})(typeof PokerRun !== "undefined" ? PokerRun : require("./engine.js"));

/* ======================================================================
 * DOM app
 * ==================================================================== */
function startApp(PR) {
  const $ = (id) => document.getElementById(id);
  const esc = UI.esc;
  const STORE_KEY = "poker-run:v1";

  const S = {
    mode: "play",
    source: { type: "seed", seed: 1 },  // or {type: "text", text}
    rules: "classic",    // ruleset name (PR.RULESETS); every game here is built with it
    inputText: "",
    inst: null,
    moves: [],
    labels: [],          // describe() of each move, computed from the game before it
    game: null,
    sel: [],             // selected hand cards, in click order
    deckPick: null,      // card picked in the shop's deck editor
    sort: "draw",
    msg: null,           // {kind: 'err'|'ok', text}
    rp: null,            // replay state
    rpStep: 0,
  };

  // ---------- persistence (per-viewer convenience only)
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ source: S.source, moves: S.moves, sort: S.sort, rules: S.rules })); } catch (e) { /* storage unavailable */ }
  }
  function restore() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  // ---------- game lifecycle
  function startFromSource(source, moves) {
    let text;
    if (source.type === "seed") text = PR.formatInstance(PR.generate(source.seed));
    else text = source.text;
    const inst = PR.parseInstance(text); // may throw BadInput
    S.source = source;
    S.inputText = text;
    S.inst = inst;
    setMoves(moves || []);
    if (source.type === "seed") $("seed").value = String(source.seed);
    if (source.type === "seed") {
      const hash = "seed=" + source.seed + (S.rules !== "classic" ? "&rules=" + S.rules : "");
      try { history.replaceState(null, "", "#" + hash); } catch (e) {
        try { location.hash = hash; } catch (e2) { /* no URL updates here */ }
      }
    }
    save();
  }

  function setMoves(moves) {
    const g = new PR.Game(S.inst, S.rules);
    const kept = [], labels = [];
    for (const m of moves) {
      const label = UI.describe(g, m);
      try { g.apply(m); } catch (e) { if (e instanceof PR.IllegalMove) break; throw e; }
      kept.push(m); labels.push(label);
    }
    S.moves = kept; S.labels = labels; S.game = g; S.sel = []; S.deckPick = null;
  }

  // ---------- sound: quiet, warm tones on a pentatonic scale, so nothing ever clashes.
  // Audio starts only after a click (browsers require a gesture) and the header toggle mutes it.
  const SOUND_KEY = "poker-run:sound";
  const Sound = (() => {
    let ctx = null, master = null;
    let on = true;
    try { on = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { /* storage unavailable */ }
    const SCALE = [293.66, 329.63, 369.99, 440.0, 493.88]; // D E F# A B
    const note = (i) => SCALE[((i % 5) + 5) % 5] * Math.pow(2, Math.floor(i / 5));

    function audio() {
      if (!on) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.16;
        const soften = ctx.createBiquadFilter();
        soften.type = "lowpass";
        soften.frequency.value = 3000;
        master.connect(soften);
        soften.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function tone(freq, o) {
      const c = audio();
      if (!c) return;
      o = o || {};
      const t = c.currentTime + (o.at || 0), dur = o.dur || 0.35, peak = o.gain || 0.5;
      const osc = c.createOscillator(), env = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(peak, t + (o.attack || 0.012));
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(env);
      env.connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    }

    function hush(o) { // filtered noise: a soft swish of cards
      const c = audio();
      if (!c) return;
      o = o || {};
      const t = c.currentTime + (o.at || 0), dur = o.dur || 0.28;
      const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(), band = c.createBiquadFilter(), env = c.createGain();
      src.buffer = buf;
      band.type = "bandpass";
      band.Q.value = 0.9;
      band.frequency.setValueAtTime(o.from || 2200, t);
      band.frequency.exponentialRampToValueAtTime(o.to || 600, t + dur);
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(o.gain || 0.22, t + 0.03);
      env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(band);
      band.connect(env);
      env.connect(master);
      src.start(t);
    }

    return {
      get on() { return on; },
      toggle() {
        on = !on;
        try { localStorage.setItem(SOUND_KEY, on ? "on" : "off"); } catch (e) { /* storage unavailable */ }
        if (on) this.select(7);
      },
      select(rank) { tone(note(rank + 3), { type: "triangle", dur: 0.22, gain: 0.32 }); tone(note(rank + 8), { dur: 0.18, gain: 0.08 }); },
      deselect(rank) { tone(note(rank), { type: "triangle", dur: 0.16, gain: 0.2 }); },
      tap() { tone(note(4), { type: "triangle", dur: 0.12, gain: 0.16 }); },
      play(strength) { // longer, higher arpeggios for stronger hands
        const n = 2 + Math.min(5, Math.floor(strength / 2));
        for (let i = 0; i < n; i++) {
          tone(note(5 + i), { at: i * 0.07, dur: 0.9, gain: 0.3 });
          tone(note(10 + i), { at: i * 0.07 + 0.01, dur: 0.5, gain: 0.06, type: "triangle" });
        }
      },
      discard() { hush({ from: 2400, to: 700 }); tone(note(1), { at: 0.05, type: "triangle", dur: 0.2, gain: 0.12 }); },
      coin() { tone(note(12), { dur: 0.25, gain: 0.22 }); tone(note(14), { at: 0.08, dur: 0.45, gain: 0.22 }); },
      sell() { tone(note(14), { dur: 0.22, gain: 0.18 }); tone(note(11), { at: 0.08, dur: 0.35, gain: 0.18 }); },
      shuffle() { hush({ from: 1500, to: 3000, dur: 0.22, gain: 0.16 }); hush({ at: 0.12, from: 3000, to: 1200, dur: 0.22, gain: 0.14 }); },
      clear() { [0, 2, 3, 5, 7].forEach((k, i) => tone(note(k), { at: i * 0.06, dur: 1.8, gain: 0.26, attack: 0.04 })); },
      next() { tone(note(3), { dur: 0.3, gain: 0.2 }); tone(note(5), { at: 0.1, dur: 0.5, gain: 0.2 }); },
      lose() { [5, 3, 0].forEach((k, i) => tone(note(k), { at: i * 0.16, dur: 1.0, gain: 0.22, attack: 0.05 })); },
      oops() { tone(196, { dur: 0.28, gain: 0.24, attack: 0.02 }); },
    };
  })();

  // ---------- feel: ripples, floating points, deal-in cards, counting numbers, motes.
  const Feel = (() => {
    const calm = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fx = () => $("fx");
    let pointer = { x: innerWidth / 2, y: innerHeight / 2 };
    let seen = null;        // what the last play-mode render showed: { key, hand, nums, pct, round }

    function spawn(cls, x, y, html, style) {
      if (calm || !fx()) return null;
      const el = document.createElement("div");
      el.className = cls;
      el.style.left = x + "px";
      el.style.top = y + "px";
      if (style) Object.assign(el.style, style);
      if (html) el.innerHTML = html;
      fx().appendChild(el);
      el.addEventListener("animationend", () => el.remove(), { once: true });
      setTimeout(() => el.remove(), 3000);
      return el;
    }

    function ripple(ev) {
      pointer = { x: ev.clientX, y: ev.clientY };
      spawn("ripple", ev.clientX, ev.clientY);
    }

    function float(text, sub) {
      // Rise from the round-points box, where the points land; fall back to the click point.
      const box = document.querySelector('#play-main [data-num="round"]');
      const r = box ? box.getBoundingClientRect() : null;
      const x = r && r.width ? r.left + r.width / 2 : pointer.x;
      const y = r && r.width ? r.top + 8 : pointer.y - 30;
      spawn("float", x, y, `${esc(text)}${sub ? `<small>${esc(sub)}</small>` : ""}`);
    }

    function motes(count) {
      const bar = document.querySelector("#play-main .progress");
      if (!bar) return;
      const r = bar.getBoundingClientRect();
      for (let i = 0; i < count; i++) {
        const x = r.left + Math.random() * r.width, y = r.top + r.height / 2;
        spawn("mote", x, y, "", {
          "--dx": `${(Math.random() - 0.5) * 120}px`, "--dy": `${-60 - Math.random() * 140}px`,
          "--t": `${1.2 + Math.random() * 0.9}s`, animationDelay: `${Math.random() * 0.35}s`,
        });
      }
    }

    function countUp(el, from, to, prefix) {
      if (calm || from === to || to < from) return;
      const start = performance.now(), dur = 650;
      const step = (now) => {
        const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = prefix + UI.num(Math.round(from + (to - from) * e));
        if (k < 1 && el.isConnected) requestAnimationFrame(step);
      };
      el.textContent = prefix + UI.num(from);
      requestAnimationFrame(step);
    }

    // Called after every play-mode render: animate what changed since the previous one.
    function afterRender(g) {
      const key = S.inputText + "|" + S.moves.length;
      const hand = g.phase === "play" ? g.hand.slice() : [];
      const nums = { round: Number(g.round_score), money: Number(g.money), total: Number(g.total) };
      const target = Number(g.target);
      const pct = target > 0 ? Math.min(100, (100 * Number(g.round_score)) / target) : 100;
      const fresh = !seen || seen.input !== S.inputText;
      if (seen && seen.key === key) { seen.hand = hand; return; } // a selection change, nothing moved
      const known = new Set(fresh ? [] : seen.hand);
      let k = 0;
      document.querySelectorAll('#play-main [data-act="card"]').forEach((el) => {
        if (!known.has(Number(el.dataset.id))) {
          el.classList.add("dealt");
          el.style.setProperty("--d", `${(k++) * 55}ms`);
        }
      });
      if (!fresh) {
        document.querySelectorAll("#play-main [data-num]").forEach((el) => {
          const name = el.dataset.num;
          countUp(el, seen.nums[name], nums[name], el.dataset.prefix || "");
        });
        const bar = document.querySelector("#play-main .progress .bar");
        if (bar && !calm && seen.round === g.round && seen.phase === "play") {
          bar.style.width = seen.pct + "%";
          bar.getBoundingClientRect();
          bar.style.width = pct + "%";
        }
      }
      const msg = document.querySelector("#play-msg > div, #play-main .err, #play-main .okmsg");
      if (msg) msg.classList.add("msg-in");
      seen = { key, input: S.inputText, hand, nums, pct, round: g.round, phase: g.phase };
    }

    // Called after a legal move: the sound and the moment that go with it.
    function afterMove(line, before, after) {
      const cmd = line.split(" ")[0];
      if (cmd === "play") {
        const res = before.evaluate(UI.moveCards(line));
        Sound.play(PR.HAND_CODES.indexOf(res.hand));
        float(`+${UI.num(res.points)}`, PR.HAND_NAMES[res.hand]);
      } else if (cmd === "discard") Sound.discard();
      else if (cmd === "reroll") Sound.shuffle();
      else if (cmd === "sell") Sound.sell();
      else if (cmd === "next") Sound.next();
      else if (["buy", "level", "paint", "promote", "remove", "discards", "handsize"].includes(cmd)) Sound.coin();
      if (before.phase === "play" && after.phase !== "play") {
        const cleared = after.cleared > before.cleared;
        setTimeout(() => {
          if (cleared) { Sound.clear(); motes(after.phase === "over" ? 40 : 22); } else Sound.lose();
        }, cmd === "play" ? 420 : 0);
      }
    }

    return { ripple, afterRender, afterMove };
  })();

  // ---------- scroll: a progress line, a compact score bar once the status panel is out of
  // view, and a sheen on cards that follows the mouse. Updates run at most once per frame.
  const Scroll = (() => {
    const calm = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    let queued = false;

    function update() {
      queued = false;
      const max = document.documentElement.scrollHeight - innerHeight;
      $("scroll-line").style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
      const status = document.querySelector('#play-main [aria-label="Round status"]');
      const show = S.mode === "play" && !!status && status.getBoundingClientRect().bottom < 0;
      $("mini").classList.toggle("show", show);
      $("mini").tabIndex = show ? 0 : -1;
    }

    function request() {
      if (!queued) { queued = true; requestAnimationFrame(update); }
    }

    function fill(g) {
      const target = Number(g.target);
      const pct = target > 0 ? Math.min(100, (100 * Number(g.round_score)) / target) : 100;
      const phase = g.phase === "play" ? "" : g.phase === "shop" ? " · shop" : " · run over";
      const live = g.phase === "play";
      $("mini").innerHTML = `<span><span class="k">Round</span>${g.round + 1}/${g.inst.rounds}${phase}</span>
        <span class="meter" aria-hidden="true"><i style="width:${pct}%"></i></span>
        <span>${UI.num(g.round_score)}<span class="k"> / ${UI.num(g.target)}</span></span>
        <span class="opt"><span class="k">Plays</span>${live ? g.plays_left : "–"}</span>
        <span class="opt"><span class="k">Discards</span>${live ? g.discards_left : "–"}</span>
        <span class="gold">$${g.money}</span>
        <span><span class="k">Total</span><b class="gold">${UI.num(g.total)}</b></span>`;
      request();
    }

    addEventListener("scroll", request, { passive: true });
    addEventListener("resize", request, { passive: true });
    $("mini").addEventListener("click", () => scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" }));
    document.addEventListener("pointermove", (ev) => {
      const card = ev.target.closest && ev.target.closest("button.card");
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty("--mx", `${((ev.clientX - r.left) / r.width) * 100}%`);
      card.style.setProperty("--my", `${((ev.clientY - r.top) / r.height) * 100}%`);
    }, { passive: true });
    return { fill, request };
  })();

  function soundIcon() {
    const b = $("sound-btn");
    if (!b) return;
    const waves = Sound.on ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
      : '<path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${waves}</svg>`;
    b.setAttribute("aria-pressed", String(Sound.on));
    b.title = Sound.on ? "Sound on" : "Sound off";
  }

  function doMove(line) {
    const before = S.game;
    const g = S.game.clone();
    const label = UI.describe(S.game, line);
    try { g.apply(line); } catch (e) {
      if (e instanceof PR.IllegalMove) { S.msg = { kind: "err", text: `${line}: ${e.message}` }; Sound.oops(); renderKeepFocus(); return false; }
      throw e;
    }
    S.game = g;
    S.moves.push(line);
    S.labels.push(label);
    S.sel = S.sel.filter((c) => g.hand.includes(c) && g.phase === "play");
    if (g.phase !== "play") S.sel = [];
    S.msg = null;
    if (S.deckPick !== null && (!g.in_deck[S.deckPick] || g.phase !== "shop")) S.deckPick = null;
    save();
    renderKeepFocus();
    Feel.afterMove(line, before, g);
    return true;
  }

  function undo() {
    if (!S.moves.length) return;
    const last = S.moves[S.moves.length - 1];
    setMoves(S.moves.slice(0, -1));
    S.msg = { kind: "ok", text: `Undid "${last}".` };
    save();
    render();
  }

  function outputText() { return PR.formatOutput(S.moves); }

  // ---------- rendering pieces
  function cardHTML(g, id, o) {
    o = o || {};
    const r = g.rank[id], s = g.suit[id];
    const cls = ["card", UI.isRed(s) ? "red" : ""];
    if (o.size) cls.push(o.size);
    if (o.cls) cls.push(o.cls);
    const label = UI.rankLabel(r), glyph = UI.SUIT_GLYPH[s];
    const mod = UI.isModified(g, id) ? '<span class="dot" title="painted or promoted"></span>' : "";
    const tag = o.tag ? `<span class="tag">${esc(o.tag)}</span>` : "";
    const inner = `<span class="tl">${label}<i>${glyph}</i></span><span class="cid">${id}</span>` +
      `<span class="mid">${glyph}</span><span class="br">${label}<i>${glyph}</i></span>${mod}${tag}`;
    const aria = `${label} of ${["spades", "hearts", "diamonds", "clubs"][s]}, card ${id}` + (o.aria ? ", " + o.aria : "");
    if (o.act) {
      return `<button type="button" class="${cls.join(" ")}" data-act="${o.act}" data-id="${id}" aria-pressed="${o.pressed ? "true" : "false"}" aria-label="${esc(aria)}">${inner}</button>`;
    }
    return `<div class="${cls.join(" ")}" role="img" aria-label="${esc(aria)}">${inner}</div>`;
  }

  function btn(label, act, opts) {
    opts = opts || {};
    const dis = opts.err ? " disabled" : "";
    const title = opts.err ? ` title="${esc(opts.err)}"` : opts.title ? ` title="${esc(opts.title)}"` : "";
    const v = opts.v !== undefined ? ` data-v="${esc(opts.v)}"` : "";
    const price = opts.price !== undefined ? `<span class="price">$${opts.price}</span>` : "";
    return `<button type="button" class="btn${opts.cls ? " " + opts.cls : ""}" data-act="${act}"${v}${dis}${title}${opts.aria ? ` aria-label="${esc(opts.aria)}"` : ""}>${label}${price}</button>`;
  }

  function statusHTML(g) {
    const R = g.inst.rounds;
    const target = Number(g.target);
    const pct = target > 0 ? Math.min(100, (100 * g.round_score) / target) : 100;
    const done = g.round_score >= g.target;
    let phase = g.phase === "play" ? "round" : g.phase === "shop" ? "shop" : "run over";
    const roundLine = g.phase === "shop"
      ? `<div class="progress-label"><span>Round ${g.round + 1} cleared with ${UI.num(g.round_score)}</span><span>Next target ${UI.num(g.inst.targets[g.round + 1])}</span></div>`
      : `<div class="progress-label"><span>${UI.num(g.round_score)} / ${UI.num(g.target)}</span><span>${done ? "target reached" : UI.num(Math.max(0, target - g.round_score)) + " to go"}</span></div>`;
    return `<section class="panel" aria-label="Round status">
      <div class="toolbar" style="margin-bottom:10px"><h2 style="margin:0">Round ${g.round + 1} of ${R}</h2><span>${g.rules.name !== "classic" ? `<span class="rules-tag" title="Scored by the ${esc(g.rules.name)} rules">${esc(UI.rulesTitle(g.rules.name))} rules</span>` : ""}<span class="phase-tag">${phase}</span></span></div>
      <div class="stats">
        <div class="stat"><div class="k">Target</div><div class="v">${UI.num(g.target)}</div></div>
        <div class="stat"><div class="k">Round pts</div><div class="v" data-num="round">${UI.num(g.round_score)}</div></div>
        <div class="stat"><div class="k">Plays</div><div class="v">${g.phase === "play" ? g.plays_left : "–"}<small> / ${g.inst.plays}</small></div></div>
        <div class="stat"><div class="k">Discards</div><div class="v">${g.phase === "play" ? g.discards_left : "–"}<small> / ${g.inst.discards + g.extra_discards}</small></div></div>
        <div class="stat"><div class="k">Hand size</div><div class="v">${g.hand_size}</div></div>
        <div class="stat money"><div class="k">Money</div><div class="v" data-num="money" data-prefix="$">$${g.money}</div></div>
        <div class="stat"><div class="k">Total score</div><div class="v gold" data-num="total">${UI.num(g.total)}</div></div>
      </div>
      <div class="progress${done ? " done" : ""}" role="progressbar" aria-label="Round points" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${g.round_score}">
        <div class="bar" style="width:${pct}%"></div>
      </div>
      ${roundLine}
    </section>`;
  }

  function pileHTML(g, ids, title, hint, nextN, hlSet) {
    if (!ids.length) return `<section class="panel"><h2>${title}</h2><p class="muted" style="margin:0">Empty: no more cards to draw this round.</p></section>`;
    const items = ids.map((c, i) => `<div class="slot">${cardHTML(g, c, { size: "mini", cls: (i < nextN ? "next-draw" : "") + (hlSet && hlSet.has(c) ? " hl" : "") })}<div class="pos">${i + 1}</div></div>`).join("");
    return `<section class="panel"><div class="toolbar"><h2>${title}</h2><span class="muted" style="font-size:12px">${hint}</span></div><div class="strip" tabindex="0" aria-label="${esc(title)}">${items}</div></section>`;
  }

  function previewHTML(g) {
    const p = UI.preview(g, S.sel);
    if (!p) return `<div class="preview muted" aria-live="polite">Select 1 to 5 cards to see what they score. The input shows every future draw, so plan ahead with the draw pile below.</div>`;
    if (!p.res) return `<div class="preview" aria-live="polite"><span class="err">At most 5 cards can be played or discarded.</span></div>`;
    const r = p.res;
    const parts = r.parts.filter((x) => x.base || x.mult || x.times !== 1 || x.money).map((x) => {
      const bits = [];
      if (x.base) bits.push(`+${x.base} base`);
      if (x.mult) bits.push(`+${x.mult} mult`);
      if (x.times !== 1) bits.push(`×${x.times}`);
      if (x.money) bits.push(`+$${x.money}`);
      return `<span class="chip on">${esc(UI.prettyMod(x.name))}: ${bits.join(", ")}</span>`;
    }).join("");
    let after = "";
    if (p.after) {
      if (p.after.phase === "play") after = `Round would be at ${UI.num(p.after.round_score)} / ${UI.num(g.target)}.`;
      else if (p.after.cleared) after = `Ends the round: cleared with ${UI.num(p.after.round_score)}, money becomes $${p.after.money}.`;
      else after = `Ends the round below target (${UI.num(p.after.round_score)} / ${UI.num(g.target)}): the run would be over.`;
    }
    const kick = S.sel.length - r.scored.length;
    return `<div class="preview" aria-live="polite">
      <div class="toolbar"><span class="hand-name">${esc(PR.HAND_NAMES[r.hand])} <span class="muted" style="font-size:14px;font-weight:600">level ${g.levels[r.hand]}</span></span>
      <span class="gold" style="font-size:22px;font-weight:800">${UI.num(r.points)} pts${r.money ? ` · +$${r.money}` : ""}</span></div>
      <div class="formula">base <b>${r.base}</b> × mult <b>${r.mult}</b>${r.times !== 1 ? ` × <b>${r.times}</b>` : ""} &nbsp;·&nbsp; ${esc(UI.formula(r))}</div>
      <div class="muted" style="font-size:13px;margin-top:4px">${r.scored.length} scored card${r.scored.length === 1 ? "" : "s"}${kick ? `, ${kick} kicker${kick === 1 ? "" : "s"}` : ""}. ${esc(after)}</div>
      ${parts ? `<div class="parts">${parts}</div>` : ""}
    </div>`;
  }

  function handHTML(g, opts) {
    const sel = new Set(opts.selected || []);
    const res = opts.selected && opts.selected.length && opts.selected.length <= 5 ? g.evaluate(opts.selected) : null;
    const scored = new Set(res ? res.scored : []);
    const hl = opts.highlight || new Set();
    const hlScored = opts.hlScored || new Set();
    return UI.sortedHand(g, opts.sort || "draw").map((c) => {
      let cls = "", tag = "";
      if (sel.has(c)) { cls = "sel " + (scored.has(c) ? "scored" : "kicker"); tag = scored.has(c) ? "scores" : "kicker"; }
      if (hl.has(c)) { cls += " hl" + (hlScored.has(c) ? " scored" : ""); }
      return cardHTML(g, c, { act: opts.interactive ? "card" : null, cls, tag, pressed: sel.has(c),
        aria: sel.has(c) ? "selected" : "" });
    }).join("");
  }

  function playPanelHTML(g, interactive) {
    const sel = S.sel;
    const p = interactive ? UI.preview(g, sel) : null;
    const playErr = !sel.length ? "Select 1 to 5 cards" : p ? p.playErr : "";
    const discErr = !sel.length ? "Select 1 to 5 cards" : p ? p.discardErr : "";
    const endErr = g.tryMove("end");
    const reward = !endErr ? UI.roundReward(g) : 0;
    const sortSel = `<label class="muted" style="font-size:13px">Order <select id="sort-hand" aria-label="Hand order">
        ${["draw", "rank", "suit"].map((v) => `<option value="${v}"${S.sort === v ? " selected" : ""}>${v === "draw" ? "as drawn" : "by " + v}</option>`).join("")}
      </select></label>`;
    return `<section class="panel" aria-label="Your hand">
      <div class="toolbar"><h2 style="margin:0">Hand <span class="muted" style="text-transform:none;letter-spacing:0">(${g.hand.length} cards)</span></h2>${sortSel}</div>
      <div class="hand" id="hand">${handHTML(g, { interactive: true, selected: sel, sort: S.sort })}</div>
      <div class="actions">
        ${btn(`Play${sel.length ? " " + sel.length : ""}`, "play", { cls: "primary", err: playErr })}
        ${btn(`Discard${sel.length ? " " + sel.length : ""}`, "discard", { err: discErr })}
        ${btn("End round", "end", { err: endErr, title: !endErr ? `Clear now for +$${reward}` : "" })}
        ${btn("Clear selection", "clear-sel", { err: sel.length ? "" : "Nothing selected" })}
        ${!endErr ? `<span class="muted" style="font-size:13px">Ending now pays +$${reward}</span>` : ""}
      </div>
      ${previewHTML(g)}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>`;
  }

  function handTableHTML(g, interactive, litCode) {
    const classic = PR.getRuleset("classic");
    const rows = g.rules.hands.map(([code, name]) => {
      const lvl = g.levels[code];
      const [b, m] = g.rules.handValue(code, lvl);
      const [cb, cm] = classic.handValue(code, lvl);
      const cell = (v, c) => (v !== c ? `<td class="num changed" title="classic: ${c}">${v}</td>` : `<td class="num">${v}</td>`);
      const err = g.phase === "shop" ? g.tryMove("level " + code) : "Only in the shop";
      const action = interactive && g.phase === "shop" ? `<td class="num">${btn("Level up", "level", { v: code, price: g.levelPrice(code), err, cls: "small", aria: `Level up ${name} for $${g.levelPrice(code)}` })}</td>` : "";
      return `<tr class="${code === litCode ? "lit" : ""}"><td class="mono">${code}</td><td>${name}</td><td class="num">${lvl}</td>${cell(b, cb)}${cell(m, cm)}${action}</tr>`;
    }).join("");
    const head = interactive && g.phase === "shop" ? '<th class="num">Price</th>' : "";
    const note = g.rules.name !== "classic" ? `<span class="muted" style="font-size:12px">${esc(UI.rulesTitle(g.rules.name))} values · green = changed</span>` : "";
    return `<section class="panel" aria-label="Hand types"><div class="toolbar"><h2 style="margin:0">Hand types</h2>${note}</div><div class="scroll-x"><table class="hands">
      <thead><tr><th>Code</th><th>Hand</th><th class="num">Lvl</th><th class="num">Base</th><th class="num">Mult</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
  }

  function modsHTML(g, interactive) {
    const list = g.mods.map(([name, state]) => {
      const [price, fx] = g.rules.modifiers[name];
      const st = UI.modState(name, state, g.rules);
      const sell = interactive && g.phase === "shop" ? btn("Sell", "sell", { v: name, cls: "small", title: `Sell for $${Math.floor(price / 2)}`, aria: `Sell ${name} for $${Math.floor(price / 2)}` }) + ` <span class="muted" style="font-size:12px">+$${Math.floor(price / 2)}</span>` : `<span class="muted" style="font-size:12px">$${price}</span>`;
      return `<div class="mod"><span class="name">${esc(UI.prettyMod(name))}</span><span>${sell}</span><span class="fx">${esc(fx)}</span>${st ? `<span class="state">${esc(st)}</span>` : ""}</div>`;
    }).join("");
    return `<section class="panel" aria-label="Modifiers"><div class="toolbar"><h2 style="margin:0">Modifiers</h2><span class="slots-left">${g.mods.length} / ${g.inst.slots} slots</span></div>
      <div class="mods" style="margin-top:8px">${list || '<p class="muted" style="margin:0">None yet. Buy them in the shop after each round.</p>'}</div></section>`;
  }

  function shopHTML(g) {
    const prices = g.prices();
    const queue = g.inst.offers[g.round];
    const slots = g.visibleSlots();
    const offers = slots.map(({ name, taken }) => {
      const [price, fx] = g.rules.modifiers[name];
      if (taken) return `<div class="offer sold"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">Bought</div></div>`;
      const err = g.tryMove("buy " + name);
      return `<div class="offer"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">${esc(fx)}</div>
        <div class="row"><span class="cost">$${price}</span>${btn("Buy", "buy", { v: name, cls: "primary small", err, aria: `Buy ${name} for $${price}` })}</div></div>`;
    }).join("");
    const later = queue.slice(g.offer_pos + g.rules.shop_window).map((m) => `<span class="chip" title="${esc(g.rules.modifiers[m] ? `$${g.rules.modifiers[m][0]}: ${g.rules.modifiers[m][1]}` : "")}">${esc(UI.prettyMod(m))}</span>`).join("");
    const pick = S.deckPick;
    let deckActions = '<span class="muted">Pick a card below to remove, paint or promote it.</span>';
    if (pick !== null && g.in_deck[pick]) {
      const paint = [0, 1, 2, 3].map((s) => btn(UI.SUIT_GLYPH[s], "paint", { v: s, cls: "small", err: g.tryMove(`paint ${pick} ${PR.SUITS[s]}`), aria: `Paint card ${pick} ${["spades", "hearts", "diamonds", "clubs"][s]} for $${prices.paint}` })).join("");
      deckActions = `${cardHTML(g, pick, { size: "mini" })}
        <span>Card <b class="mono">${pick}</b> (${esc(UI.faceText(g, pick))})</span>
        ${btn("Remove", "remove", { price: prices.remove, err: g.tryMove("remove " + pick), cls: "small" })}
        <span class="muted" style="font-size:13px">Paint $${prices.paint}</span>${paint}
        ${btn("Promote", "promote", { price: prices.promote, err: g.tryMove("promote " + pick), cls: "small" })}
        ${btn("Done", "deck-pick", { v: "", cls: "small" })}`;
    }
    const deck = UI.deckOrder(g).map((c) => g.in_deck[c]
      ? cardHTML(g, c, { size: "deckc", act: "deck-pick", cls: c === pick ? "pick" : "", pressed: c === pick })
      : cardHTML(g, c, { size: "deckc", cls: "gone", aria: "removed" })).join("");
    return `<section class="panel" aria-label="Shop">
      <div class="toolbar"><h2 style="margin:0">Shop after round ${g.round + 1}</h2>
        <div class="actions">${btn("Next round →", "next", { cls: "primary", err: g.tryMove("next") })}</div></div>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">Offers ${g.offer_pos + 1}–${Math.min(g.offer_pos + g.rules.shop_window, queue.length)} of ${queue.length} in this shop's queue.</p>
      <div class="offers">${offers || '<p class="muted">No offers.</p>'}</div>
      <div class="actions" style="margin-top:10px">
        ${btn("Reroll", "reroll", { price: prices.reroll, err: g.tryMove("reroll") })}
        ${btn("+1 discard", "discards", { price: prices.discards, err: g.tryMove("discards"), title: "+1 discard every round from now on" })}
        ${btn("+1 hand size", "handsize", { price: prices.handsize, err: g.tryMove("handsize"), title: `+1 hand size (max ${g.rules.max_hand_size})` })}
      </div>
      ${later ? `<div class="queue-later"><span class="muted">Later in the queue:</span>${later}</div>` : ""}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>
    <section class="panel" aria-label="Deck editor">
      <div class="toolbar"><h2 style="margin:0">Deck</h2><span class="muted" style="font-size:13px">${g.deck_size} cards (min ${g.rules.min_deck}) · gold dot = painted or promoted</span></div>
      <div class="deck-actions">${deckActions}</div>
      <div class="deckgrid">${deck}</div>
    </section>`;
  }

  function summaryHTML(g) {
    const o = UI.outcome(g);
    return `<section class="panel summary" aria-label="Run summary">
      <div class="muted" style="text-transform:uppercase;letter-spacing:.14em;font-size:13px">${o.won ? "Run complete" : "Run over"}</div>
      <div class="big">${UI.num(o.score)}</div>
      <div class="sub">points · cleared ${o.cleared} of ${o.rounds} rounds</div>
      <p>${esc(o.text)}</p>
      <div class="actions" style="justify-content:center">${btn("Undo last move", "undo", { err: S.moves.length ? "" : "Nothing to undo" })}${btn("Replay this run", "rp-from-play")}${btn("Deal a new seed", "random-seed", { cls: "primary" })}</div>
    </section>`;
  }

  function logHTML(moves, labels, cur, bad) {
    const items = moves.map((m, i) => `<li class="${i + 1 === cur ? "cur" : ""}${i + 1 === bad ? " bad" : ""}"${S.mode === "replay" ? ` data-step="${i + 1}"` : ""}><span class="n">${i + 1}</span><span><span class="m">${esc(m)}</span>${labels[i] ? ` <span class="d">${esc(labels[i])}</span>` : ""}</span></li>`).join("");
    return `<ol class="log" id="${S.mode === "replay" ? "rp-log" : "play-log"}" aria-label="Move log">${items || '<li class="muted"><span></span><span>No moves yet.</span></li>'}</ol>`;
  }

  function rulesBoxHTML(rules) {
    const changes = UI.rulesChanges(rules);
    if (!changes.length) return "";
    const items = changes.map((c) => `<li><b>${esc(c.what)}</b>: ${esc(c.now)} <span title="classic">(classic: ${esc(c.was)})</span></li>`).join("");
    return `<section class="panel" aria-label="Rules in play"><details class="rules-box">
      <summary>${esc(UI.rulesTitle(PR.getRuleset(rules).name))} rules: ${changes.length} changes from classic</summary>
      <ul class="rules-notes">${items}</ul></details></section>`;
  }

  function sideHTML(g) {
    const out = outputText();
    const rulesNote = g.rules.name !== "classic"
      ? `<p class="muted" style="margin:0 0 6px;font-size:12px">Played with the <b>${esc(UI.rulesTitle(g.rules.name))}</b> rules: score it with <span class="mono">python -m poker_run check in.txt out.txt --rules ${esc(g.rules.name)}</span>. The contest judge uses the classic rules.</p>`
      : "";
    return `${modsHTML(g, true)}${rulesBoxHTML(g.rules)}
      <section class="panel" aria-label="Moves">
        <div class="toolbar"><h2 style="margin:0">Moves (${S.moves.length})</h2>${btn("Undo", "undo", { err: S.moves.length ? "" : "Nothing to undo", title: "Undo the last move" })}</div>
        <div style="margin-top:8px">${logHTML(S.moves, S.labels, 0, 0)}</div>
      </section>
      <section class="panel export" aria-label="Export">
        <h2>Output file</h2>
        ${rulesNote}<textarea id="export-text" readonly spellcheck="false" aria-label="Output text">${esc(out)}</textarea>
        <div class="actions" style="margin-top:8px">${btn("Copy", "copy")}${btn("Download", "download")}
          <span class="muted" style="font-size:12px">${esc(sourceLabel())}${g.rules.name !== "classic" ? ` · ${esc(g.rules.name)} rules` : ""}</span></div>
        <div class="msg" id="export-msg" role="status" aria-live="polite"></div>
      </section>`;
  }

  function sourceLabel() { return S.source.type === "seed" ? `seed ${S.source.seed}` : "custom input"; }

  function renderPlay() {
    const g = S.game;
    let main = statusHTML(g);
    if (g.phase === "play") {
      main += playPanelHTML(g, true);
      const nextN = S.sel.length ? Math.min(S.sel.length, g.pile.length) : 0;
      main += pileHTML(g, g.pile, "Draw pile", nextN ? `gold = the ${nextN} card${nextN === 1 ? "" : "s"} you'd draw next` : "next card first", nextN);
      main += handTableHTML(g, true, S.sel.length && S.sel.length <= 5 ? g.evaluate(S.sel).hand : null);
    } else if (g.phase === "shop") {
      main += shopHTML(g);
      main += handTableHTML(g, true, null);
      main += pileHTML(g, UI.nextRoundPile(g), `Round ${g.round + 2} draw order`, "in draw order \u00b7 gold = your opening hand", Math.min(g.hand_size, UI.nextRoundPile(g).length));
    } else {
      main += summaryHTML(g);
      main += handTableHTML(g, false, null);
    }
    $("play-main").innerHTML = main;
    $("play-side").innerHTML = sideHTML(g);
    Feel.afterRender(g);
    Scroll.fill(g);
  }

  // ---------- replay
  function runReplay() {
    const input = $("rp-input").value, output = $("rp-output").value;
    const [code, v] = PR.check(input, output, S.rules);
    const rp = { code, verdict: v, rules: S.rules, inst: null, moves: [], states: null, errorAt: null, error: null, labels: [] };
    try { rp.inst = PR.parseInstance(input); } catch (e) { if (!(e instanceof PR.BadInput)) throw e; }
    if (rp.inst) {
      try { rp.moves = PR.parseOutput(output); } catch (e) { rp.moves = null; }
    }
    if (rp.inst && rp.moves) {
      const r = UI.replayStates(rp.inst, rp.moves, S.rules);
      rp.states = r.states; rp.errorAt = r.errorAt; rp.error = r.error;
      rp.labels = rp.moves.map((m, i) => (i < r.states.length ? UI.describe(r.states[i], m) : ""));
    }
    S.rp = rp;
    S.rpStep = rp.states ? (rp.errorAt ? rp.states.length - 1 : 0) : 0;
    renderReplay();
  }

  function renderReplay() {
    const rp = S.rp;
    const vEl = $("rp-verdict");
    if (!rp) { vEl.innerHTML = ""; $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    const codeName = ["valid", "illegal move", "unparsable output", "bad input"][rp.code];
    const by = rp.rules !== "classic" ? ` <span class="rules-tag">${esc(UI.rulesTitle(rp.rules))} rules</span>` : "";
    vEl.innerHTML = rp.verdict.valid
      ? `<div class="okmsg"><b>Valid.</b> ${esc(UI.verdictText(rp.code, rp.verdict))}${by}</div>`
      : `<div class="err"><b>Invalid (${codeName}, exit ${rp.code}), score 0.</b> ${esc(rp.verdict.error)}${by}</div>`;
    if (!rp.states) { $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    $("rp-stepper-panel").classList.remove("hidden");
    $("rp-board").classList.remove("hidden");
    const n = rp.states.length - 1;
    const k = Math.max(0, Math.min(S.rpStep, n));
    S.rpStep = k;
    const slider = $("rp-slider");
    slider.max = String(n); slider.value = String(k);
    $("rp-pos").textContent = `move ${k} / ${rp.moves.length}`;
    const g = rp.states[k];

    // The next move's cards are highlighted on this board; the last move is shown separately.
    const nextMove = k < rp.moves.length ? rp.moves[k] : null;
    const nextCards = nextMove ? new Set(UI.moveCards(nextMove)) : new Set();
    let nextScored = new Set();
    if (nextMove && /^play\b/.test(nextMove) && !g.tryMove(nextMove)) nextScored = new Set(g.evaluate(UI.moveCards(nextMove)).scored);
    let last = "";
    if (k > 0) {
      const prev = rp.states[k - 1], m = rp.moves[k - 1];
      const cards = UI.moveCards(m);
      let res = null;
      if (/^play\b/.test(m)) res = prev.evaluate(cards, true);
      const scored = new Set(res ? res.scored : []);
      const faces = cards.map((c) => cardHTML(prev, c, { cls: /^play\b/.test(m) ? "sel " + (scored.has(c) ? "scored" : "kicker") : "", tag: res ? (scored.has(c) ? "scores" : "kicker") : "" })).join("");
      last = `<div class="lastmove"><div><span class="muted">Move ${k}:</span> <b class="mono">${esc(m)}</b> <span class="muted">${esc(rp.labels[k - 1] || "")}</span></div>
        ${faces ? `<div class="cards" style="padding-bottom:10px">${faces}</div>` : ""}
        ${res ? `<div class="formula mono" style="font-size:13px">${esc(PR.HAND_NAMES[res.hand])}: ${esc(UI.formula(res))}${res.money ? ` · +$${res.money}` : ""}</div>` : ""}</div>`;
    }
    let nextLine = "";
    if (nextMove) {
      const bad = rp.errorAt === k + 1;
      nextLine = `<div class="${bad ? "err" : "muted"}" style="margin-top:8px">Next, move ${k + 1}: <b class="mono">${esc(nextMove)}</b>${bad ? ` — illegal: ${esc(rp.error)}` : ` <span>${esc(rp.labels[k] || "")}</span> (highlighted)`}</div>`;
    } else if (k === rp.moves.length) {
      nextLine = `<div class="muted" style="margin-top:8px">End of the output.${g.over ? "" : " The run was not finished; the score is the points so far."}</div>`;
    }
    let main = statusHTML(g);
    if (g.phase === "play") {
      main += `<section class="panel" aria-label="Hand at this step"><h2>Hand</h2><div class="hand">${handHTML(g, { interactive: false, highlight: nextCards, hlScored: nextScored })}</div>${last}${nextLine}</section>`;
      main += pileHTML(g, g.pile, "Draw pile", "next card first", 0, nextCards);
    } else if (g.phase === "shop") {
      const offers = g.visibleSlots().map(({ name, taken }) => `<span class="chip${taken ? "" : " on"}">${esc(UI.prettyMod(name))}${taken ? " (bought)" : ` $${g.rules.price(name)}`}</span>`).join(" ");
      main += `<section class="panel" aria-label="Shop at this step"><h2>Shop after round ${g.round + 1}</h2>
        <div class="parts">${offers || '<span class="muted">No offers left in the window.</span>'}</div>
        <p class="muted" style="font-size:13px">Prices: reroll $${g.prices().reroll}, +discard $${g.prices().discards}, +hand size $${g.prices().handsize}, remove $${g.prices().remove}, paint $${g.prices().paint}, promote $${g.prices().promote}.</p>
        ${last}${nextLine}</section>`;
      const deck = UI.deckOrder(g).map((c) => cardHTML(g, c, { size: "deckc", cls: (g.in_deck[c] ? "" : "gone") + (nextCards.has(c) ? " hl" : "") })).join("");
      main += `<section class="panel" aria-label="Deck"><h2>Deck (${g.deck_size} cards)</h2><div class="deckgrid">${deck}</div></section>`;
    } else {
      const o = UI.outcome(g);
      main += `<section class="panel summary"><div class="big">${UI.num(o.score)}</div><div class="sub">cleared ${o.cleared} of ${o.rounds} rounds</div><p>${esc(o.text)}</p>${last}${nextLine}</section>`;
    }
    main += handTableHTML(g, false, null);
    $("rp-main").innerHTML = main;
    $("rp-side").innerHTML = modsHTML(g, false) + `<section class="panel"><h2>Moves (${rp.moves.length})</h2>${logHTML(rp.moves, rp.labels, k, rp.errorAt || 0)}</section>`;
    const cur = document.querySelector("#rp-log li.cur");
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }

  // ---------- top-level render
  function render() {
    $("view-play").classList.toggle("hidden", S.mode !== "play");
    $("view-replay").classList.toggle("hidden", S.mode !== "replay");
    $("tab-play").setAttribute("aria-selected", String(S.mode === "play"));
    $("tab-replay").setAttribute("aria-selected", String(S.mode === "replay"));
    $("source-bar").classList.toggle("hidden", S.mode !== "play");
    document.querySelectorAll('[data-act="rules"]').forEach((b) => b.setAttribute("aria-checked", String(b.dataset.v === S.rules)));
    if (S.mode === "play") renderPlay(); else renderReplay();
    Scroll.request();
  }

  const cssEsc = (s) => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"));

  // Re-render, keeping keyboard focus on the same control where possible.
  function renderKeepFocus() {
    const a = document.activeElement;
    const key = a && a.dataset ? [a.dataset.act, a.dataset.id, a.dataset.v] : null;
    render();
    if (key && key[0]) {
      const sel = `[data-act="${key[0]}"]` + (key[1] !== undefined ? `[data-id="${key[1]}"]` : "") + (key[2] !== undefined ? `[data-v="${cssEsc(key[2])}"]` : "");
      const el = document.querySelector(sel);
      if (el && !el.disabled) el.focus();
    }
  }

  function flash(id, kind, text) {
    const el = $(id);
    if (el) el.innerHTML = `<div class="${kind === "err" ? "err" : "okmsg"}">${esc(text)}</div>`;
  }

  // ---------- actions
  function readFile(input, cb) {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cb(String(r.result));
    r.onerror = () => cb(null);
    r.readAsText(f);
  }

  function dealSeed(seed) {
    if (!Number.isSafeInteger(seed)) { S.msg = { kind: "err", text: "The seed must be a whole number." }; render(); return; }
    startFromSource({ type: "seed", seed });
    S.msg = null;
    render();
  }

  const actions = {
    mode(el) {
      S.mode = el.dataset.v; Sound.tap(); render();
      if (S.mode === "replay" && S.rp && S.rp.rules !== S.rules) runReplay();   // checked with other rules
    },
    rules(el) {
      const v = el.dataset.v;
      if (v === S.rules || !Object.prototype.hasOwnProperty.call(PR.RULESETS, v)) return;
      if (S.moves.length && !S.game.over &&
          !window.confirm(`Switch to the ${UI.rulesTitle(v)} rules? Your current run (${S.moves.length} moves) starts again from the first move.`)) return;
      S.rules = v;
      Sound.shuffle();
      startFromSource(S.source, []);
      S.msg = { kind: "ok", text: `${UI.rulesTitle(v)} rules: ${v === "classic" ? "the contest's rules" : UI.rulesChanges(v).length + " changes from classic (see the side panel)"}. The run starts again.` };
      if (S.mode === "replay" && S.rp) runReplay();   // re-check the loaded replay with the new rules
      render();
    },
    deal() { Sound.shuffle(); dealSeed(Number($("seed").value)); },
    "random-seed"() { const s = Math.floor(Math.random() * 1000000) + 1; S.mode = "play"; dealSeed(s); },
    "toggle-load"() {
      const p = $("load-panel"); p.classList.toggle("hidden");
      document.querySelectorAll('[data-act="toggle-load"]').forEach((b) => b.setAttribute("aria-expanded", String(!p.classList.contains("hidden"))));
      if (!p.classList.contains("hidden")) $("load-text").focus();
    },
    "load-input"() {
      const text = $("load-text").value;
      try { startFromSource({ type: "text", text }); } catch (e) {
        if (e instanceof PR.BadInput) { flash("load-msg", "err", "Bad input: " + e.message); return; }
        throw e;
      }
      flash("load-msg", "ok", "Loaded. Good luck.");
      S.msg = null;
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
      render();
    },
    card(el) {
      const id = Number(el.dataset.id);
      const i = S.sel.indexOf(id);
      if (i >= 0) { S.sel.splice(i, 1); Sound.deselect(S.game.rank[id]); }
      else if (S.sel.length < 5) { S.sel.push(id); Sound.select(S.game.rank[id]); }
      else { S.msg = { kind: "err", text: "At most 5 cards: deselect one first." }; Sound.oops(); renderKeepFocus(); return; }
      S.msg = null;
      renderKeepFocus();
    },
    "clear-sel"() { S.sel = []; Sound.tap(); render(); },
    sound() { Sound.toggle(); soundIcon(); },
    play() { doMove("play " + S.sel.join(" ")); },
    discard() { doMove("discard " + S.sel.join(" ")); },
    end() { doMove("end"); },
    buy(el) { doMove("buy " + el.dataset.v); },
    sell(el) { doMove("sell " + el.dataset.v); },
    level(el) { doMove("level " + el.dataset.v); },
    reroll() { doMove("reroll"); },
    discards() { doMove("discards"); },
    handsize() { doMove("handsize"); },
    next() { doMove("next"); },
    "deck-pick"(el) {
      const v = el.dataset.id !== undefined ? Number(el.dataset.id) : null;
      S.deckPick = v === null || v === S.deckPick ? null : v;
      renderKeepFocus();
    },
    remove() { if (S.deckPick !== null) doMove("remove " + S.deckPick); },
    paint(el) { if (S.deckPick !== null) doMove(`paint ${S.deckPick} ${PR.SUITS[Number(el.dataset.v)]}`); },
    promote() { if (S.deckPick !== null) doMove("promote " + S.deckPick); },
    undo() { undo(); },
    copy() {
      const text = outputText();
      const done = () => flash("export-msg", "ok", "Copied to the clipboard.");
      const fallback = () => {
        const ta = $("export-text"); ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) done(); else flash("export-msg", "err", "Couldn't copy automatically: the text is selected, press Ctrl/Cmd+C.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    },
    download() {
      const blob = new Blob([outputText()], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const tag = S.rules !== "classic" ? "_" + S.rules : "";
      a.download = S.source.type === "seed" ? `poker_run_seed${S.source.seed}${tag}_out.txt` : `poker_run${tag}_out.txt`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      flash("export-msg", "ok", `Saved ${a.download}.`);
    },
    "rp-seed"() {
      const s = Number($("rp-seed").value);
      if (!Number.isSafeInteger(s)) { $("rp-verdict").innerHTML = '<div class="err">The seed must be a whole number.</div>'; return; }
      $("rp-input").value = PR.formatInstance(PR.generate(s));
    },
    "rp-run"() { runReplay(); },
    "rp-from-play"() {
      $("rp-input").value = S.inputText;
      $("rp-output").value = outputText();
      S.mode = "replay";
      render();
      runReplay();
      S.rpStep = S.rp && S.rp.states ? S.rp.states.length - 1 : 0;
      renderReplay();
    },
    "rp-step"(el) {
      if (!S.rp || !S.rp.states) return;
      const n = S.rp.states.length - 1, v = el.dataset.v;
      S.rpStep = v === "first" ? 0 : v === "last" ? n : Math.max(0, Math.min(n, S.rpStep + Number(v)));
      Sound.tap();
      renderReplay();
    },
    "rp-continue"() {
      if (!S.rp || !S.rp.states) return;
      const text = $("rp-input").value;
      try { startFromSource({ type: "text", text }, S.rp.moves.slice(0, S.rpStep)); } catch (e) {
        if (e instanceof PR.BadInput) return;
        throw e;
      }
      S.mode = "play";
      S.msg = { kind: "ok", text: `Loaded ${S.moves.length} moves from the replay.` };
      render();
    },
  };

  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest("[data-act], .tab");
    if (el && !el.disabled) Feel.ripple(ev);
  });
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
    const li = ev.target.closest("#rp-log li[data-step]");
    if (li) { S.rpStep = Number(li.dataset.step); renderReplay(); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "sort-hand") { S.sort = ev.target.value; save(); render(); }
  });
  $("seed").addEventListener("keydown", (ev) => { if (ev.key === "Enter") actions.deal(); });
  $("rp-slider").addEventListener("input", (ev) => { S.rpStep = Number(ev.target.value); renderReplay(); });
  $("load-file").addEventListener("change", (ev) => readFile(ev.target, (t) => {
    if (t === null) flash("load-msg", "err", "Couldn't read that file.");
    else { $("load-text").value = t; flash("load-msg", "ok", "File read. Press “Start with this input”."); }
  }));
  $("rp-input-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-input").value = t; }));
  $("rp-output-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-output").value = t; }));

  // ---------- boot
  const hashSeed = /(?:^#|&)seed=(-?\d+)/.exec(location.hash);
  const hashRules = /(?:^#|&)rules=(\w+)/.exec(location.hash);
  const saved = restore();
  if (saved && saved.sort) S.sort = saved.sort;
  const known = (r) => typeof r === "string" && Object.prototype.hasOwnProperty.call(PR.RULESETS, r);
  const savedRules = saved && known(saved.rules) ? saved.rules : "classic";
  S.rules = hashRules && known(hashRules[1]) ? hashRules[1] : hashSeed ? "classic" : savedRules;
  // Saved moves only make sense with the rules they were played by.
  if (saved && savedRules !== S.rules) saved.moves = [];
  try {
    if (hashSeed) {
      const seed = Number(hashSeed[1]);
      const same = saved && saved.source && saved.source.type === "seed" && saved.source.seed === seed;
      startFromSource({ type: "seed", seed }, same ? saved.moves : []);
    } else if (saved && saved.source) startFromSource(saved.source, saved.moves || []);
    else startFromSource({ type: "seed", seed: 1 });
  } catch (e) {
    startFromSource({ type: "seed", seed: 1 });
  }
  $("rp-seed").value = $("seed").value;
  soundIcon();
  render();
}
