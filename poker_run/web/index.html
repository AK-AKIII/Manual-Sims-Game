    const label = UI.describe(S.game, line);
    try { g.apply(line); } catch (e) {
      if (e instanceof PR.IllegalMove) { S.msg = { kind: "err", text: `${line}: ${e.message}` }; Sound.oops(); renderKeepFocus(); return false; }
      throw e;
    }
    S.game = g;
    S.moves.push(line);
    S.labels.push(label);
    S.sel = S.sel.filter((c) => g.hand.includes(c) && g.phase === "play");
    if (g.phase !== "play") S.sel = [];
    S.msg = null;
    if (S.deckPick !== null && (!g.in_deck[S.deckPick] || g.phase !== "shop")) S.deckPick = null;
    save();
    renderKeepFocus();
    Feel.afterMove(line, before, g);
    return true;
  }

  function undo() {
    if (M.stash && S.kind === "online") { S.msg = { kind: "err", text: "Moves sent to the room can't be undone." }; Sound.oops(); render(); return; }
    if (M.stash) { mpUndo(); return; }
    if (!S.moves.length) return;
    const last = S.moves[S.moves.length - 1];
    setMoves(S.moves.slice(0, -1));
    S.msg = { kind: "ok", text: `Undid "${last}".` };
    save();
    render();
  }

  function outputText() { return PR.formatOutput(S.moves); }

  // ---------- rendering pieces
  function cardHTML(g, id, o) {
    o = o || {};
    const r = g.rank[id], s = g.suit[id];
    const cls = ["card", UI.isRed(s) ? "red" : ""];
    if (o.size) cls.push(o.size);
    if (o.cls) cls.push(o.cls);
    const label = UI.rankLabel(r), glyph = UI.SUIT_GLYPH[s];
    const mod = UI.isModified(g, id) ? '<span class="dot" title="painted or promoted"></span>' : "";
    const tag = o.tag ? `<span class="tag">${esc(o.tag)}</span>` : "";
    const inner = `<span class="tl">${label}<i>${glyph}</i></span><span class="cid">${id}</span>` +
      `<span class="mid">${glyph}</span><span class="br">${label}<i>${glyph}</i></span>${mod}${tag}`;
    const aria = `${label} of ${["spades", "hearts", "diamonds", "clubs"][s]}, card ${id}` + (o.aria ? ", " + o.aria : "");
    if (o.act) {
      return `<button type="button" class="${cls.join(" ")}" data-act="${o.act}" data-id="${id}" aria-pressed="${o.pressed ? "true" : "false"}" aria-label="${esc(aria)}">${inner}</button>`;
    }
    return `<div class="${cls.join(" ")}" role="img" aria-label="${esc(aria)}">${inner}</div>`;
  }

  function btn(label, act, opts) {
    opts = opts || {};
    const dis = opts.err ? " disabled" : "";
    const title = opts.err ? ` title="${esc(opts.err)}"` : opts.title ? ` title="${esc(opts.title)}"` : "";
    const v = opts.v !== undefined ? ` data-v="${esc(opts.v)}"` : "";
    const price = opts.price !== undefined ? `<span class="price">$${opts.price}</span>` : "";
    return `<button type="button" class="btn${opts.cls ? " " + opts.cls : ""}" data-act="${act}"${v}${dis}${title}${opts.aria ? ` aria-label="${esc(opts.aria)}"` : ""}>${label}${price}</button>`;
  }

  function statusHTML(g) {
    const R = g.inst.rounds;
    const target = Number(g.target);
    const pct = target > 0 ? Math.min(100, (100 * g.round_score) / target) : 100;
    const done = g.round_score >= g.target;
    let phase = g.phase === "play" ? "round" : g.phase === "shop" ? "shop" : "run over";
    const roundLine = g.phase === "shop"
      ? `<div class="progress-label"><span>Round ${g.round + 1} cleared with ${UI.num(g.round_score)}</span><span>Next target ${UI.num(g.inst.targets[g.round + 1])}</span></div>`
      : `<div class="progress-label"><span>${UI.num(g.round_score)} / ${UI.num(g.target)}</span><span>${done ? "target reached" : UI.num(Math.max(0, target - g.round_score)) + " to go"}</span></div>`;
    return `<section class="panel" aria-label="Round status">
      <div class="toolbar" style="margin-bottom:10px"><h2 style="margin:0">Round ${g.round + 1} of ${R}</h2><span>${g.rules.name !== "classic" ? `<span class="rules-tag" title="Scored by the ${esc(g.rules.name)} rules">${esc(UI.rulesTitle(g.rules.name))} rules</span>` : ""}<span class="phase-tag">${phase}</span></span></div>
      <div class="stats">
        <div class="stat"><div class="k">Target</div><div class="v">${UI.num(g.target)}</div></div>
        <div class="stat"><div class="k">Round pts</div><div class="v" data-num="round">${UI.num(g.round_score)}</div></div>
        <div class="stat"><div class="k">Plays</div><div class="v">${g.phase === "play" ? g.plays_left : "–"}<small> / ${g.inst.plays}</small></div></div>
        <div class="stat"><div class="k">Discards</div><div class="v">${g.phase === "play" ? g.discards_left : "–"}<small> / ${g.inst.discards + g.extra_discards}</small></div></div>
        <div class="stat"><div class="k">Hand size</div><div class="v">${g.hand_size}</div></div>
        <div class="stat money"><div class="k">Money</div><div class="v" data-num="money" data-prefix="$">$${g.money}</div></div>
        <div class="stat"><div class="k">Total score</div><div class="v gold" data-num="total">${UI.num(g.total)}</div></div>
      </div>
      <div class="progress${done ? " done" : ""}" role="progressbar" aria-label="Round points" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${g.round_score}">
        <div class="bar" style="width:${pct}%"></div>
      </div>
      ${roundLine}
    </section>`;
  }

  function pileHTML(g, ids, title, hint, nextN, hlSet) {
    if (!ids.length) return `<section class="panel"><h2>${title}</h2><p class="muted" style="margin:0">Empty: no more cards to draw this round.</p></section>`;
    const items = ids.map((c, i) => `<div class="slot">${cardHTML(g, c, { size: "mini", cls: (i < nextN ? "next-draw" : "") + (hlSet && hlSet.has(c) ? " hl" : "") })}<div class="pos">${i + 1}</div></div>`).join("");
    return `<section class="panel"><div class="toolbar"><h2>${title}</h2><span class="muted" style="font-size:12px">${hint}</span></div><div class="strip" tabindex="0" aria-label="${esc(title)}">${items}</div></section>`;
  }

  function previewHTML(g) {
    const p = UI.preview(g, S.sel);
    if (!p) return `<div class="preview muted" aria-live="polite">Select 1 to 5 cards to see what they score. The input shows every future draw, so plan ahead with the draw pile below.</div>`;
    if (!p.res) return `<div class="preview" aria-live="polite"><span class="err">At most 5 cards can be played or discarded.</span></div>`;
    const r = p.res;
    const parts = r.parts.filter((x) => x.base || x.mult || x.times !== 1 || x.money).map((x) => {
      const bits = [];
      if (x.base) bits.push(`+${x.base} base`);
      if (x.mult) bits.push(`+${x.mult} mult`);
      if (x.times !== 1) bits.push(`×${x.times}`);
      if (x.money) bits.push(`+$${x.money}`);
      return `<span class="chip on">${esc(UI.prettyMod(x.name))}: ${bits.join(", ")}</span>`;
    }).join("");
    let after = "";
    if (p.after) {
      if (p.after.phase === "play") after = `Round would be at ${UI.num(p.after.round_score)} / ${UI.num(g.target)}.`;
      else if (p.after.cleared) after = `Ends the round: cleared with ${UI.num(p.after.round_score)}, money becomes $${p.after.money}.`;
      else after = `Ends the round below target (${UI.num(p.after.round_score)} / ${UI.num(g.target)}): the run would be over.`;
    }
    const kick = S.sel.length - r.scored.length;
    return `<div class="preview" aria-live="polite">
      <div class="toolbar"><span class="hand-name">${esc(PR.HAND_NAMES[r.hand])} <span class="muted" style="font-size:14px;font-weight:600">level ${g.levels[r.hand]}</span></span>
      <span class="gold" style="font-size:22px;font-weight:800">${UI.num(r.points)} pts${r.money ? ` · +$${r.money}` : ""}</span></div>
      <div class="formula">base <b>${r.base}</b> × mult <b>${r.mult}</b>${r.times !== 1 ? ` × <b>${r.times}</b>` : ""} &nbsp;·&nbsp; ${esc(UI.formula(r))}</div>
      <div class="muted" style="font-size:13px;margin-top:4px">${r.scored.length} scored card${r.scored.length === 1 ? "" : "s"}${kick ? `, ${kick} kicker${kick === 1 ? "" : "s"}` : ""}. ${esc(after)}</div>
      ${parts ? `<div class="parts">${parts}</div>` : ""}
    </div>`;
  }

  function handHTML(g, opts) {
    const sel = new Set(opts.selected || []);
    const res = opts.selected && opts.selected.length && opts.selected.length <= 5 ? g.evaluate(opts.selected) : null;
    const scored = new Set(res ? res.scored : []);
    const hl = opts.highlight || new Set();
    const hlScored = opts.hlScored || new Set();
    return UI.sortedHand(g, opts.sort || "draw").map((c) => {
      let cls = "", tag = "";
      if (sel.has(c)) { cls = "sel " + (scored.has(c) ? "scored" : "kicker"); tag = scored.has(c) ? "scores" : "kicker"; }
      if (hl.has(c)) { cls += " hl" + (hlScored.has(c) ? " scored" : ""); }
      return cardHTML(g, c, { act: opts.interactive ? "card" : null, cls, tag, pressed: sel.has(c),
        aria: sel.has(c) ? "selected" : "" });
    }).join("");
  }

  function playPanelHTML(g, interactive) {
    const sel = S.sel;
    const p = interactive ? UI.preview(g, sel) : null;
    const playErr = !sel.length ? "Select 1 to 5 cards" : p ? p.playErr : "";
    const discErr = !sel.length ? "Select 1 to 5 cards" : p ? p.discardErr : "";
    const endErr = g.tryMove("end");
    const reward = !endErr ? UI.roundReward(g) : 0;
    const sortSel = `<label class="muted" style="font-size:13px">Order <select id="sort-hand" aria-label="Hand order">
        ${["draw", "rank", "suit"].map((v) => `<option value="${v}"${S.sort === v ? " selected" : ""}>${v === "draw" ? "as drawn" : "by " + v}</option>`).join("")}
      </select></label>`;
    return `<section class="panel" aria-label="Your hand">
      <div class="toolbar"><h2 style="margin:0">Hand <span class="muted" style="text-transform:none;letter-spacing:0">(${g.hand.length} cards)</span></h2>${sortSel}</div>
      <div class="hand" id="hand">${handHTML(g, { interactive: true, selected: sel, sort: S.sort })}</div>
      <div class="actions">
        ${btn(`Play${sel.length ? " " + sel.length : ""}`, "play", { cls: "primary", err: playErr })}
        ${btn(`Discard${sel.length ? " " + sel.length : ""}`, "discard", { err: discErr })}
        ${btn("End round", "end", { err: endErr, title: !endErr ? `Clear now for +$${reward}` : "" })}
        ${btn("Clear selection", "clear-sel", { err: sel.length ? "" : "Nothing selected" })}
        ${!endErr ? `<span class="muted" style="font-size:13px">Ending now pays +$${reward}</span>` : ""}
      </div>
      ${previewHTML(g)}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>`;
  }

  function handTableHTML(g, interactive, litCode) {
    const classic = PR.getRuleset("classic");
    const rows = g.rules.hands.map(([code, name]) => {
      const lvl = g.levels[code];
      const [b, m] = g.rules.handValue(code, lvl);
      const [cb, cm] = classic.handValue(code, lvl);
      const cell = (v, c) => (v !== c ? `<td class="num changed" title="classic: ${c}">${v}</td>` : `<td class="num">${v}</td>`);
      const err = g.phase === "shop" ? g.tryMove("level " + code) : "Only in the shop";
      const action = interactive && g.phase === "shop" ? `<td class="num">${btn("Level up", "level", { v: code, price: g.levelPrice(code), err, cls: "small", aria: `Level up ${name} for $${g.levelPrice(code)}` })}</td>` : "";
      return `<tr class="${code === litCode ? "lit" : ""}"><td class="mono">${code}</td><td>${name}</td><td class="num">${lvl}</td>${cell(b, cb)}${cell(m, cm)}${action}</tr>`;
    }).join("");
    const head = interactive && g.phase === "shop" ? '<th class="num">Price</th>' : "";
    const note = g.rules.name !== "classic" ? `<span class="muted" style="font-size:12px">${esc(UI.rulesTitle(g.rules.name))} values · green = changed</span>` : "";
    return `<section class="panel" aria-label="Hand types"><div class="toolbar"><h2 style="margin:0">Hand types</h2>${note}</div><div class="scroll-x"><table class="hands">
      <thead><tr><th>Code</th><th>Hand</th><th class="num">Lvl</th><th class="num">Base</th><th class="num">Mult</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
  }

  function modsHTML(g, interactive) {
    const list = g.mods.map(([name, state]) => {
      const [price, fx] = g.rules.modifiers[name];
      const st = UI.modState(name, state, g.rules);
      const sell = interactive && g.phase === "shop" ? btn("Sell", "sell", { v: name, cls: "small", title: `Sell for $${Math.floor(price / 2)}`, aria: `Sell ${name} for $${Math.floor(price / 2)}` }) + ` <span class="muted" style="font-size:12px">+$${Math.floor(price / 2)}</span>` : `<span class="muted" style="font-size:12px">$${price}</span>`;
      return `<div class="mod"><span class="name">${esc(UI.prettyMod(name))}</span><span>${sell}</span><span class="fx">${esc(fx)}</span>${st ? `<span class="state">${esc(st)}</span>` : ""}</div>`;
    }).join("");
    return `<section class="panel" aria-label="Modifiers"><div class="toolbar"><h2 style="margin:0">Modifiers</h2><span class="slots-left">${g.mods.length} / ${g.inst.slots} slots</span></div>
      <div class="mods" style="margin-top:8px">${list || '<p class="muted" style="margin:0">None yet. Buy them in the shop after each round.</p>'}</div></section>`;
  }

  function shopHTML(g) {
    const prices = g.prices();
    const queue = g.inst.offers[g.round];
    const ctx = shopCtx(g);   // the shared shop of an online draft: who owns what
    const offers = g.visibleSlots().map(({ name, taken }) => {
      const [price, fx] = g.rules.modifiers[name];
      const owner = ctx.owner(name);
      if (taken) return `<div class="offer sold"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">Bought</div></div>`;
      if (owner) return `<div class="offer sold" style="--pc:${COLORS[owner.seat]}"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">Drafted by <span class="pname">${esc(owner.name)}</span></div></div>`;
      const err = ctx.buyErr(name);
      return `<div class="offer"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">${esc(fx)}</div>
        <div class="row"><span class="cost">$${price}</span>${btn("Buy", "buy", { v: name, cls: "primary small", err, aria: `Buy ${name} for $${price}` })}</div></div>`;
    }).join("");
    const later = queue.slice(g.offer_pos + g.rules.shop_window).map((m) => {
      const owner = ctx.owner(m);
      const tip = owner ? `drafted by ${owner.name}` : g.rules.modifiers[m] ? `$${g.rules.modifiers[m][0]}: ${g.rules.modifiers[m][1]}` : "";
      return `<span class="chip" title="${esc(tip)}"${owner ? ' style="opacity:.45;text-decoration:line-through"' : ""}>${esc(UI.prettyMod(m))}</span>`;
    }).join("");
    const pick = S.deckPick;
    let deckActions = '<span class="muted">Pick a card below to remove, paint or promote it.</span>';
    if (pick !== null && g.in_deck[pick]) {
      const paint = [0, 1, 2, 3].map((s) => btn(UI.SUIT_GLYPH[s], "paint", { v: s, cls: "small", err: g.tryMove(`paint ${pick} ${PR.SUITS[s]}`), aria: `Paint card ${pick} ${["spades", "hearts", "diamonds", "clubs"][s]} for $${prices.paint}` })).join("");
      deckActions = `${cardHTML(g, pick, { size: "mini" })}
        <span>Card <b class="mono">${pick}</b> (${esc(UI.faceText(g, pick))})</span>
        ${btn("Remove", "remove", { price: prices.remove, err: g.tryMove("remove " + pick), cls: "small" })}
        <span class="muted" style="font-size:13px">Paint $${prices.paint}</span>${paint}
        ${btn("Promote", "promote", { price: prices.promote, err: g.tryMove("promote " + pick), cls: "small" })}
        ${btn("Done", "deck-pick", { v: "", cls: "small" })}`;
    }
    const deck = UI.deckOrder(g).map((c) => g.in_deck[c]
      ? cardHTML(g, c, { size: "deckc", act: "deck-pick", cls: c === pick ? "pick" : "", pressed: c === pick })
      : cardHTML(g, c, { size: "deckc", cls: "gone", aria: "removed" })).join("");
    return `<section class="panel" aria-label="Shop">
      <div class="toolbar"><h2 style="margin:0">Shop after round ${g.round + 1}</h2>
        <div class="actions">${btn(ctx.next, "next", { cls: "primary", err: g.tryMove("next") })}</div></div>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">Offers ${g.offer_pos + 1}–${Math.min(g.offer_pos + g.rules.shop_window, queue.length)} of ${queue.length} in this shop's queue.${ctx.note ? ` ${esc(ctx.note)}` : ""}</p>
      <div class="offers">${offers || '<p class="muted">No offers.</p>'}</div>
      <div class="actions" style="margin-top:10px">
        ${btn("Reroll", "reroll", { price: prices.reroll, err: g.tryMove("reroll") })}
        ${btn("+1 discard", "discards", { price: prices.discards, err: g.tryMove("discards"), title: "+1 discard every round from now on" })}
        ${btn("+1 hand size", "handsize", { price: prices.handsize, err: g.tryMove("handsize"), title: `+1 hand size (max ${g.rules.max_hand_size})` })}
      </div>
      ${later ? `<div class="queue-later"><span class="muted">Later in the queue:</span>${later}</div>` : ""}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>
    <section class="panel" aria-label="Deck editor">
      <div class="toolbar"><h2 style="margin:0">Deck</h2><span class="muted" style="font-size:13px">${g.deck_size} cards (min ${g.rules.min_deck}) · gold dot = painted or promoted</span></div>
      <div class="deck-actions">${deckActions}</div>
      <div class="deckgrid">${deck}</div>
    </section>`;
  }

  function summaryHTML(g) {
    const o = UI.outcome(g);
    return `<section class="panel summary" aria-label="Run summary">
      <div class="muted" style="text-transform:uppercase;letter-spacing:.14em;font-size:13px">${o.won ? "Run complete" : "Run over"}</div>
      <div class="big">${UI.num(o.score)}</div>
      <div class="sub">points · cleared ${o.cleared} of ${o.rounds} rounds</div>
      <p>${esc(o.text)}</p>
      <div class="actions" style="justify-content:center">${btn("Undo last move", "undo", { err: S.moves.length ? "" : "Nothing to undo" })}${btn("Replay this run", "rp-from-play")}${btn("Deal a new seed", "random-seed", { cls: "primary" })}</div>
    </section>`;
  }

  function logHTML(moves, labels, cur, bad) {
    const items = moves.map((m, i) => `<li class="${i + 1 === cur ? "cur" : ""}${i + 1 === bad ? " bad" : ""}"${S.mode === "replay" ? ` data-step="${i + 1}"` : ""}><span class="n">${i + 1}</span><span><span class="m">${esc(m)}</span>${labels[i] ? ` <span class="d">${esc(labels[i])}</span>` : ""}</span></li>`).join("");
    return `<ol class="log" id="${S.mode === "replay" ? "rp-log" : "play-log"}" aria-label="Move log">${items || '<li class="muted"><span></span><span>No moves yet.</span></li>'}</ol>`;
  }

  function rulesBoxHTML(rules) {
    const changes = UI.rulesChanges(rules);
    if (!changes.length) return "";
    const items = changes.map((c) => `<li><b>${esc(c.what)}</b>: ${esc(c.now)} <span title="classic">(classic: ${esc(c.was)})</span></li>`).join("");
    return `<section class="panel" aria-label="Rules in play"><details class="rules-box">
      <summary>${esc(UI.rulesTitle(PR.getRuleset(rules).name))} rules: ${changes.length} changes from classic</summary>
      <ul class="rules-notes">${items}</ul></details></section>`;
  }

  function sideHTML(g) {
    const out = outputText();
    const rulesNote = g.rules.name !== "classic"
      ? `<p class="muted" style="margin:0 0 6px;font-size:12px">Played with the <b>${esc(UI.rulesTitle(g.rules.name))}</b> rules: score it with <span class="mono">python -m poker_run check in.txt out.txt --rules ${esc(g.rules.name)}</span>. The contest judge uses the classic rules.</p>`
      : "";
    return `${modsHTML(g, true)}${rulesBoxHTML(g.rules)}
      <section class="panel" aria-label="Moves">
        <div class="toolbar"><h2 style="margin:0">Moves (${S.moves.length})</h2>${btn("Undo", "undo", { err: undoErr(), title: "Undo the last move" })}</div>
        <div style="margin-top:8px">${logHTML(S.moves, S.labels, 0, 0)}</div>
      </section>
      <section class="panel export" aria-label="Export">
        <h2>Output file</h2>
        ${rulesNote}<textarea id="export-text" readonly spellcheck="false" aria-label="Output text">${esc(out)}</textarea>
        <div class="actions" style="margin-top:8px">${btn("Copy", "copy")}${btn("Download", "download")}
          <span class="muted" style="font-size:12px">${esc(sourceLabel())}${g.rules.name !== "classic" ? ` · ${esc(g.rules.name)} rules` : ""}</span></div>
        <div class="msg" id="export-msg" role="status" aria-live="polite"></div>
      </section>`;
  }

  function sourceLabel() { return S.source.type === "seed" ? `seed ${S.source.seed}` : "custom input"; }

  function renderPlay() {
    if (S.kind === "bot" && mpRender()) return;
    if (S.kind === "online" && onlineRender()) return;
    const g = S.game;
    if (S.kind === "online") {   // your own game in an online room
      $("play-main").innerHTML = onlinePlayHTML(g);
      $("play-side").innerHTML = onlinePlayersHTML(ON.view) + sideHTML(g);
      Feel.afterRender(g);
      Scroll.fill(g);
      return;
    }
    const st = M.stash ? mpCur() : null;
    let main = (st ? mpTopHTML(st) : "") + statusHTML(g);
    if (g.phase === "play") {
      main += playPanelHTML(g, true);
      const nextN = S.sel.length ? Math.min(S.sel.length, g.pile.length) : 0;
      main += pileHTML(g, g.pile, "Draw pile", nextN ? `gold = the ${nextN} card${nextN === 1 ? "" : "s"} you'd draw next` : "next card first", nextN);
      main += handTableHTML(g, true, S.sel.length && S.sel.length <= 5 ? g.evaluate(S.sel).hand : null);
    } else if (g.phase === "shop") {
      main += shopHTML(g);
      main += handTableHTML(g, true, null);
      main += pileHTML(g, UI.nextRoundPile(g), `Round ${g.round + 2} draw order`, "in draw order \u00b7 gold = your opening hand", Math.min(g.hand_size, UI.nextRoundPile(g).length));
    } else {
      main += summaryHTML(g);
      main += handTableHTML(g, false, null);
    }
    $("play-main").innerHTML = main;
    $("play-side").innerHTML = (st ? mpSideHTML(st) : "") + sideHTML(g);
    Feel.afterRender(g);
    Scroll.fill(g);
    if (st) mpAfterRender(st);
  }

  // ---------- replay
  function runReplay() {
    const input = $("rp-input").value, output = $("rp-output").value;
    const rules = S.rpRules || S.rules;
    const [code, v] = PR.check(input, output, rules);
    const rp = { code, verdict: v, rules, inst: null, moves: [], states: null, errorAt: null, error: null, labels: [] };
    try { rp.inst = PR.parseInstance(input); } catch (e) { if (!(e instanceof PR.BadInput)) throw e; }
    if (rp.inst) {
      try { rp.moves = PR.parseOutput(output); } catch (e) { rp.moves = null; }
    }
    if (rp.inst && rp.moves) {
      const r = UI.replayStates(rp.inst, rp.moves, rules);
      rp.states = r.states; rp.errorAt = r.errorAt; rp.error = r.error;
      rp.labels = rp.moves.map((m, i) => (i < r.states.length ? UI.describe(r.states[i], m) : ""));
    }
    S.rp = rp;
    S.rpStep = rp.states ? (rp.errorAt ? rp.states.length - 1 : 0) : 0;
    renderReplay();
  }

  function renderReplay() {
    const rp = S.rp;
    const vEl = $("rp-verdict");
    if (!rp) { vEl.innerHTML = ""; $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    const codeName = ["valid", "illegal move", "unparsable output", "bad input"][rp.code];
    const by = rp.rules !== "classic" ? ` <span class="rules-tag">${esc(UI.rulesTitle(rp.rules))} rules</span>` : "";
    vEl.innerHTML = rp.verdict.valid
      ? `<div class="okmsg"><b>Valid.</b> ${esc(UI.verdictText(rp.code, rp.verdict))}${by}</div>`
      : `<div class="err"><b>Invalid (${codeName}, exit ${rp.code}), score 0.</b> ${esc(rp.verdict.error)}${by}</div>`;
    if (!rp.states) { $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    $("rp-stepper-panel").classList.remove("hidden");
    $("rp-board").classList.remove("hidden");
    const n = rp.states.length - 1;
    const k = Math.max(0, Math.min(S.rpStep, n));
    S.rpStep = k;
    const slider = $("rp-slider");
    slider.max = String(n); slider.value = String(k);
    $("rp-pos").textContent = `move ${k} / ${rp.moves.length}`;
    const g = rp.states[k];

    // The next move's cards are highlighted on this board; the last move is shown separately.
    const nextMove = k < rp.moves.length ? rp.moves[k] : null;
    const nextCards = nextMove ? new Set(UI.moveCards(nextMove)) : new Set();
    let nextScored = new Set();
    if (nextMove && /^play\b/.test(nextMove) && !g.tryMove(nextMove)) nextScored = new Set(g.evaluate(UI.moveCards(nextMove)).scored);
    let last = "";
    if (k > 0) {
      const prev = rp.states[k - 1], m = rp.moves[k - 1];
      const cards = UI.moveCards(m);
      let res = null;
      if (/^play\b/.test(m)) res = prev.evaluate(cards, true);
      const scored = new Set(res ? res.scored : []);
      const faces = cards.map((c) => cardHTML(prev, c, { cls: /^play\b/.test(m) ? "sel " + (scored.has(c) ? "scored" : "kicker") : "", tag: res ? (scored.has(c) ? "scores" : "kicker") : "" })).join("");
      last = `<div class="lastmove"><div><span class="muted">Move ${k}:</span> <b class="mono">${esc(m)}</b> <span class="muted">${esc(rp.labels[k - 1] || "")}</span></div>
        ${faces ? `<div class="cards" style="padding-bottom:10px">${faces}</div>` : ""}
        ${res ? `<div class="formula mono" style="font-size:13px">${esc(PR.HAND_NAMES[res.hand])}: ${esc(UI.formula(res))}${res.money ? ` · +$${res.money}` : ""}</div>` : ""}</div>`;
    }
    let nextLine = "";
    if (nextMove) {
      const bad = rp.errorAt === k + 1;
      nextLine = `<div class="${bad ? "err" : "muted"}" style="margin-top:8px">Next, move ${k + 1}: <b class="mono">${esc(nextMove)}</b>${bad ? ` — illegal: ${esc(rp.error)}` : ` <span>${esc(rp.labels[k] || "")}</span> (highlighted)`}</div>`;
    } else if (k === rp.moves.length) {
      nextLine = `<div class="muted" style="margin-top:8px">End of the output.${g.over ? "" : " The run was not finished; the score is the points so far."}</div>`;
    }
    let main = statusHTML(g);
    if (g.phase === "play") {
      main += `<section class="panel" aria-label="Hand at this step"><h2>Hand</h2><div class="hand">${handHTML(g, { interactive: false, highlight: nextCards, hlScored: nextScored })}</div>${last}${nextLine}</section>`;
      main += pileHTML(g, g.pile, "Draw pile", "next card first", 0, nextCards);
    } else if (g.phase === "shop") {
      const offers = g.visibleSlots().map(({ name, taken }) => `<span class="chip${taken ? "" : " on"}">${esc(UI.prettyMod(name))}${taken ? " (bought)" : ` $${g.rules.price(name)}`}</span>`).join(" ");
      main += `<section class="panel" aria-label="Shop at this step"><h2>Shop after round ${g.round + 1}</h2>
        <div class="parts">${offers || '<span class="muted">No offers left in the window.</span>'}</div>
        <p class="muted" style="font-size:13px">Prices: reroll $${g.prices().reroll}, +discard $${g.prices().discards}, +hand size $${g.prices().handsize}, remove $${g.prices().remove}, paint $${g.prices().paint}, promote $${g.prices().promote}.</p>
        ${last}${nextLine}</section>`;
      const deck = UI.deckOrder(g).map((c) => cardHTML(g, c, { size: "deckc", cls: (g.in_deck[c] ? "" : "gone") + (nextCards.has(c) ? " hl" : "") })).join("");
      main += `<section class="panel" aria-label="Deck"><h2>Deck (${g.deck_size} cards)</h2><div class="deckgrid">${deck}</div></section>`;
    } else {
      const o = UI.outcome(g);
      main += `<section class="panel summary"><div class="big">${UI.num(o.score)}</div><div class="sub">cleared ${o.cleared} of ${o.rounds} rounds</div><p>${esc(o.text)}</p>${last}${nextLine}</section>`;
    }
    main += handTableHTML(g, false, null);
    $("rp-main").innerHTML = main;
    $("rp-side").innerHTML = modsHTML(g, false) + `<section class="panel"><h2>Moves (${rp.moves.length})</h2>${logHTML(rp.moves, rp.labels, k, rp.errorAt || 0)}</section>`;
    const cur = document.querySelector("#rp-log li.cur");
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }

  // ---------- top-level render
  function render() {
    if (S.mode !== "play" || S.kind === "solo") useSolo();
    $("view-play").classList.toggle("hidden", S.mode !== "play");
    $("view-replay").classList.toggle("hidden", S.mode !== "replay");
    $("tab-play").setAttribute("aria-selected", String(S.mode === "play"));
    $("tab-replay").setAttribute("aria-selected", String(S.mode === "replay"));
    $("source-bar").classList.toggle("hidden", S.mode !== "play");
    $("source-bar").classList.toggle("mp", S.kind !== "solo");
    $("kind-pick").classList.toggle("hidden", S.mode !== "play");
    $("rules-pick").classList.toggle("hidden", S.mode === "play" && S.kind === "online");   // a room has its own rules
    const rules = curRules();
    document.querySelectorAll('[data-act="rules"]').forEach((b) => b.setAttribute("aria-checked", String(b.dataset.v === rules)));
    document.querySelectorAll('[data-act="kind"]').forEach((b) => b.setAttribute("aria-checked", String(b.dataset.v === S.kind)));
    if (S.mode === "play") renderPlay(); else renderReplay();
    Scroll.request();
  }

  const cssEsc = (s) => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"));

  // Re-render, keeping keyboard focus on the same control where possible.
  function renderKeepFocus() {
    const a = document.activeElement;
    const key = a && a.dataset ? [a.dataset.act, a.dataset.id, a.dataset.v] : null;
    render();
    if (key && key[0]) {
      const sel = `[data-act="${key[0]}"]` + (key[1] !== undefined ? `[data-id="${key[1]}"]` : "") + (key[2] !== undefined ? `[data-v="${cssEsc(key[2])}"]` : "");
      const el = document.querySelector(sel);
      if (el && !el.disabled) el.focus();
    }
  }

  function flash(id, kind, text) {
    const el = $(id);
    if (el) el.innerHTML = `<div class="${kind === "err" ? "err" : "okmsg"}">${esc(text)}</div>`;
  }

  // ======================================================================
  // Other players: vs Bot (a computer player on this device: bot.js, multiplayer.js) and
  // Online (rooms on the Poker Run server, which is the authority: platform/API.md,
  // "Online multiplayer"). The solo game is never touched.
  // ======================================================================
  const MP_KEY = "poker-run:mp:v1", KIND_KEY = "poker-run:kind";
  const KINDS = { solo: "Solo", bot: "vs Bot", online: "Online" };
  // The same-device modes that were removed: their old links and saved choices open Online.
  const OLD_KINDS = { hotseat: "rounds", draft: "draft" };
  const COLORS = ["#f2c14e", "#6fd0e0", "#f08a76", "#b8a4f4"];
  const LEVEL_NAMES = { easy: "Easy", normal: "Normal", hard: "Hard" };
  const isRules = (r) => typeof r === "string" && Object.prototype.hasOwnProperty.call(PR.RULESETS, r);
  const ordinal = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
  const randomSeed = () => Math.floor(Math.random() * 1000000) + 1;
  const scrollTop = () => { try { scrollTo({ top: 0, behavior: Feel.calm ? "auto" : "smooth" }); } catch (e) { /* old browsers */ } };

  function mpCur() { return S.kind === "bot" ? M.games.bot : null; }
  function curRules() {
    if (S.mode === "replay") return S.rpRules || S.rules;
    if (S.kind === "solo") return S.rules;
    if (S.kind === "online") return ON.view ? ON.view.rules : ON.form.rules;
    const st = mpCur();
    return st && !st.match.over ? st.match.rules : M.rules;
  }
  function mpWho() {
    if (!M.stash) return null;
    if (S.kind === "online") { const me = onMe(); return me ? { name: me.name, color: COLORS[me.seat] } : null; }
    const st = mpCur();
    return st ? { name: st.match.players[st.viewer].name, color: COLORS[st.viewer] } : null;
  }
  function undoErr() {
    if (!M.stash) return S.moves.length ? "" : "Nothing to undo";
    if (S.kind === "online") return "Moves sent to the room can't be undone";
    return mpCur().match.canUndo() ? "" : "Only moves of the round or shop you are in can be undone";
  }

  // ---- vs Bot persistence: the setup and the match (its seed and move log), per viewer.
  // Saves from older versions may hold same-device matches (hotseat, draft): they are dropped.
  function saveMP() {
    const st = M.games.bot;
    const games = st ? { bot: { seed: st.seed, match: st.match.toJSON(), screen: st.screen, revealed: st.revealed } } : {};
    try { localStorage.setItem(MP_KEY, JSON.stringify({ rules: M.rules, setups: { bot: M.setups.bot }, games })); } catch (e) { /* storage unavailable */ }
  }

  function restoreMP() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(MP_KEY) || "null"); } catch (e) { raw = null; }
    if (!raw || typeof raw !== "object") return;
    if (isRules(raw.rules)) M.rules = raw.rules;
    const su = raw.setups && raw.setups.bot;
    if (su && typeof su === "object") {
      if (typeof su.name === "string") M.setups.bot.name = su.name.slice(0, 24);
      if (LEVEL_NAMES[su.level]) M.setups.bot.level = su.level;
      if (Number.isSafeInteger(su.seed)) M.setups.bot.seed = su.seed;
    }
    const g = raw.games && raw.games.bot;
    if (g && Number.isSafeInteger(g.seed) && g.match && typeof g.match === "object") {
      try {
        const st = newMatch(g.seed, g.match);
        st.screen = g.screen === "results" ? "results" : "turn";
        st.revealed = Number.isInteger(g.revealed) ? g.revealed : 0;
        st.celebrated = st.screen === "results";
        M.games.bot = st;
      } catch (e) { M.games.bot = null; /* a stale or broken save: start over */ }
    }
    if (raw.games && Object.keys(raw.games).some((k) => k !== "bot")) saveMP();   // clear the old modes' saves
  }

  function newMatch(seed, opts) {
    const inst = PR.generate(seed);
    const match = new PokerMulti.Match(inst, opts);
    if (match.mode !== "race" || match.players.length !== 2 || !match.players[1].bot) throw new Error("not a vs Bot match");
    return { kind: "bot", seed, text: PR.formatInstance(inst), match, screen: "turn", viewer: 0, revealed: 0, labels: {}, celebrated: false };
  }

  function mpStart(seed) {
    const su = M.setups.bot;
    const players = [{ name: su.name.trim() || "You" }, { name: "Bot", bot: su.level }];
    const st = newMatch(seed, { mode: "race", rules: M.rules, players });
    if (st.match.over) st.screen = "results";
    su.seed = seed;
    M.games.bot = st;
    S.who = "";   // a new match: every hand is dealt fresh
    saveMP();
    return st;
  }

  // ---- whose game is on screen (the solo game waits in M.stash)
  function stashSolo() {
    if (!M.stash) M.stash = { source: S.source, inputText: S.inputText, inst: S.inst, moves: S.moves, labels: S.labels, game: S.game, sel: S.sel, deckPick: S.deckPick, msg: S.msg, who: S.who };
  }
  function showGame(who, seed, text, inst, game, moves, labels) {
    stashSolo();
    if (S.who !== who) { S.sel = []; S.deckPick = null; S.msg = null; S.who = who; }
    S.source = { type: "seed", seed };
    S.inputText = text;
    S.inst = inst;
    S.game = game;
    S.moves = moves.slice();
    S.labels = labels;
  }
  function useSeat(st, seat) {
    showGame(`bot:${seat}`, st.seed, st.text, st.match.inst, st.match.players[seat].game, st.match.players[seat].moves, labelsOf(st, seat));
  }
  function useSolo() { if (M.stash) { Object.assign(S, M.stash); M.stash = null; } }

  // describe() of each move, cached per move list
  function movesLabels(cache, key, inst, rules, moves) {
    const k = moves.join("\n");
    const c = cache[key];
    if (c && c.k === k) return c.labels;
    const g = new PR.Game(inst, rules), labels = [];
    for (const m of moves) { labels.push(UI.describe(g, m)); try { g.apply(m); } catch (e) { break; } }
    cache[key] = { k, labels };
    return labels;
  }
  function labelsOf(st, seat) { return movesLabels(st.labels, seat, st.match.inst, st.match.rules, st.match.players[seat].moves); }

  function setKind(k, quiet) {
    if (!KINDS[k] || k === S.kind) return;
    if (S.kind === "online") onlineStop();
    S.kind = k;
    try { localStorage.setItem(KIND_KEY, k); } catch (e) { /* storage unavailable */ }
    if (!quiet) Sound.tap();
    useSolo();
    if (k === "solo") soloHash();
    else if (k === "online") { onlineHash(); onlineEnter(); }
    else bareHash();
    if (!quiet) render();
  }
  function bareHash() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* no URL updates here */ } }

  // ---- vs Bot moves
  function mpMove(line) {
    const st = mpCur(), mt = st.match, seat = 0;
    const err = mt.tryMove(line, seat);
    if (err) { S.msg = { kind: "err", text: `${line}: ${err}` }; Sound.oops(); renderKeepFocus(); return false; }
    const before = S.game.clone();
    mt.apply(line, seat);
    const after = mt.players[seat].game;
    S.msg = null;
    S.sel = after.phase === "play" ? S.sel.filter((c) => after.hand.includes(c)) : [];
    if (S.deckPick !== null && (!after.in_deck[S.deckPick] || after.phase !== "shop")) S.deckPick = null;
    if (mt.over) st.screen = "results";
    saveMP();
    renderKeepFocus();
    Feel.afterMove(line, before, after);
    if (st.screen !== "turn") scrollTop();
    return true;
  }

  function mpUndo() {
    const st = mpCur(), mt = st.match;
    if (!mt.canUndo()) { S.msg = { kind: "err", text: "Only moves of the round or shop you are in can be undone." }; Sound.oops(); render(); return; }
    const last = mt.history[mt.history.length - 1].move;
    mt.undo();
    S.sel = []; S.deckPick = null;
    S.msg = { kind: "ok", text: `Undid "${last}".` };
    saveMP();
    render();
  }

  function mpRules(v) {
    if (!isRules(v) || v === curRules()) return;
    const st = mpCur();
    const live = st && !st.match.over && st.match.players[0].moves.length;
    if (live && !window.confirm(`Switch to the ${UI.rulesTitle(v)} rules? This match starts again on the same seed.`)) return;
    M.rules = v;
    Sound.shuffle();
    if (st && !st.match.over) mpStart(st.seed);
    saveMP();
    render();
  }

  // ---- vs Bot: what to show. Renders the setup or the results and returns true, or points S at your game.
  function mpRender() {
    const st = mpCur();
    if (!st) { useSolo(); $("play-main").innerHTML = setupHTML(); $("play-side").innerHTML = setupSideHTML(); Scroll.request(); return true; }
    if (st.match.over) st.screen = "results";
    if (st.screen === "results") { useSolo(); renderResults(st); Scroll.request(); return true; }
    st.viewer = 0;
    useSeat(st, 0);
    return false;
  }

  function chipsHTML(st) {
    const mt = st.match;
    return `<span class="mp-chip">vs Bot (${esc(LEVEL_NAMES[mt.players[1].bot])})</span><span class="mp-chip">seed <b>${st.seed}</b></span>` +
      (mt.rules !== "classic" ? `<span class="rules-tag" style="margin:0">${esc(UI.rulesTitle(mt.rules))} rules</span>` : "");
  }

  // The turn indicator above the game, and the race.
  function mpTopHTML(st) {
    const mt = st.match, t = mt.turn, pl = mt.players[t.seat];
    const what = t.stage === "play" ? `round ${t.round + 1} of ${mt.inst.rounds}` : `shop after round ${t.round + 1}`;
    const bar = `<section class="panel turnbar" style="--pc:${COLORS[t.seat]}" aria-label="Whose turn">
      <span class="who"><span class="pdot"></span><span class="pname">${esc(pl.name)}</span></span><span class="what">${esc(what)}</span>
      <span class="tags">${chipsHTML(st)}</span></section>`;
    return bar + raceHTML(st);
  }

  // How many of the bot's rounds are shown (one per round the player has finished).
  function revealCount(st) {
    const me = st.match.players[0];
    return me.game.over ? st.match.inst.rounds : me.rounds.filter((r) => r.cleared !== null).length;
  }
  const roundsTotal = (pl, n) => pl.rounds.slice(0, n).reduce((a, r) => a + r.score, 0);

  // Round pips: rounds = [{score, cleared}] (cleared: true, false or null while playing)
  function pipsHTML(rounds, R, fresh) {
    const out = [];
    for (let r = 0; r < R; r++) {
      const rec = rounds[r] || null;
      const done = rec && rec.cleared !== null && rec.cleared !== undefined;
      const cls = done ? (rec.cleared ? "ok" : "bad") : "";
      const pop = done && fresh && r >= fresh[0] && r < fresh[1] ? ` pop" style="--d:${(r - fresh[0]) * 140}ms` : "";
      out.push(`<span class="pip ${cls}${pop}" title="Round ${r + 1}${done ? `: ${rec.cleared ? "cleared" : "out"} with ${UI.num(rec.score)}` : ""}">${done ? (rec.cleared ? "✓" : "✗") + "&#8239;" + (r + 1) : r + 1}</span>`);
    }
    return out.join("");
  }

  function playsChips(plays) {
    return plays.map((p) => `<span class="chip">${esc(PR.HAND_NAMES[p.hand])} ${UI.num(p.points)}</span>`).join("");
  }

  // One player's moves of one round (and its shop), with descriptions.
  function roundMovesHTML(st, seat, r) {
    const pl = st.match.players[seat], labels = labelsOf(st, seat);
    let off = 0;
    for (let k = 0; k < r; k++) off += pl.rounds[k] ? pl.rounds[k].moves.length + pl.rounds[k].shop.length : 0;
    const rec = pl.rounds[r], n = rec.moves.length + rec.shop.length;
    const items = pl.moves.slice(off, off + n).map((m, i) => `<li><span>${esc(m)}</span> <span class="muted">${esc(labels[off + i] || "")}</span></li>`).join("");
    return `<details><summary>Moves (${n})</summary><ol class="movelist">${items}</ol></details>`;
  }

  function raceHTML(st) {
    const mt = st.match, me = mt.players[0], bot = mt.players[1];
    const n = revealCount(st);
    const fresh = n > st.revealed ? [st.revealed, n] : null;
    const myTotal = me.game.total, botTotal = roundsTotal(bot, n);
    const max = Math.max(1, myTotal, botTotal);
    const lane = (pl, total, shown, f) => `<div class="lane" style="--pc:${COLORS[pl.seat]}"><span class="nm"><span class="pdot"></span>${esc(pl.name)}</span>
      <span class="track"><i data-race-bar="${pl.seat}" style="width:${(100 * total) / max}%"></i></span><span class="score" data-race="${pl.seat}">${UI.num(total)}</span></div>
      <div class="pips" style="--pc:${COLORS[pl.seat]};margin:-2px 0 10px">${pipsHTML(pl.rounds.slice(0, shown), mt.inst.rounds, f)}</div>`;
    const diff = myTotal - botTotal;
    const lead = diff > 0 ? `${esc(me.name)} ${me.name === "You" ? "lead" : "leads"} by ${UI.num(diff)}` : diff < 0 ? `Bot leads by ${UI.num(-diff)}` : "Level";
    let reveal = `<p class="muted" style="margin:8px 0 0;font-size:13px">The bot plays the same deal. Its round ${me.game.round + 1} shows up when you finish yours.</p>`;
    const r = n - 1, rec = r >= 0 ? bot.rounds[r] : null;
    if (rec) {
      const head = rec.cleared ? `cleared round ${r + 1}: <b>${UI.num(rec.score)}</b> / ${UI.num(mt.inst.targets[r])}` : `went out in round ${r + 1}: ${UI.num(rec.score)} / ${UI.num(mt.inst.targets[r])}`;
      const buys = rec.shop.filter((m) => m.startsWith("buy ")).map((m) => UI.prettyMod(m.slice(4)));
      reveal = `<div class="reveal${fresh ? " fresh" : ""}" style="--pc:${COLORS[1]}"><div><span class="pname">Bot</span> ${head}</div>
        <div class="plays">${playsChips(rec.plays)}${buys.length ? `<span class="chip on">bought ${esc(buys.join(", "))}</span>` : ""}</div>
        ${roundMovesHTML(st, 1, r)}</div>`;
    } else if (n > 0 && bot.game.over) {
      reveal = `<div class="reveal" style="--pc:${COLORS[1]}"><span class="pname">Bot</span> went out in round ${bot.game.round + 1}; you're racing its final ${UI.num(bot.game.total)}.</div>`;
    }
    return `<section class="panel race" aria-label="Race against the bot">
      <div class="toolbar"><h2 style="margin:0">Race</h2><span class="muted" style="font-size:13px">${lead}</span></div>
      ${lane(me, myTotal, n, null)}${lane(bot, botTotal, n, fresh)}${reveal}</section>`;
  }

  // After a vs Bot render: animate the bot's newly revealed rounds.
  function mpAfterRender(st) {
    const n = revealCount(st);
    if (n <= st.revealed) return;
    const bot = st.match.players[1], from = roundsTotal(bot, st.revealed), to = roundsTotal(bot, n);
    st.revealed = n;
    saveMP();
    const el = document.querySelector('[data-race="1"]');
    if (el) Feel.countUp(el, from, to, "");
    const bar = document.querySelector('[data-race-bar="1"]');
    if (bar && !Feel.calm) {
      const w = bar.style.width, max = Math.max(1, st.match.players[0].game.total, to);
      bar.style.width = `${(100 * from) / max}%`;
      bar.getBoundingClientRect();
      bar.style.width = w;
    }
    setTimeout(() => Sound.next(), 650);
  }

  // Round-by-round scores. rows: [{seat, name, tag, rounds: [{score, cleared}], total, place}]
  function boardTableHTML(rows, R, current, title) {
    const done = Math.max(0, ...rows.map((p) => p.rounds.filter((r) => r && r.cleared !== null && r.cleared !== undefined).length));
    const head = [...Array(R).keys()].map((r) => `<th>R${r + 1}</th>`).join("");
    const body = rows.map((pl) => {
      const cells = [...Array(R).keys()].map((r) => {
        const rec = pl.rounds[r];
        if (rec && rec.cleared === true) return `<td>${UI.num(rec.score)}</td>`;
        if (rec && rec.cleared === false) return `<td class="out" title="out">✗ ${UI.num(rec.score)}</td>`;
        return `<td class="wait">${pl.over && rec === undefined && r < pl.rounds.length ? "" : "·"}</td>`;
      }).join("");
      return `<tr class="${pl.seat === current ? "me" : ""}" style="--pc:${COLORS[pl.seat]}"><td><span class="place">${pl.place || ""}</span><span class="pdot"></span> <span class="pname">${esc(pl.name)}</span>${pl.tag ? ` <span class="muted" style="font-size:12px">${esc(pl.tag)}</span>` : ""}</td>${cells}<td class="tot">${UI.num(pl.total)}</td></tr>`;
    }).join("");
    return `<section class="panel" aria-label="${esc(title || "Standings")}"><div class="toolbar"><h2 style="margin:0">${esc(title || "Standings")}</h2><span class="muted" style="font-size:13px">${done ? `after round ${done}` : "no rounds played yet"}</span></div>
      <div class="scroll-x" style="margin-top:8px"><table class="board"><thead><tr><th>Player</th>${head}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  function boardHTML(st, current) {
    const mt = st.match, place = Object.fromEntries(mt.standings().map((r) => [r.seat, r.place]));
    const rows = mt.players.map((pl) => ({ seat: pl.seat, name: pl.name, tag: pl.bot ? `${LEVEL_NAMES[pl.bot]} bot` : "", rounds: pl.rounds,
      total: pl.game.total, place: mt.over ? place[pl.seat] : "", over: pl.game.over }));
    return boardTableHTML(rows, mt.inst.rounds, current);
  }

  function statusOf(st, pl) {
    const mt = st.match, g = pl.game;
    if (pl.bot && !mt.over) {
      const n = revealCount(st);
      return n ? `round ${Math.min(n, pl.rounds.length)} shown` : "waiting for your round 1";
    }
    if (g.over) return g.cleared === mt.inst.rounds ? `cleared all ${mt.inst.rounds} rounds` : `out in round ${g.round + 1}`;
    return g.phase === "play" ? `playing round ${g.round + 1}` : "in the shop";
  }

  function mpSideHTML(st) {
    const mt = st.match;
    const rows = mt.players.map((pl) => {
      const total = pl.bot && !mt.over ? roundsTotal(pl, revealCount(st)) : pl.game.total;
      return `<div class="pr${!pl.bot ? " now" : ""}" style="--pc:${COLORS[pl.seat]}"><span class="pdot"></span>
        <span style="min-width:0"><span class="pname">${esc(pl.name)}</span>${pl.bot ? ` <span class="muted" style="font-size:12px">${esc(LEVEL_NAMES[pl.bot])} bot</span>` : ""}<br><span class="muted" style="font-size:12px">${esc(statusOf(st, pl))}</span></span>
        <span class="gold" style="font-weight:800;font-variant-numeric:tabular-nums">${UI.num(total)}</span></div>`;
    }).join("");
    return `<section class="panel" aria-label="Players">
      <div class="toolbar"><h2 style="margin:0">Players</h2><span class="actions">${chipsHTML(st)}</span></div>
      <div class="plist" style="margin-top:6px">${rows}</div>
      <div class="actions" style="margin-top:10px">${btn("Restart match", "mp-restart", { cls: "small", title: "Start this match again on the same seed" })}${btn("New match…", "mp-setup", { cls: "small", title: "Back to the setup" })}</div>
    </section>`;
  }

  // ---- vs Bot setup
  function botRulesHTML() {
    return `<ul class="mode-rules"><li>The bot plays its whole run on its own (it doesn't see your moves). <b>Easy</b> plays its best hand and rarely shops; <b>Normal</b> is the reference greedy bot (<span class="mono">baseline.py</span>); <b>Hard</b> also looks ahead when it discards.</li><li>Its rounds are revealed one at a time: when you finish round r, you see its round r.</li>
      <li>You both get the <b>same seed and rules</b>: the same draw orders and shop queues. Each move list is a valid output file for that seed.</li><li>Highest total score wins; on a tie, more rounds cleared; otherwise it's shared.</li>
      <li>Want to play people? Pick <b>Online</b> above: rooms with a code, on separate devices.</li></ul>`;
  }

  function setupHTML() {
    const su = M.setups.bot;

      <div class="seat" style="--pc:${COLORS[1]}"><span class="pdot"></span><span class="pname">Bot</span><span class="tabs" role="radiogroup" aria-label="Bot level">${lv}</span>

        <div class="row"><span class="k" style="min-width:5.5em;color:var(--muted);font-size:13px;font-weight:600">Rules</span><span>${esc(rulesLine)} <span class="muted" style="font-size:13px">· switch with Rules above</span></span></div>
        ${seats}
        <div class="actions" style="margin-top:4px">${btn("Start match", "mp-start", { cls: "primary" })}</div>

  function setupSideHTML() {
    return `<section class="panel" aria-label="How it works"><h2>How vs Bot works</h2>${botRulesHTML()}</section>${rulesBoxHTML(M.rules)}`;
  }

  // ---- results: shared by vs Bot and Online. rows: standings best first [{seat, name, tag, total, cleared, moves, money?, place, note}]
  function podiumHTML(rows, R) {
    return rows.map((r, i) => {
      const how = r.cleared === R ? `cleared all ${R} rounds` : `cleared ${r.cleared} of ${R}`;
      return `<div class="pl${r.place === 1 ? " first" : ""}" style="--pc:${COLORS[r.seat]};--d:${i * 120}ms"><span class="place">${r.place}</span>
        <span style="min-width:0"><span class="pdot"></span> <span class="pname">${esc(r.name)}</span>${r.tag ? ` <span class="muted" style="font-size:12px">${esc(r.tag)}</span>` : ""}</span>
        <span class="pts" data-to="${r.total}">${UI.num(r.total)}</span><span class="sub">${esc(how)} · ${r.moves} moves${r.money !== undefined ? ` · $${r.money}` : ""}${r.note ? ` · ${esc(r.note)}` : ""}</span></div>`;
    }).join("");

  function celebrate(won) {
    document.querySelectorAll(".podium .pts").forEach((el) => Feel.countUp(el, 0, Number(el.dataset.to), ""));
    setTimeout(() => { if (won) Sound.clear(); else Sound.lose(); }, 250);
    const first = document.querySelector(".podium .pl.first");
    if (first) setTimeout(() => Feel.motes(30, first), 300);
  }

  function renderResults(st) {
    const mt = st.match, rows = mt.standings(), win = mt.winners();
    const title = win.length > 1 ? "A tie!" : win[0] === 0 ? `${mt.players[0].name === "You" ? "You win" : mt.players[0].name + " wins"}!` : "The bot wins";
    const prow = rows.map((r) => { const pl = mt.players[r.seat]; return { seat: r.seat, name: pl.name, tag: pl.bot ? `${LEVEL_NAMES[pl.bot]} bot` : "", total: pl.game.total, cleared: pl.game.cleared, moves: pl.moves.length, money: pl.game.money, place: r.place }; });
    const col = COLORS[win[0] || 0];
    $("play-main").innerHTML = `<section class="panel summary results" style="--pc:${win.length > 1 ? "var(--gold)" : col}" aria-label="Results">
        <div class="kicker">vs Bot · seed ${st.seed} · ${esc(UI.rulesTitle(mt.rules))} rules</div>
        <div class="winner">${esc(title)}</div>
        <div class="podium">${podiumHTML(prow, mt.inst.rounds)}</div>
        <div class="actions" style="justify-content:center;margin-top:14px">${btn("Rematch (same seed)", "mp-rematch", { cls: "primary" })}${btn("New seed", "mp-new-seed")}${btn("Change setup", "mp-setup")}</div>
      </section>${boardHTML(st, -1)}`;

    if (!st.celebrated) {
      st.celebrated = true;
      celebrate(win.includes(0));
    }
  }

  // Every player's move list with its checker verdict; matchId: online match (adds Replay links)
  function outputsHTML(text, rules, seed, players, matchId) {
    const outs = players.map((pl) => {
      const out = PR.formatOutput(pl.moves);
      const [code, v] = PR.check(text, out, rules);
      const verdict = code === 0 ? `valid · ${UI.num(v.score)}` : "invalid";
      return `<details style="--pc:${COLORS[pl.seat]}"><summary><span class="pdot"></span> <span class="pname">${esc(pl.name)}</span> <span class="muted">· ${pl.moves.length} moves · ${esc(verdict)}</span></summary>
        <textarea readonly spellcheck="false" id="mp-out-${pl.seat}" aria-label="${esc(pl.name)}'s output file">${esc(out)}</textarea>
        <div class="actions" style="margin-top:6px">${btn("Copy", "mp-copy", { v: pl.seat, cls: "small" })}${btn("Download", "mp-download", { v: pl.seat, cls: "small" })}${btn("Replay", "mp-replay", { v: pl.seat, cls: "small", title: "Step through this run in the Replay tab" })}</div>
        <div class="msg" id="mp-out-msg-${pl.seat}" role="status" aria-live="polite"></div></details>`;
    }).join("");
    return `<section class="panel outputs" aria-label="Move lists"><h2>Move lists</h2>
      <p class="muted" style="margin:0;font-size:13px">Each is an output file for seed ${seed}${rules !== "classic" ? `, scored with <span class="mono">--rules ${esc(rules)}</span>` : ""}; check it with <span class="mono">python -m poker_run check</span> or the Replay tab.${matchId ? ` Saved to your account: <a href="#match=${matchId}">link to this match</a>.` : ""}</p>${outs}</section>`;
  }

  function outputName(seed, rules, name, seat) {
    const slug = String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `player${seat + 1}`;
    return `poker_run_seed${seed}${rules !== "classic" ? "_" + rules : ""}_${slug}_out.txt`;
  }

  // The results on screen (vs Bot or an online match): {text, rules, seed, players: [{seat, name, moves}]}
  function shownOutputs() {
    if (S.kind === "online" && !ON.code && ON.detail) {
      const d = ON.detail;
      return { text: PR.formatInstance(onInst(d.seed)), rules: d.rules, seed: d.seed, players: d.players.map((p) => ({ seat: p.seat, name: p.name, moves: p.moves })) };
    }
    if (S.kind === "online" && ON.view && ON.view.status === "finished") {
      const v = ON.view;
      return { text: PR.formatInstance(onInst(v.seed)), rules: v.rules, seed: v.seed, players: v.players.map((p) => ({ seat: p.seat, name: p.name, moves: p.moves || [] })) };
    }
    const st = mpCur();
    if (!st) return null;
    return { text: st.text, rules: st.match.rules, seed: st.seed, players: st.match.players.map((pl) => ({ seat: pl.seat, name: pl.name, moves: pl.moves })) };
  }

  // Open a move list in the Replay tab, checked by its own rules.
  function openReplay(text, moves, rules) {
    $("rp-input").value = text;
    $("rp-output").value = PR.formatOutput(moves);
    S.rpRules = rules !== S.rules ? rules : null;
    S.mode = "replay";
    render();
    runReplay();
    scrollTop();
  }

  // ======================================================================
  // Online: rooms on the server. Signed-in players only; the server checks every move
  // (turns, the draft, the solo rules) and keeps the room. This page polls the room
  // (a long poll: the server answers as soon as something changes) and shows your own
  // game in full, the others' as summaries (scores, hand types, purchases, rounds).
  // ======================================================================
  const ROOM_RE = /^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/;
  const ONLINE_MODES = { race: "Race", draft: "Draft", rounds: "Rounds" };
  const ONLINE_TEXT = {
    race: "Everyone plays the same deal at the same time, each on their own. You see the others' progress live; each of their rounds is revealed when you finish the same round.",
    draft: "Turns round by round with one shared shop: everyone plays round r, then the shop is visited one at a time, lowest total first, and a modifier someone owns is gone for everyone else.",
    rounds: "Turns round by round: each player plays a round and the shop after it, then the next player. Everyone sees everyone's scores as they come.",
  };
  const ON = {
    me: undefined,          // undefined: not asked yet; null: signed out; {username}
    api: true,              // false: no server here (the page was opened on its own)
    form: { mode: "race", rules: "classic", seed: "", random: true, max: 2, bots: 0, level: "normal", join: "" },
    code: null,             // the room on screen
    view: null,             // its latest state from the server
    error: null,            // why the room can't be shown: { text }
    lost: false,            // the connection dropped: retrying
    gen: 0,                 // poll loop generation (a new room or leaving stops the old loop)
    abort: null,
    rooms: null, matches: null, record: null, homeErr: null, detail: null, settingsOpen: false, apiErr: null, rules: null,
    game: null, moves: [], seed: null, pending: 0, chain: Promise.resolve(),
    labels: {}, insts: {}, celebrated: null, key: "",
    busy: false, msg: null,
  };

  function onInst(seed) { return ON.insts[seed] || (ON.insts[seed] = PR.generate(seed)); }
  function onMe(v) { v = v || ON.view; return v ? v.players.find((p) => p.you) || null : null; }
  function onPlayer(v, seat) { return v.players.find((p) => p.seat === seat) || null; }
  function onlineHash() {
    if (ON.code) { try { history.replaceState(null, "", "#room=" + ON.code); } catch (e) { /* no URL updates */ } }
    else bareHash();
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function api(method, path, body, signal) {
    const opts = { method, credentials: "same-origin", headers: { Accept: "application/json" }, signal };
    if (method !== "GET") {
      opts.headers["X-Requested-With"] = "fetch";
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body || {});
    }
    let res;
    try { res = await fetch(path, opts); } catch (e) {
      const err = new Error(e && e.name === "AbortError" ? "aborted" : "Can't reach the server. Check your connection.");
      err.status = e && e.name === "AbortError" ? -2 : 0;
      throw err;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    if (!res.ok) {
      const err = new Error(data && typeof data.error === "string" ? data.error : `The server answered ${res.status}.`);
      err.status = res.status;
      throw err;
    }
    if (data === null) { const err = new Error("The server sent an unexpected answer."); err.status = -1; throw err; }
    return data;
  }

  function toast(html, color) {
    const box = $("toasts");
    if (!box) return;
    const el = document.createElement("div");
    el.className = "toast";
    if (color) el.style.setProperty("--pc", color);
    el.innerHTML = html;
    box.appendChild(el);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 400); }, 4200);
  }

  async function checkMe() {
    try { ON.me = await api("GET", "/api/me"); ON.api = true; } catch (e) {
      if (e.status === 401) ON.me = null;
      else { ON.me = null; ON.api = false; ON.apiErr = e.message; }
    }
  }

  async function onlineEnter() {
    if (ON.me === undefined || !ON.api) { await checkMe(); if (S.kind === "online") render(); }
    if (!ON.me || S.kind !== "online") return;
    if (ON.code) startPolling(); else loadHome();
  }

  function onlineStop() {
    ON.gen++;
    if (ON.abort) { try { ON.abort.abort(); } catch (e) { /* ignore */ } ON.abort = null; }
  }

  async function loadHome() {
    ON.homeErr = null;
    try {
      const [rooms, hist] = await Promise.all([api("GET", "/api/rooms"), api("GET", "/api/matches")]);
      ON.rooms = rooms; ON.matches = hist.matches; ON.record = hist.record;
    } catch (e) {
      if (e.status === 401) ON.me = null;
      ON.homeErr = e.message;
    }
    if (S.kind === "online" && !ON.code && S.mode === "play") render();
  }

  function enterRoom(code, view) {
    onlineStop();
    ON.code = code; ON.view = null; ON.error = null; ON.lost = false; ON.msg = null; ON.key = "";
    ON.game = null; ON.moves = []; ON.seed = null; ON.pending = 0; ON.celebrated = null;
    onlineHash();
    if (view) gotView(view, true);
    startPolling();
    render();
    scrollTop();
  }

  function leaveRoomScreen() {
    onlineStop();
    ON.code = null; ON.view = null; ON.error = null; ON.lost = false; ON.msg = null;
    onlineHash();
    useSolo();
    loadHome();
    render();
    scrollTop();
  }

  function startPolling() {
    onlineStop();
    const gen = ON.gen;
    pollLoop(gen);
  }

  async function pollLoop(gen) {
    let delay = 0;
    while (gen === ON.gen && ON.code && S.kind === "online") {
      const code = ON.code;
      const since = ON.view && ON.view.code === code ? ON.view.version : null;
      const ctl = typeof AbortController === "function" ? new AbortController() : null;
      ON.abort = ctl;
      const t0 = Date.now();
      try {
        // a long poll, except right after a dropped connection: then find out at once that we are back
        const q = since === null ? "" : `?since=${since}&wait=${ON.lost ? 0 : 20}`;
        const v = await api("GET", `/api/rooms/${code}${q}`, undefined, ctl ? ctl.signal : undefined);
        if (gen !== ON.gen) return;
        if (ON.lost) { ON.lost = false; toast("Connected again."); render(); }
        delay = 0;
        gotView(v);
        // a server that doesn't hold the poll open (or a quiet room): don't ask again at once
        if (since !== null && v.version === since && Date.now() - t0 < 1000 && !q.endsWith("wait=0")) await sleep(1000);
      } catch (e) {
        if (gen !== ON.gen || e.status === -2) return;
        if (e.status === 401) { ON.me = null; render(); return; }
        if (e.status === 404 || e.status === 403) {
          ON.error = { text: e.status === 404 ? `Room ${code} wasn't found. It may have expired (rooms close after a while without activity), or the code is mistyped.` : e.message, status: e.status };
          ON.view = null;
          useSolo();
          render();
          return;
        }
        if (!ON.lost) { ON.lost = true; render(); }
        delay = Math.min(10000, delay ? delay * 2 : 1000);
        await sleep(delay);
      }
    }
  }

  // A view's identity for "did anything change on screen" (ignores the clocks).
  function viewKey(v) {
    return JSON.stringify(v, (k, x) => (k === "server_time" || k === "expires_in" || k === "idle" ? undefined : x));
  }

  function gotView(v, quiet) {
    if (!v || v.code !== ON.code) return;
    const prev = ON.view;
    if (prev && v.version < prev.version) return;   // an older answer that arrived late
    ON.view = v;
    if (!quiet && prev) announce(prev, v);
    const me = onMe(v);
    if (me && me.moves && !ON.pending) syncGame(v, me);
    const key = viewKey(v);
    if (key === ON.key) return;
    ON.key = key;
    if (S.kind === "online" && S.mode === "play") renderKeepFocus();
  }

  function syncGame(v, me) {
    if (ON.game && ON.seed === v.seed && ON.rules === v.rules && ON.moves.join("\n") === me.moves.join("\n")) return;
    const g = new PR.Game(onInst(v.seed), v.rules);
    for (const m of me.moves) { try { g.apply(m); } catch (e) { break; } }
    ON.game = g; ON.moves = me.moves.slice(); ON.seed = v.seed; ON.rules = v.rules;
  }

  // Toasts for what the others did since the last view.
  function announce(a, b) {
    const name = (p) => `<span class="pname" style="--pc:${COLORS[p.seat]}">${esc(p.name)}</span>`;
    if (a.status === "lobby" && b.status === "lobby") {
      for (const p of b.players) {
        const q = a.players.find((x) => x.seat === p.seat && x.name === p.name);
        if (!q && !p.you) { toast(`${name(p)} joined the room.`, COLORS[p.seat]); Sound.tap(); }
        else if (q && !q.ready && p.ready && !p.you && !p.bot) toast(`${name(p)} is ready.`, COLORS[p.seat]);
      }
      for (const q of a.players) if (!b.players.some((p) => p.seat === q.seat && p.name === q.name) && !q.you) toast(`${name(q)} left the room.`, COLORS[q.seat]);
      return;
    }
    if (a.status === "lobby" && b.status === "playing") { toast("The game is on. Good luck!"); Sound.shuffle(); return; }
    if (b.status !== "playing") return;
    for (const p of b.players) {
      if (p.you) continue;
      const q = a.players.find((x) => x.seat === p.seat);
      if (!q) continue;
      for (let r = 0; r < p.rounds.length; r++) {
        const now = p.rounds[r], was = q.rounds[r];
        if (now.cleared !== null && (!was || was.cleared === null)) {
          toast(now.cleared ? `${name(p)} cleared round ${r + 1} with <b>${UI.num(now.score)}</b>.` : `${name(p)} went out in round ${r + 1} (${UI.num(now.score)}).`, COLORS[p.seat]);
        }
        const nb = now.buys.filter((x, i) => !was || i >= was.buys.length);
        if (nb.length && (!was || now.shop_moves > was.shop_moves)) toast(`${name(p)} bought <b>${esc(nb.map(UI.prettyMod).join(", "))}</b>.`, COLORS[p.seat]);
      }
      if (q.status === "in" && p.status !== "in") toast(`${name(p)} ${p.status === "removed" ? "was removed (away)" : "left the game"}; their run scores what it has.`, COLORS[p.seat]);
      else if (q.online && !p.online && p.status === "in" && !p.over) toast(`${name(p)} seems to be away.`, COLORS[p.seat]);
    }
    const me = onMe(b);
    const mine = (v) => v.turn && me && v.turn.seat === me.seat;
    if (b.mode !== "race" && mine(b) && !mine(a)) { toast("<b>Your turn.</b>", COLORS[me.seat]); Sound.next(); }
  }

  function canIMove(v, g) {
    const me = onMe(v);
    if (!me || me.status !== "in" || me.over || !g || g.over) return "";
    if (v.status !== "playing") return "";
    if (v.mode === "race") return "ok";
    if (!v.turn || v.turn.seat !== me.seat) return "";
    if (v.turn.round !== g.round || v.turn.stage !== g.phase) return "";   // our last move is still on its way
    return "ok";
  }

  function onlineMove(line) {
    const v = ON.view, g = ON.game, me = onMe(v);
    let err = "";
    if (!canIMove(v, g)) {
      const t = v && v.turn && onPlayer(v, v.turn.seat);
      err = t && me && t.seat !== me.seat ? `it's ${t.name}'s turn` : "wait for the room to catch up";
    } else {
      const tok = line.split(/\s+/);
      const owner = tok[0] === "buy" && tok.length === 2 && v.mode === "draft" ? v.owners[tok[1]] : undefined;
      if (owner !== undefined && owner !== me.seat) err = `${tok[1]} was drafted by ${onPlayer(v, owner).name}`;
      else err = g.tryMove(line) || "";
    }
    if (err) { S.msg = { kind: "err", text: `${line}: ${err}` }; Sound.oops(); renderKeepFocus(); return false; }
    const before = g, after = g.clone();
    after.apply(line);
    ON.game = after;
    ON.moves = ON.moves.concat([line]);
    ON.pending++;
    S.game = after; S.moves = ON.moves.slice();
    S.labels = movesLabels(ON.labels, "me", onInst(v.seed), v.rules, ON.moves);
    S.msg = null;
    S.sel = after.phase === "play" ? S.sel.filter((c) => after.hand.includes(c)) : [];
    if (S.deckPick !== null && (!after.in_deck[S.deckPick] || after.phase !== "shop")) S.deckPick = null;
    renderKeepFocus();
    Feel.afterMove(line, before, after);
    const code = ON.code;
    ON.chain = ON.chain.then(async () => {
      try {
        const nv = await api("POST", `/api/rooms/${code}/move`, { move: line });
        ON.pending = Math.max(0, ON.pending - 1);
        if (code === ON.code) gotView(nv);
        if (code === ON.code && !ON.pending) { const m = onMe(nv); if (m) { syncGame(nv, m); renderKeepFocus(); } }
      } catch (e) {
        ON.pending = Math.max(0, ON.pending - 1);
        if (code !== ON.code) return;
        S.msg = { kind: "err", text: `${line}: ${e.message}` };
        Sound.oops();
        ON.game = null;   // rebuilt from the server's copy of your moves
        try { const nv = await api("GET", `/api/rooms/${code}`); ON.view = null; gotView(nv, true); const m = onMe(nv); if (m) syncGame(nv, m); } catch (e2) { /* the poll loop recovers */ }
        renderKeepFocus();
      }
    });
    return true;
  }

  async function roomAction(what, body, okText) {
    if (ON.busy) return null;
    ON.busy = true;
    const code = ON.code;
    try {
      const v = await api("POST", `/api/rooms/${code}/${what}`, body || {});
      ON.msg = okText ? { kind: "ok", text: okText } : null;
      if (v && v.code === ON.code) gotView(v, true);
      return v;
    } catch (e) {
      ON.msg = { kind: "err", text: e.message };
      Sound.oops();
      if (e.status === 404 || e.status === 403) { ON.error = { text: e.message }; ON.view = null; onlineStop(); }
      return null;
    } finally {
      ON.busy = false;
      if (S.kind === "online") renderKeepFocus();
    }
  }

  function copyText(text, done, fail) {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      if (ok) done(); else fail();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
