        <div class="stat money"><div class="k">Money</div><div class="v" data-num="money" data-prefix="$">$${g.money}</div></div>
        <div class="stat"><div class="k">Total score</div><div class="v gold" data-num="total">${UI.num(g.total)}</div></div>
      </div>
      <div class="progress${done ? " done" : ""}" role="progressbar" aria-label="Round points" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${g.round_score}">
        <div class="bar" style="width:${pct}%"></div>
      </div>
      ${roundLine}
    </section>`;
  }

  function pileHTML(g, ids, title, hint, nextN, hlSet) {
    if (!ids.length) return `<section class="panel"><h2>${title}</h2><p class="muted" style="margin:0">Empty: no more cards to draw this round.</p></section>`;
    const items = ids.map((c, i) => `<div class="slot">${cardHTML(g, c, { size: "mini", cls: (i < nextN ? "next-draw" : "") + (hlSet && hlSet.has(c) ? " hl" : "") })}<div class="pos">${i + 1}</div></div>`).join("");
    return `<section class="panel"><div class="toolbar"><h2>${title}</h2><span class="muted" style="font-size:12px">${hint}</span></div><div class="strip" tabindex="0" aria-label="${esc(title)}">${items}</div></section>`;
  }

  function previewHTML(g) {
    const p = UI.preview(g, S.sel);
    if (!p) return `<div class="preview muted" aria-live="polite">Select 1 to 5 cards to see what they score. The input shows every future draw, so plan ahead with the draw pile below.</div>`;
    if (!p.res) return `<div class="preview" aria-live="polite"><span class="err">At most 5 cards can be played or discarded.</span></div>`;
    const r = p.res;
    const parts = r.parts.filter((x) => x.base || x.mult || x.times !== 1 || x.money).map((x) => {
      const bits = [];
      if (x.base) bits.push(`+${x.base} base`);
      if (x.mult) bits.push(`+${x.mult} mult`);
      if (x.times !== 1) bits.push(`×${x.times}`);
      if (x.money) bits.push(`+$${x.money}`);
      return `<span class="chip on">${esc(UI.prettyMod(x.name))}: ${bits.join(", ")}</span>`;
    }).join("");
    let after = "";
    if (p.after) {
      if (p.after.phase === "play") after = `Round would be at ${UI.num(p.after.round_score)} / ${UI.num(g.target)}.`;
      else if (p.after.cleared) after = `Ends the round: cleared with ${UI.num(p.after.round_score)}, money becomes $${p.after.money}.`;
      else after = `Ends the round below target (${UI.num(p.after.round_score)} / ${UI.num(g.target)}): the run would be over.`;
    }
    const kick = S.sel.length - r.scored.length;
    return `<div class="preview" aria-live="polite">
      <div class="toolbar"><span class="hand-name">${esc(PR.HAND_NAMES[r.hand])} <span class="muted" style="font-size:14px;font-weight:600">level ${g.levels[r.hand]}</span></span>
      <span class="gold" style="font-size:22px;font-weight:800">${UI.num(r.points)} pts${r.money ? ` · +$${r.money}` : ""}</span></div>
      <div class="formula">base <b>${r.base}</b> × mult <b>${r.mult}</b>${r.times !== 1 ? ` × <b>${r.times}</b>` : ""} &nbsp;·&nbsp; ${esc(UI.formula(r))}</div>
      <div class="muted" style="font-size:13px;margin-top:4px">${r.scored.length} scored card${r.scored.length === 1 ? "" : "s"}${kick ? `, ${kick} kicker${kick === 1 ? "" : "s"}` : ""}. ${esc(after)}</div>
      ${parts ? `<div class="parts">${parts}</div>` : ""}
    </div>`;
  }

  function handHTML(g, opts) {
    const sel = new Set(opts.selected || []);
    const res = opts.selected && opts.selected.length && opts.selected.length <= 5 ? g.evaluate(opts.selected) : null;
    const scored = new Set(res ? res.scored : []);
    const hl = opts.highlight || new Set();
    const hlScored = opts.hlScored || new Set();
    return UI.sortedHand(g, opts.sort || "draw").map((c) => {
      let cls = "", tag = "";
      if (sel.has(c)) { cls = "sel " + (scored.has(c) ? "scored" : "kicker"); tag = scored.has(c) ? "scores" : "kicker"; }
      if (hl.has(c)) { cls += " hl" + (hlScored.has(c) ? " scored" : ""); }
      return cardHTML(g, c, { act: opts.interactive ? "card" : null, cls, tag, pressed: sel.has(c),
        aria: sel.has(c) ? "selected" : "" });
    }).join("");
  }

  function playPanelHTML(g, interactive) {
    const sel = S.sel;
    const p = interactive ? UI.preview(g, sel) : null;
    const playErr = !sel.length ? "Select 1 to 5 cards" : p ? p.playErr : "";
    const discErr = !sel.length ? "Select 1 to 5 cards" : p ? p.discardErr : "";
    const endErr = g.tryMove("end");
    const reward = !endErr ? UI.roundReward(g) : 0;
    const sortSel = `<label class="muted" style="font-size:13px">Order <select id="sort-hand" aria-label="Hand order">
        ${["draw", "rank", "suit"].map((v) => `<option value="${v}"${S.sort === v ? " selected" : ""}>${v === "draw" ? "as drawn" : "by " + v}</option>`).join("")}
      </select></label>`;
    return `<section class="panel" aria-label="Your hand">
      <div class="toolbar"><h2 style="margin:0">Hand <span class="muted" style="text-transform:none;letter-spacing:0">(${g.hand.length} cards)</span></h2>${sortSel}</div>
      <div class="hand" id="hand">${handHTML(g, { interactive: true, selected: sel, sort: S.sort })}</div>
      <div class="actions">
        ${btn(`Play${sel.length ? " " + sel.length : ""}`, "play", { cls: "primary", err: playErr })}
        ${btn(`Discard${sel.length ? " " + sel.length : ""}`, "discard", { err: discErr })}
        ${btn("End round", "end", { err: endErr, title: !endErr ? `Clear now for +$${reward}` : "" })}
        ${btn("Clear selection", "clear-sel", { err: sel.length ? "" : "Nothing selected" })}
        ${!endErr ? `<span class="muted" style="font-size:13px">Ending now pays +$${reward}</span>` : ""}
      </div>
      ${previewHTML(g)}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>`;
  }

  function handTableHTML(g, interactive, litCode) {
    const classic = PR.getRuleset("classic");
    const rows = g.rules.hands.map(([code, name]) => {
      const lvl = g.levels[code];
      const [b, m] = g.rules.handValue(code, lvl);
      const [cb, cm] = classic.handValue(code, lvl);
      const cell = (v, c) => (v !== c ? `<td class="num changed" title="classic: ${c}">${v}</td>` : `<td class="num">${v}</td>`);
      const err = g.phase === "shop" ? g.tryMove("level " + code) : "Only in the shop";
      const action = interactive && g.phase === "shop" ? `<td class="num">${btn("Level up", "level", { v: code, price: g.levelPrice(code), err, cls: "small", aria: `Level up ${name} for $${g.levelPrice(code)}` })}</td>` : "";
      return `<tr class="${code === litCode ? "lit" : ""}"><td class="mono">${code}</td><td>${name}</td><td class="num">${lvl}</td>${cell(b, cb)}${cell(m, cm)}${action}</tr>`;
    }).join("");
    const head = interactive && g.phase === "shop" ? '<th class="num">Price</th>' : "";
    const note = g.rules.name !== "classic" ? `<span class="muted" style="font-size:12px">${esc(UI.rulesTitle(g.rules.name))} values · green = changed</span>` : "";
    return `<section class="panel" aria-label="Hand types"><div class="toolbar"><h2 style="margin:0">Hand types</h2>${note}</div><div class="scroll-x"><table class="hands">
      <thead><tr><th>Code</th><th>Hand</th><th class="num">Lvl</th><th class="num">Base</th><th class="num">Mult</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;
  }

  function modsHTML(g, interactive) {
    const list = g.mods.map(([name, state]) => {
      const [price, fx] = g.rules.modifiers[name];
      const st = UI.modState(name, state, g.rules);
      const sell = interactive && g.phase === "shop" ? btn("Sell", "sell", { v: name, cls: "small", title: `Sell for $${Math.floor(price / 2)}`, aria: `Sell ${name} for $${Math.floor(price / 2)}` }) + ` <span class="muted" style="font-size:12px">+$${Math.floor(price / 2)}</span>` : `<span class="muted" style="font-size:12px">$${price}</span>`;
      return `<div class="mod"><span class="name">${esc(UI.prettyMod(name))}</span><span>${sell}</span><span class="fx">${esc(fx)}</span>${st ? `<span class="state">${esc(st)}</span>` : ""}</div>`;
    }).join("");
    return `<section class="panel" aria-label="Modifiers"><div class="toolbar"><h2 style="margin:0">Modifiers</h2><span class="slots-left">${g.mods.length} / ${g.inst.slots} slots</span></div>
      <div class="mods" style="margin-top:8px">${list || '<p class="muted" style="margin:0">None yet. Buy them in the shop after each round.</p>'}</div></section>`;
  }

  function shopHTML(g) {
    const prices = g.prices();
    const queue = g.inst.offers[g.round];
    const st = M.stash ? mpCur() : null, seat = st ? st.viewer : -1;   // a multiplayer player's shop
    const slots = st ? st.match.shopSlots(seat) : g.visibleSlots();
    const offers = slots.map(({ name, taken, owner }) => {
      const [price, fx] = g.rules.modifiers[name];
      if (taken) return `<div class="offer sold"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">Bought</div></div>`;
      if (owner >= 0) return `<div class="offer sold" style="--pc:${COLORS[owner]}"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">Drafted by <span class="pname">${esc(st.match.players[owner].name)}</span></div></div>`;
      const err = st ? st.match.tryMove("buy " + name, seat) : g.tryMove("buy " + name);
      return `<div class="offer"><div class="name">${esc(UI.prettyMod(name))}</div><div class="fx">${esc(fx)}</div>
        <div class="row"><span class="cost">$${price}</span>${btn("Buy", "buy", { v: name, cls: "primary small", err, aria: `Buy ${name} for $${price}` })}</div></div>`;
    }).join("");
    const later = queue.slice(g.offer_pos + g.rules.shop_window).map((m) => {
      const owner = st ? st.match.ownerOf(m, seat) : -1;
      const tip = owner >= 0 ? `drafted by ${st.match.players[owner].name}` : g.rules.modifiers[m] ? `$${g.rules.modifiers[m][0]}: ${g.rules.modifiers[m][1]}` : "";
      return `<span class="chip" title="${esc(tip)}"${owner >= 0 ? ' style="opacity:.45;text-decoration:line-through"' : ""}>${esc(UI.prettyMod(m))}</span>`;
    }).join("");
    const pick = S.deckPick;
    let deckActions = '<span class="muted">Pick a card below to remove, paint or promote it.</span>';
    if (pick !== null && g.in_deck[pick]) {
      const paint = [0, 1, 2, 3].map((s) => btn(UI.SUIT_GLYPH[s], "paint", { v: s, cls: "small", err: g.tryMove(`paint ${pick} ${PR.SUITS[s]}`), aria: `Paint card ${pick} ${["spades", "hearts", "diamonds", "clubs"][s]} for $${prices.paint}` })).join("");
      deckActions = `${cardHTML(g, pick, { size: "mini" })}
        <span>Card <b class="mono">${pick}</b> (${esc(UI.faceText(g, pick))})</span>
        ${btn("Remove", "remove", { price: prices.remove, err: g.tryMove("remove " + pick), cls: "small" })}
        <span class="muted" style="font-size:13px">Paint $${prices.paint}</span>${paint}
        ${btn("Promote", "promote", { price: prices.promote, err: g.tryMove("promote " + pick), cls: "small" })}
        ${btn("Done", "deck-pick", { v: "", cls: "small" })}`;
    }
    const deck = UI.deckOrder(g).map((c) => g.in_deck[c]
      ? cardHTML(g, c, { size: "deckc", act: "deck-pick", cls: c === pick ? "pick" : "", pressed: c === pick })
      : cardHTML(g, c, { size: "deckc", cls: "gone", aria: "removed" })).join("");
    return `<section class="panel" aria-label="Shop">
      <div class="toolbar"><h2 style="margin:0">Shop after round ${g.round + 1}</h2>
        <div class="actions">${btn(st && st.match.mode === "draft" ? "Done shopping →" : st && st.match.mode === "rounds" ? "Next round · end turn →" : "Next round →", "next", { cls: "primary", err: g.tryMove("next") })}</div></div>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">Offers ${g.offer_pos + 1}–${Math.min(g.offer_pos + g.rules.shop_window, queue.length)} of ${queue.length} in this shop's queue.${st && st.match.mode === "draft" ? ` ${esc(draftNote(st, seat))}` : ""}</p>
      <div class="offers">${offers || '<p class="muted">No offers.</p>'}</div>
      <div class="actions" style="margin-top:10px">
        ${btn("Reroll", "reroll", { price: prices.reroll, err: g.tryMove("reroll") })}
        ${btn("+1 discard", "discards", { price: prices.discards, err: g.tryMove("discards"), title: "+1 discard every round from now on" })}
        ${btn("+1 hand size", "handsize", { price: prices.handsize, err: g.tryMove("handsize"), title: `+1 hand size (max ${g.rules.max_hand_size})` })}
      </div>
      ${later ? `<div class="queue-later"><span class="muted">Later in the queue:</span>${later}</div>` : ""}
      <div class="msg" id="play-msg" role="status" aria-live="polite">${S.msg ? `<div class="${S.msg.kind === "err" ? "err" : "okmsg"}">${esc(S.msg.text)}</div>` : ""}</div>
    </section>
    <section class="panel" aria-label="Deck editor">
      <div class="toolbar"><h2 style="margin:0">Deck</h2><span class="muted" style="font-size:13px">${g.deck_size} cards (min ${g.rules.min_deck}) · gold dot = painted or promoted</span></div>
      <div class="deck-actions">${deckActions}</div>
      <div class="deckgrid">${deck}</div>
    </section>`;
  }

  function summaryHTML(g) {
    const o = UI.outcome(g);
    return `<section class="panel summary" aria-label="Run summary">
      <div class="muted" style="text-transform:uppercase;letter-spacing:.14em;font-size:13px">${o.won ? "Run complete" : "Run over"}</div>
      <div class="big">${UI.num(o.score)}</div>
      <div class="sub">points · cleared ${o.cleared} of ${o.rounds} rounds</div>
      <p>${esc(o.text)}</p>
      <div class="actions" style="justify-content:center">${btn("Undo last move", "undo", { err: S.moves.length ? "" : "Nothing to undo" })}${btn("Replay this run", "rp-from-play")}${btn("Deal a new seed", "random-seed", { cls: "primary" })}</div>
    </section>`;
  }

  function logHTML(moves, labels, cur, bad) {
    const items = moves.map((m, i) => `<li class="${i + 1 === cur ? "cur" : ""}${i + 1 === bad ? " bad" : ""}"${S.mode === "replay" ? ` data-step="${i + 1}"` : ""}><span class="n">${i + 1}</span><span><span class="m">${esc(m)}</span>${labels[i] ? ` <span class="d">${esc(labels[i])}</span>` : ""}</span></li>`).join("");
    return `<ol class="log" id="${S.mode === "replay" ? "rp-log" : "play-log"}" aria-label="Move log">${items || '<li class="muted"><span></span><span>No moves yet.</span></li>'}</ol>`;
  }

  function rulesBoxHTML(rules) {
    const changes = UI.rulesChanges(rules);
    if (!changes.length) return "";
    const items = changes.map((c) => `<li><b>${esc(c.what)}</b>: ${esc(c.now)} <span title="classic">(classic: ${esc(c.was)})</span></li>`).join("");
    return `<section class="panel" aria-label="Rules in play"><details class="rules-box">
      <summary>${esc(UI.rulesTitle(PR.getRuleset(rules).name))} rules: ${changes.length} changes from classic</summary>
      <ul class="rules-notes">${items}</ul></details></section>`;
  }

  function sideHTML(g) {
    const out = outputText();
    const rulesNote = g.rules.name !== "classic"
      ? `<p class="muted" style="margin:0 0 6px;font-size:12px">Played with the <b>${esc(UI.rulesTitle(g.rules.name))}</b> rules: score it with <span class="mono">python -m poker_run check in.txt out.txt --rules ${esc(g.rules.name)}</span>. The contest judge uses the classic rules.</p>`
      : "";
    return `${modsHTML(g, true)}${rulesBoxHTML(g.rules)}
      <section class="panel" aria-label="Moves">
        <div class="toolbar"><h2 style="margin:0">Moves (${S.moves.length})</h2>${btn("Undo", "undo", { err: undoErr(), title: "Undo the last move" })}</div>
        <div style="margin-top:8px">${logHTML(S.moves, S.labels, 0, 0)}</div>
      </section>
      <section class="panel export" aria-label="Export">
        <h2>Output file</h2>
        ${rulesNote}<textarea id="export-text" readonly spellcheck="false" aria-label="Output text">${esc(out)}</textarea>
        <div class="actions" style="margin-top:8px">${btn("Copy", "copy")}${btn("Download", "download")}
          <span class="muted" style="font-size:12px">${esc(sourceLabel())}${g.rules.name !== "classic" ? ` · ${esc(g.rules.name)} rules` : ""}</span></div>
        <div class="msg" id="export-msg" role="status" aria-live="polite"></div>
      </section>`;
  }

  function sourceLabel() { return S.source.type === "seed" ? `seed ${S.source.seed}` : "custom input"; }

  function renderPlay() {
    if (S.kind !== "solo" && mpRender()) return;
    const g = S.game;
    const st = M.stash ? mpCur() : null;
    let main = (st ? mpTopHTML(st) : "") + statusHTML(g);
    if (g.phase === "play") {
      main += playPanelHTML(g, true);
      const nextN = S.sel.length ? Math.min(S.sel.length, g.pile.length) : 0;
      main += pileHTML(g, g.pile, "Draw pile", nextN ? `gold = the ${nextN} card${nextN === 1 ? "" : "s"} you'd draw next` : "next card first", nextN);
      main += handTableHTML(g, true, S.sel.length && S.sel.length <= 5 ? g.evaluate(S.sel).hand : null);
    } else if (g.phase === "shop") {
      main += shopHTML(g);
      main += handTableHTML(g, true, null);
      main += pileHTML(g, UI.nextRoundPile(g), `Round ${g.round + 2} draw order`, "in draw order \u00b7 gold = your opening hand", Math.min(g.hand_size, UI.nextRoundPile(g).length));
    } else {
      main += summaryHTML(g);
      main += handTableHTML(g, false, null);
    }
    $("play-main").innerHTML = main;
    $("play-side").innerHTML = (st ? mpSideHTML(st) : "") + sideHTML(g);
    Feel.afterRender(g);
    Scroll.fill(g);
    if (st) mpAfterRender(st);
  }

  // ---------- replay
  function runReplay() {
    const input = $("rp-input").value, output = $("rp-output").value;
    const [code, v] = PR.check(input, output, S.rules);
    const rp = { code, verdict: v, rules: S.rules, inst: null, moves: [], states: null, errorAt: null, error: null, labels: [] };
    try { rp.inst = PR.parseInstance(input); } catch (e) { if (!(e instanceof PR.BadInput)) throw e; }
    if (rp.inst) {
      try { rp.moves = PR.parseOutput(output); } catch (e) { rp.moves = null; }
    }
    if (rp.inst && rp.moves) {
      const r = UI.replayStates(rp.inst, rp.moves, S.rules);
      rp.states = r.states; rp.errorAt = r.errorAt; rp.error = r.error;
      rp.labels = rp.moves.map((m, i) => (i < r.states.length ? UI.describe(r.states[i], m) : ""));
    }
    S.rp = rp;
    S.rpStep = rp.states ? (rp.errorAt ? rp.states.length - 1 : 0) : 0;
    renderReplay();
  }

  function renderReplay() {
    const rp = S.rp;
    const vEl = $("rp-verdict");
    if (!rp) { vEl.innerHTML = ""; $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    const codeName = ["valid", "illegal move", "unparsable output", "bad input"][rp.code];
    const by = rp.rules !== "classic" ? ` <span class="rules-tag">${esc(UI.rulesTitle(rp.rules))} rules</span>` : "";
    vEl.innerHTML = rp.verdict.valid
      ? `<div class="okmsg"><b>Valid.</b> ${esc(UI.verdictText(rp.code, rp.verdict))}${by}</div>`
      : `<div class="err"><b>Invalid (${codeName}, exit ${rp.code}), score 0.</b> ${esc(rp.verdict.error)}${by}</div>`;
    if (!rp.states) { $("rp-stepper-panel").classList.add("hidden"); $("rp-board").classList.add("hidden"); return; }
    $("rp-stepper-panel").classList.remove("hidden");
    $("rp-board").classList.remove("hidden");
    const n = rp.states.length - 1;
    const k = Math.max(0, Math.min(S.rpStep, n));
    S.rpStep = k;
    const slider = $("rp-slider");
    slider.max = String(n); slider.value = String(k);
    $("rp-pos").textContent = `move ${k} / ${rp.moves.length}`;
    const g = rp.states[k];

    // The next move's cards are highlighted on this board; the last move is shown separately.
    const nextMove = k < rp.moves.length ? rp.moves[k] : null;
    const nextCards = nextMove ? new Set(UI.moveCards(nextMove)) : new Set();
    let nextScored = new Set();
    if (nextMove && /^play\b/.test(nextMove) && !g.tryMove(nextMove)) nextScored = new Set(g.evaluate(UI.moveCards(nextMove)).scored);
    let last = "";
    if (k > 0) {
      const prev = rp.states[k - 1], m = rp.moves[k - 1];
      const cards = UI.moveCards(m);
      let res = null;
      if (/^play\b/.test(m)) res = prev.evaluate(cards, true);
      const scored = new Set(res ? res.scored : []);
      const faces = cards.map((c) => cardHTML(prev, c, { cls: /^play\b/.test(m) ? "sel " + (scored.has(c) ? "scored" : "kicker") : "", tag: res ? (scored.has(c) ? "scores" : "kicker") : "" })).join("");
      last = `<div class="lastmove"><div><span class="muted">Move ${k}:</span> <b class="mono">${esc(m)}</b> <span class="muted">${esc(rp.labels[k - 1] || "")}</span></div>
        ${faces ? `<div class="cards" style="padding-bottom:10px">${faces}</div>` : ""}
        ${res ? `<div class="formula mono" style="font-size:13px">${esc(PR.HAND_NAMES[res.hand])}: ${esc(UI.formula(res))}${res.money ? ` · +$${res.money}` : ""}</div>` : ""}</div>`;
    }
    let nextLine = "";
    if (nextMove) {
      const bad = rp.errorAt === k + 1;
      nextLine = `<div class="${bad ? "err" : "muted"}" style="margin-top:8px">Next, move ${k + 1}: <b class="mono">${esc(nextMove)}</b>${bad ? ` — illegal: ${esc(rp.error)}` : ` <span>${esc(rp.labels[k] || "")}</span> (highlighted)`}</div>`;
    } else if (k === rp.moves.length) {
      nextLine = `<div class="muted" style="margin-top:8px">End of the output.${g.over ? "" : " The run was not finished; the score is the points so far."}</div>`;
    }
    let main = statusHTML(g);
    if (g.phase === "play") {
      main += `<section class="panel" aria-label="Hand at this step"><h2>Hand</h2><div class="hand">${handHTML(g, { interactive: false, highlight: nextCards, hlScored: nextScored })}</div>${last}${nextLine}</section>`;
      main += pileHTML(g, g.pile, "Draw pile", "next card first", 0, nextCards);
    } else if (g.phase === "shop") {
      const offers = g.visibleSlots().map(({ name, taken }) => `<span class="chip${taken ? "" : " on"}">${esc(UI.prettyMod(name))}${taken ? " (bought)" : ` $${g.rules.price(name)}`}</span>`).join(" ");
      main += `<section class="panel" aria-label="Shop at this step"><h2>Shop after round ${g.round + 1}</h2>
        <div class="parts">${offers || '<span class="muted">No offers left in the window.</span>'}</div>
        <p class="muted" style="font-size:13px">Prices: reroll $${g.prices().reroll}, +discard $${g.prices().discards}, +hand size $${g.prices().handsize}, remove $${g.prices().remove}, paint $${g.prices().paint}, promote $${g.prices().promote}.</p>
        ${last}${nextLine}</section>`;
      const deck = UI.deckOrder(g).map((c) => cardHTML(g, c, { size: "deckc", cls: (g.in_deck[c] ? "" : "gone") + (nextCards.has(c) ? " hl" : "") })).join("");
      main += `<section class="panel" aria-label="Deck"><h2>Deck (${g.deck_size} cards)</h2><div class="deckgrid">${deck}</div></section>`;
    } else {
      const o = UI.outcome(g);
      main += `<section class="panel summary"><div class="big">${UI.num(o.score)}</div><div class="sub">cleared ${o.cleared} of ${o.rounds} rounds</div><p>${esc(o.text)}</p>${last}${nextLine}</section>`;
    }
    main += handTableHTML(g, false, null);
    $("rp-main").innerHTML = main;
    $("rp-side").innerHTML = modsHTML(g, false) + `<section class="panel"><h2>Moves (${rp.moves.length})</h2>${logHTML(rp.moves, rp.labels, k, rp.errorAt || 0)}</section>`;
    const cur = document.querySelector("#rp-log li.cur");
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }

  // ---------- top-level render
  function render() {
    if (S.mode !== "play" || S.kind === "solo") useSolo();
    $("view-play").classList.toggle("hidden", S.mode !== "play");
    $("view-replay").classList.toggle("hidden", S.mode !== "replay");
    $("tab-play").setAttribute("aria-selected", String(S.mode === "play"));
    $("tab-replay").setAttribute("aria-selected", String(S.mode === "replay"));
    $("source-bar").classList.toggle("hidden", S.mode !== "play");
    $("source-bar").classList.toggle("mp", S.kind !== "solo");
    $("kind-pick").classList.toggle("hidden", S.mode !== "play");
    const rules = curRules();
    document.querySelectorAll('[data-act="rules"]').forEach((b) => b.setAttribute("aria-checked", String(b.dataset.v === rules)));
    document.querySelectorAll('[data-act="kind"]').forEach((b) => b.setAttribute("aria-checked", String(b.dataset.v === S.kind)));
    if (S.mode === "play") renderPlay(); else renderReplay();
    Scroll.request();
  }

  const cssEsc = (s) => (window.CSS && CSS.escape ? CSS.escape(s) : String(s).replace(/["\\]/g, "\\$&"));

  // Re-render, keeping keyboard focus on the same control where possible.
  function renderKeepFocus() {
    const a = document.activeElement;
    const key = a && a.dataset ? [a.dataset.act, a.dataset.id, a.dataset.v] : null;
    render();
    if (key && key[0]) {
      const sel = `[data-act="${key[0]}"]` + (key[1] !== undefined ? `[data-id="${key[1]}"]` : "") + (key[2] !== undefined ? `[data-v="${cssEsc(key[2])}"]` : "");
      const el = document.querySelector(sel);
      if (el && !el.disabled) el.focus();
    }
  }

  function flash(id, kind, text) {
    const el = $(id);
    if (el) el.innerHTML = `<div class="${kind === "err" ? "err" : "okmsg"}">${esc(text)}</div>`;
  }

  // ======================================================================
  // Multiplayer: vs Bot, pass-and-play and the shared-shop draft (bot.js, multiplayer.js).
  // Each mode keeps one match (M.games[kind]); the solo game is never touched.
  // ======================================================================
  const MP_KEY = "poker-run:mp:v1", KIND_KEY = "poker-run:kind";
  const KINDS = { solo: "Solo", bot: "vs Bot", hotseat: "Pass & play", draft: "Draft" };
  const MODE_OF = { bot: "race", hotseat: "rounds", draft: "draft" };
  const COLORS = ["#f2c14e", "#6fd0e0", "#f08a76", "#b8a4f4"];
  const LEVEL_NAMES = { easy: "Easy", normal: "Normal", hard: "Hard" };
  const isRules = (r) => typeof r === "string" && Object.prototype.hasOwnProperty.call(PR.RULESETS, r);
  const ordinal = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
  const randomSeed = () => Math.floor(Math.random() * 1000000) + 1;
  const scrollTop = () => { try { scrollTo({ top: 0, behavior: Feel.calm ? "auto" : "smooth" }); } catch (e) { /* old browsers */ } };

  function mpCur() { return S.kind !== "solo" ? M.games[S.kind] : null; }
  function curRules() {
    if (S.mode !== "play" || S.kind === "solo") return S.rules;
    const st = mpCur();
    return st && !st.match.over ? st.match.rules : M.rules;
  }
  function mpWho() {
    const st = M.stash ? mpCur() : null;
    return st ? { name: st.match.players[st.viewer].name, color: COLORS[st.viewer] } : null;
  }
  function undoErr() {
    if (!M.stash) return S.moves.length ? "" : "Nothing to undo";
    return mpCur().match.canUndo() ? "" : "Only moves made in this turn can be undone";
  }

  // ---- persistence: setups and each mode's match (its seed and move log), per viewer
  function saveMP() {
    const games = {};
    for (const [k, st] of Object.entries(M.games)) {
      if (st) games[k] = { seed: st.seed, match: st.match.toJSON(), screen: st.screen, viewer: st.viewer, revealed: st.revealed, from: st.from };
    }
    try { localStorage.setItem(MP_KEY, JSON.stringify({ rules: M.rules, setups: M.setups, games })); } catch (e) { /* storage unavailable */ }
  }

  function restoreMP() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(MP_KEY) || "null"); } catch (e) { raw = null; }
    if (!raw || typeof raw !== "object") return;
    if (isRules(raw.rules)) M.rules = raw.rules;
    const su = raw.setups || {};
    if (su.bot && typeof su.bot === "object") {
      if (typeof su.bot.name === "string") M.setups.bot.name = su.bot.name.slice(0, 24);
      if (LEVEL_NAMES[su.bot.level]) M.setups.bot.level = su.bot.level;
      if (Number.isSafeInteger(su.bot.seed)) M.setups.bot.seed = su.bot.seed;
    }
    for (const k of ["hotseat", "draft"]) {
      const s = su[k];
      if (!s || typeof s !== "object") continue;
      if ([2, 3, 4].includes(s.n)) M.setups[k].n = s.n;
      if (Number.isSafeInteger(s.seed)) M.setups[k].seed = s.seed;
      (Array.isArray(s.players) ? s.players : []).slice(0, 4).forEach((p, i) => {
        if (p && typeof p.name === "string") M.setups[k].players[i].name = p.name.slice(0, 24);
        if (p && (p.bot === null || LEVEL_NAMES[p.bot])) M.setups[k].players[i].bot = p.bot;
      });
    }
    for (const k of Object.keys(M.games)) {
      const g = raw.games && raw.games[k];
      if (!g || !Number.isSafeInteger(g.seed) || !g.match) continue;
      try {
        const st = newMatch(k, g.seed, g.match);
        st.screen = ["turn", "handoff", "results"].includes(g.screen) ? g.screen : "handoff";
        st.viewer = Number.isInteger(g.viewer) ? g.viewer : -1;
        st.revealed = Number.isInteger(g.revealed) ? g.revealed : 0;
        st.from = Number.isInteger(g.from) ? g.from : -1;
        st.celebrated = st.screen === "results";
        M.games[k] = st;
      } catch (e) { M.games[k] = null; /* a stale or broken save: start over */ }
    }
  }

  function newMatch(kind, seed, opts) {
    const inst = PR.generate(seed);
    const match = new PokerMulti.Match(inst, opts);
    if (match.mode !== MODE_OF[kind]) throw new Error("mode mismatch");
    return { kind, seed, text: PR.formatInstance(inst), match, screen: "handoff", viewer: -1, revealed: 0, from: -1, labels: {}, celebrated: false };
  }

  function mpStart(kind, seed) {
    const su = M.setups[kind];
    const players = kind === "bot"
      ? [{ name: su.name.trim() || "You" }, { name: "Bot", bot: su.level }]
      : su.players.slice(0, su.n).map((p, i) => ({ name: p.name.trim() || `Player ${i + 1}`, bot: p.bot || null }));
    const st = newMatch(kind, seed, { mode: MODE_OF[kind], rules: M.rules, players });
    const mt = st.match, humans = players.filter((p) => !p.bot).length;
    if (mt.over) st.screen = "results";
    else if (kind === "bot" || (humans === 1 && !mt.history.length)) { st.screen = "turn"; st.viewer = mt.turn.seat; }
    su.seed = seed;
    M.games[kind] = st;
    S.who = "";   // a new match: every hand is dealt fresh
    saveMP();
    return st;
  }

  // ---- whose game is on screen
  function useSeat(st, seat) {
    if (!M.stash) M.stash = { source: S.source, inputText: S.inputText, inst: S.inst, moves: S.moves, labels: S.labels, game: S.game, sel: S.sel, deckPick: S.deckPick, msg: S.msg, who: S.who };
    const who = `${st.kind}:${seat}`;
    if (S.who !== who) { S.sel = []; S.deckPick = null; S.msg = null; S.who = who; }
    const pl = st.match.players[seat];
    S.source = { type: "seed", seed: st.seed };
    S.inputText = st.text;
    S.inst = st.match.inst;
    S.game = pl.game;
    S.moves = pl.moves.slice();
    S.labels = labelsOf(st, seat);
  }
  function useSolo() { if (M.stash) { Object.assign(S, M.stash); M.stash = null; } }

  function labelsOf(st, seat) {
    const pl = st.match.players[seat], key = pl.moves.join("\n");
    const c = st.labels[seat];
    if (c && c.key === key) return c.labels;
    const g = new PR.Game(st.match.inst, st.match.rules), labels = [];
    for (const m of pl.moves) { labels.push(UI.describe(g, m)); g.apply(m); }
    st.labels[seat] = { key, labels };
    return labels;
  }

  function setKind(k, quiet) {
    if (!KINDS[k] || k === S.kind) return;
    S.kind = k;
    try { localStorage.setItem(KIND_KEY, k); } catch (e) { /* storage unavailable */ }
    if (!quiet) Sound.tap();
    if (k === "solo") { useSolo(); soloHash(); } else {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* no URL updates here */ }
    }
    if (!quiet) render();
  }

  // ---- moves
  function mpMove(line) {
    const st = mpCur(), mt = st.match, seat = st.viewer;
    const err = mt.tryMove(line, seat);
    if (err) { S.msg = { kind: "err", text: `${line}: ${err}` }; Sound.oops(); renderKeepFocus(); return false; }
    const before = S.game.clone(), n0 = mt.history.length;
    mt.apply(line, seat);   // the bots move now too, if their turn comes
    const after = mt.players[seat].game;
    const others = mt.history.slice(n0 + 1).some((h) => h.seat !== seat);
    S.msg = null;
    S.sel = after.phase === "play" ? S.sel.filter((c) => after.hand.includes(c)) : [];
    if (S.deckPick !== null && (!after.in_deck[S.deckPick] || after.phase !== "shop")) S.deckPick = null;
    st.from = seat;
    if (mt.over) st.screen = "results";
    else if (mt.mode !== "race" && (mt.turn.seat !== seat || others)) st.screen = "handoff";
    saveMP();
    renderKeepFocus();
    Feel.afterMove(line, before, after);
    if (st.screen !== "turn") scrollTop();
    return true;
  }

  function mpUndo() {
    const st = mpCur(), mt = st.match;
    if (!mt.canUndo()) { S.msg = { kind: "err", text: "Only moves made in this turn can be undone." }; Sound.oops(); render(); return; }
    const last = mt.history[mt.history.length - 1].move;
    mt.undo();
    S.sel = []; S.deckPick = null;
    S.msg = { kind: "ok", text: `Undid "${last}".` };
    saveMP();
    render();
  }

  function mpRules(v) {
    if (!isRules(v) || v === curRules()) return;
    const st = mpCur();
    const live = st && !st.match.over && st.match.history.some((h) => !st.match.players[h.seat].bot);
    if (live && !window.confirm(`Switch to the ${UI.rulesTitle(v)} rules? This match starts again on the same seed.`)) return;
    M.rules = v;
    Sound.shuffle();
    if (st && !st.match.over) mpStart(S.kind, st.seed);
    saveMP();
    render();
  }

  // ---- what to show
  // Renders setup, hand-off or results and returns true; or points S at the player whose turn it is.
  function mpRender() {
    const st = mpCur();
    if (!st) { useSolo(); $("play-main").innerHTML = setupHTML(S.kind); $("play-side").innerHTML = setupSideHTML(S.kind); Scroll.request(); return true; }
    const mt = st.match;
    if (mt.over) st.screen = "results";
    if (st.screen === "results") { useSolo(); renderResults(st); Scroll.request(); return true; }
    const t = mt.turn;
    if (mt.mode === "race") { st.viewer = t.seat; st.screen = "turn"; }
    if (st.screen !== "turn" || st.viewer !== t.seat) {
      st.screen = "handoff";
      useSolo();
      $("play-main").innerHTML = handoffHTML(st) + boardHTML(st, t.seat);
      $("play-side").innerHTML = mpSideHTML(st);
      const go = document.querySelector('[data-act="mp-reveal"]');
      if (go) go.focus({ preventScroll: true });   // Enter or Space shows the next hand
      Scroll.request();
      return true;
    }
    useSeat(st, t.seat);
    return false;
  }

  function stageText(st, t) {
    const mt = st.match, R = mt.inst.rounds;
    if (t.stage === "play") return `plays round ${t.round + 1} of ${R}`;
    if (mt.mode === "draft") {
      const order = mt.shopOrder(t.round), k = order.indexOf(t.seat) + 1;
      return `picks ${ordinal(k)} of ${order.length} in the shared shop after round ${t.round + 1}`;
    }
    return `shops after round ${t.round + 1}`;
  }

  function draftNote(st, seat) {
    const order = st.match.shopOrder(st.match.players[seat].game.round);
    const k = order.indexOf(seat) + 1;
    return `Shared shop: you pick ${ordinal(k)} of ${order.length} (lowest total first). A modifier another player owns is gone for you; one they sell comes back.`;
  }

  function chipsHTML(st) {
    const mt = st.match;
    const lvl = mt.mode === "race" ? ` (${LEVEL_NAMES[mt.players[1].bot]})` : "";
    return `<span class="mp-chip">${esc(KINDS[st.kind])}${lvl}</span><span class="mp-chip">seed <b>${st.seed}</b></span>` +
      (mt.rules !== "classic" ? `<span class="rules-tag" style="margin:0">${esc(UI.rulesTitle(mt.rules))} rules</span>` : "");
  }

  // The turn indicator above the game, and (vs Bot) the race.
  function mpTopHTML(st) {
    const mt = st.match, t = mt.turn, pl = mt.players[t.seat];
    const what = mt.mode === "race" ? (t.stage === "play" ? `round ${t.round + 1} of ${mt.inst.rounds}` : `shop after round ${t.round + 1}`) : stageText(st, t);
    const bar = `<section class="panel turnbar" style="--pc:${COLORS[t.seat]}" aria-label="Whose turn">
      <span class="who"><span class="pdot"></span><span class="pname">${esc(pl.name)}</span></span><span class="what">${esc(what)}</span>
      <span class="tags">${chipsHTML(st)}</span></section>`;
    return bar + (mt.mode === "race" ? raceHTML(st) : "");
  }

  // vs Bot: how many of the bot's rounds are shown (one per round the player has finished).
  function revealCount(st) {
    const me = st.match.players[0];
    return me.game.over ? st.match.inst.rounds : me.rounds.filter((r) => r.cleared !== null).length;
  }
  const roundsTotal = (pl, n) => pl.rounds.slice(0, n).reduce((a, r) => a + r.score, 0);

  function pipsHTML(pl, n, fresh) {
    const R = pl.game.inst.rounds, out = [];
    for (let r = 0; r < R; r++) {
      const rec = r < n ? pl.rounds[r] : null;
      const done = rec && rec.cleared !== null;
      const cls = done ? (rec.cleared ? "ok" : "bad") : "";
      const pop = done && fresh && r >= fresh[0] && r < fresh[1] ? ` pop" style="--d:${(r - fresh[0]) * 140}ms` : "";
      out.push(`<span class="pip ${cls}${pop}" title="Round ${r + 1}${done ? `: ${rec.cleared ? "cleared" : "out"} with ${UI.num(rec.score)}` : ""}">${done ? (rec.cleared ? "✓" : "✗") + "&#8239;" + (r + 1) : r + 1}</span>`);
    }
    return out.join("");
  }

  function playsChips(rec) {
    return rec.plays.map((p) => `<span class="chip">${esc(PR.HAND_NAMES[p.hand])} ${UI.num(p.points)}</span>`).join("");
  }

  // One player's moves of one round (and its shop), with descriptions.
  function roundMovesHTML(st, seat, r) {
    const pl = st.match.players[seat], labels = labelsOf(st, seat);
    let off = 0;
    for (let k = 0; k < r; k++) off += pl.rounds[k] ? pl.rounds[k].moves.length + pl.rounds[k].shop.length : 0;
    const rec = pl.rounds[r], n = rec.moves.length + rec.shop.length;
    const items = pl.moves.slice(off, off + n).map((m, i) => `<li><span>${esc(m)}</span> <span class="muted">${esc(labels[off + i] || "")}</span></li>`).join("");
    return `<details><summary>Moves (${n})</summary><ol class="movelist">${items}</ol></details>`;
  }

  function raceHTML(st) {
    const mt = st.match, me = mt.players[0], bot = mt.players[1];
    const n = revealCount(st);
    const fresh = n > st.revealed ? [st.revealed, n] : null;
    const myTotal = me.game.total, botTotal = roundsTotal(bot, n);
    const max = Math.max(1, myTotal, botTotal);
    const lane = (pl, total, shown, f) => `<div class="lane" style="--pc:${COLORS[pl.seat]}"><span class="nm"><span class="pdot"></span>${esc(pl.name)}</span>
      <span class="track"><i data-race-bar="${pl.seat}" style="width:${(100 * total) / max}%"></i></span><span class="score" data-race="${pl.seat}">${UI.num(total)}</span></div>
      <div class="pips" style="--pc:${COLORS[pl.seat]};margin:-2px 0 10px">${pipsHTML(pl, shown, f)}</div>`;
    const diff = myTotal - botTotal;
    const lead = diff > 0 ? `${esc(me.name)} ${me.name === "You" ? "lead" : "leads"} by ${UI.num(diff)}` : diff < 0 ? `Bot leads by ${UI.num(-diff)}` : "Level";
    let reveal = `<p class="muted" style="margin:8px 0 0;font-size:13px">The bot plays the same deal. Its round ${me.game.round + 1} shows up when you finish yours.</p>`;
    const r = n - 1, rec = r >= 0 ? bot.rounds[r] : null;
    if (rec) {
      const head = rec.cleared ? `cleared round ${r + 1}: <b>${UI.num(rec.score)}</b> / ${UI.num(mt.inst.targets[r])}` : `went out in round ${r + 1}: ${UI.num(rec.score)} / ${UI.num(mt.inst.targets[r])}`;
      const buys = rec.shop.filter((m) => m.startsWith("buy ")).map((m) => UI.prettyMod(m.slice(4)));
      reveal = `<div class="reveal${fresh ? " fresh" : ""}" style="--pc:${COLORS[1]}"><div><span class="pname">Bot</span> ${head}</div>
        <div class="plays">${playsChips(rec)}${buys.length ? `<span class="chip on">bought ${esc(buys.join(", "))}</span>` : ""}</div>
        ${roundMovesHTML(st, 1, r)}</div>`;
    } else if (n > 0 && bot.game.over) {
      reveal = `<div class="reveal" style="--pc:${COLORS[1]}"><span class="pname">Bot</span> went out in round ${bot.game.round + 1}; you're racing its final ${UI.num(bot.game.total)}.</div>`;
    }
    return `<section class="panel race" aria-label="Race against the bot">
      <div class="toolbar"><h2 style="margin:0">Race</h2><span class="muted" style="font-size:13px">${lead}</span></div>
      ${lane(me, myTotal, n, null)}${lane(bot, botTotal, n, fresh)}${reveal}</section>`;
  }

  // After a vs Bot render: animate the bot's newly revealed rounds.
  function mpAfterRender(st) {
    if (st.match.mode !== "race") return;
    const n = revealCount(st);
    if (n <= st.revealed) return;
    const bot = st.match.players[1], from = roundsTotal(bot, st.revealed), to = roundsTotal(bot, n);
    st.revealed = n;
    saveMP();
    const el = document.querySelector('[data-race="1"]');
    if (el) Feel.countUp(el, from, to, "");
    const bar = document.querySelector('[data-race-bar="1"]');
    if (bar && !Feel.calm) {
      const w = bar.style.width, max = Math.max(1, st.match.players[0].game.total, to);
      bar.style.width = `${(100 * from) / max}%`;
      bar.getBoundingClientRect();
      bar.style.width = w;
    }
    setTimeout(() => Sound.next(), 650);
  }

  // Round-by-round scores of everyone. In a race, the bot's unrevealed rounds stay hidden.
  function boardHTML(st, current, all) {
    const mt = st.match, R = mt.inst.rounds;
    const rows = mt.standings(), place = Object.fromEntries(rows.map((r) => [r.seat, r.place]));
    const shown = (pl) => (all || mt.mode !== "race" || !pl.bot ? R : revealCount(st));
    const done = Math.max(0, ...mt.players.map((p) => Math.min(shown(p), p.rounds.filter((r) => r.cleared !== null).length)));
    const head = [...Array(R).keys()].map((r) => `<th>R${r + 1}</th>`).join("");
    const body = mt.players.map((pl) => {
      const n = shown(pl);
      const cells = [...Array(R).keys()].map((r) => {
        const rec = r < n ? pl.rounds[r] : null;
        if (rec && rec.cleared === true) return `<td>${UI.num(rec.score)}</td>`;
        if (rec && rec.cleared === false) return `<td class="out" title="out">✗ ${UI.num(rec.score)}</td>`;
        return `<td class="wait">${pl.game.over && r < n ? "" : "·"}</td>`;
      }).join("");
      const total = mt.mode === "race" && pl.bot && !all ? roundsTotal(pl, n) : pl.game.total;
      return `<tr class="${pl.seat === current ? "me" : ""}" style="--pc:${COLORS[pl.seat]}"><td><span class="place">${all || mt.over ? place[pl.seat] : ""}</span><span class="pdot"></span> <span class="pname">${esc(pl.name)}</span>${pl.bot ? ` <span class="muted" style="font-size:12px">${esc(LEVEL_NAMES[pl.bot])} bot</span>` : ""}</td>${cells}<td class="tot">${UI.num(total)}</td></tr>`;
    }).join("");
    return `<section class="panel" aria-label="Standings"><div class="toolbar"><h2 style="margin:0">Standings</h2><span class="muted" style="font-size:13px">${done ? `after round ${done}` : "no rounds played yet"}</span></div>
      <div class="scroll-x" style="margin-top:8px"><table class="board"><thead><tr><th>Player</th>${head}<th>Total</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
  }

  // Everything other players did since `seat` last moved, one line per turn.
  function recapHTML(st, seat) {
    const mt = st.match;
    let from = 0;
    for (let i = mt.history.length - 1; i >= 0; i--) if (mt.history[i].seat === seat) { from = i + 1; break; }
    const groups = [];
    for (let i = from; i < mt.history.length; i++) {
      const h = mt.history[i], last = groups[groups.length - 1];
      if (last && last.seat === h.seat && last.round === h.round && last.phase === h.phase) last.moves.push(h.move);
      else groups.push({ seat: h.seat, round: h.round, phase: h.phase, moves: [h.move] });
    }
    if (!groups.length) return "";
    const items = groups.slice(-12).map((gr, i) => {
      const pl = mt.players[gr.seat], rec = pl.rounds[gr.round];
      let t, sub = "";
      if (gr.phase === "play") {
        const target = UI.num(mt.inst.targets[gr.round]);
        t = rec.cleared === null ? `is playing round ${gr.round + 1}` : rec.cleared ? `cleared round ${gr.round + 1}: <b>${UI.num(rec.score)}</b> / ${target}` : `went out in round ${gr.round + 1}: ${UI.num(rec.score)} / ${target}`;
        sub = rec.plays.map((p) => `${PR.HAND_NAMES[p.hand]} ${UI.num(p.points)}`).join(" · ");
      } else {
        const buys = gr.moves.filter((m) => m.startsWith("buy ")).map((m) => UI.prettyMod(m.slice(4)));
        const sells = gr.moves.filter((m) => m.startsWith("sell ")).map((m) => UI.prettyMod(m.slice(5)));
        t = `shop after round ${gr.round + 1}: ${buys.length ? `bought <b>${esc(buys.join(", "))}</b>` : "bought no modifier"}${sells.length ? `, sold ${esc(sells.join(", "))}` : ""}`;
        const other = gr.moves.filter((m) => !/^(buy|sell|next)\b/.test(m)).length;
        sub = other ? `${other} other shop move${other === 1 ? "" : "s"} (levels, deck edits, rerolls)` : "";
      }
      return `<div class="ev" style="--pc:${COLORS[gr.seat]};--d:${i * 70}ms"><span class="pdot"></span><span class="t"><span class="pname">${esc(pl.name)}</span> ${t}</span>${sub ? `<span class="s">${esc(sub)}</span>` : ""}</div>`;
    }).join("");
    return `<div class="recap"><h3>Since ${esc(mt.players[seat].name)}'s last turn</h3>${items}</div>`;
  }

  function handoffHTML(st) {
    const mt = st.match, t = mt.turn, pl = mt.players[t.seat];
    const humans = mt.players.filter((p) => !p.bot).length;
    const title = humans > 1 && st.from !== t.seat ? (st.from < 0 && !mt.history.length ? "First up" : "Pass to") : "Your turn,";
    const backs = [0, 1, 2, 3, 4].map((i) => `<span class="card back" style="rotate:${(i - 2) * 7}deg;--d:${i * 0.18}s"></span>`).join("");
    const label = humans > 1 ? `I'm ${pl.name}: show my hand` : "Continue";
    return `<section class="panel handoff" style="--pc:${COLORS[t.seat]}" aria-label="Pass the device">
      <div class="kicker">${esc(KINDS[st.kind])} · seed ${st.seed} · round ${t.round + 1} of ${mt.inst.rounds}</div>
      <div class="fan" aria-hidden="true">${backs}</div>
      <div class="to">${esc(title)}</div>
      <div class="big-name">${esc(pl.name)}</div>
      <p class="task">${esc(pl.name)} ${esc(stageText(st, t))}.</p>
      ${humans > 1 ? `<p class="muted" style="margin:-8px 0 16px;font-size:13px">The other hands are hidden. Press when only ${esc(pl.name)} is looking.</p>` : ""}
      <button type="button" class="btn primary" data-act="mp-reveal">${esc(label)}</button>
      ${recapHTML(st, t.seat)}
    </section>`;
  }

  function statusOf(st, pl) {
    const mt = st.match, g = pl.game, t = mt.turn;
    if (mt.mode === "race" && pl.bot && !mt.over) {
      const n = revealCount(st);
      return n ? `round ${Math.min(n, pl.rounds.length)} shown` : "waiting for your round 1";
    }
    if (g.over) return g.cleared === mt.inst.rounds ? `cleared all ${mt.inst.rounds} rounds` : `out in round ${g.round + 1}`;
    if (t && t.seat === pl.seat) return t.stage === "play" ? `playing round ${g.round + 1}` : "in the shop";
    return g.phase === "shop" ? `waiting to shop (round ${g.round + 1})` : `waiting · round ${g.round + 1}`;
  }

  function mpSideHTML(st) {
    const mt = st.match, t = mt.turn;
    const rows = mt.players.map((pl) => {
      const total = mt.mode === "race" && pl.bot && !mt.over ? roundsTotal(pl, revealCount(st)) : pl.game.total;
      return `<div class="pr${t && t.seat === pl.seat ? " now" : ""}" style="--pc:${COLORS[pl.seat]}"><span class="pdot"></span>
        <span style="min-width:0"><span class="pname">${esc(pl.name)}</span>${pl.bot ? ` <span class="muted" style="font-size:12px">${esc(LEVEL_NAMES[pl.bot])} bot</span>` : ""}<br><span class="muted" style="font-size:12px">${esc(statusOf(st, pl))}</span></span>
        <span class="gold" style="font-weight:800;font-variant-numeric:tabular-nums">${UI.num(total)}</span></div>`;
    }).join("");
    return `<section class="panel" aria-label="Players">
      <div class="toolbar"><h2 style="margin:0">Players</h2><span class="actions">${chipsHTML(st)}</span></div>
      <div class="plist" style="margin-top:6px">${rows}</div>
      <div class="actions" style="margin-top:10px">${btn("Restart match", "mp-restart", { cls: "small", title: "Start this match again on the same seed" })}${btn("New match…", "mp-setup", { cls: "small", title: "Back to the setup" })}</div>
    </section>`;
  }

  // ---- setup
  const MODE_TEXT = {
    bot: "Race a computer player on the same deal. You both play every round; when you finish a round, the bot's same round is revealed.",
    hotseat: "2 to 4 players on one device, all on the same deal, each with their own run. Turns go round by round, with a pass screen in between.",
    draft: "Pass and play with one shared shop: after each round the players visit the shop one at a time, and a modifier someone owns is gone for everyone else.",
  };

  function modeRulesHTML(kind) {
    const common = "<li>Everyone gets the <b>same seed and rules</b>: the same draw orders and shop queues. Every player's game is independent, so each move list is a valid output file for that seed.</li><li>Highest total score wins; on a tie, more rounds cleared; otherwise it's shared.</li>";
    if (kind === "bot") return `<ul class="mode-rules"><li>The bot plays its whole run on its own (it doesn't see your moves). <b>Easy</b> plays its best hand and rarely shops; <b>Normal</b> is the reference greedy bot (<span class="mono">baseline.py</span>); <b>Hard</b> also looks ahead when it discards.</li><li>Its rounds are revealed one at a time: when you finish round r, you see its round r.</li>${common}</ul>`;
    if (kind === "hotseat") return `<ul class="mode-rules"><li>Turns go <b>round by round</b>: player 1 plays round 1 and the shop after it, then player 2 plays round 1 and its shop, and so on; then round 2.</li><li>Between turns a <b>pass screen</b> hides the hand. You can undo moves of your own turn only.</li><li>A player who goes out is skipped; the others play on.</li>${common}</ul>`;
    return `<ul class="mode-rules"><li>Every round has two stages. <b>Play</b>: each player plays round r, in seat order. <b>Shop</b>: then the shop after round r is visited one player at a time, <b>lowest total first</b> (catch-up); ties go in seat order starting with a seat that moves on by one each round.</li>
      <li><b>One pool of modifiers.</b> A modifier another player owns can't be bought: it shows as "drafted by" them, in this round's shop and every later one, wherever it is in the queue.</li>
      <li>Each player's queue, window of 3 and reroll work as in solo: a drafted offer keeps its place in the window (it isn't replaced), and a reroll shows the next 3 of the queue.</li>
      <li><b>Selling returns a modifier</b> to the pool: from then on anyone may buy it where it is offered. A player who goes out keeps theirs.</li>
      <li>Levels, deck edits, +discards and +hand size are private. Bots take part: they buy greedily from what is left.</li>${common}</ul>`;
  }

  function setupHTML(kind) {
    const su = M.setups[kind];
    let seats;
    if (kind === "bot") {
      const lv = Object.keys(LEVEL_NAMES).map((l) => `<button class="tab" role="radio" aria-checked="${su.level === l}" data-act="mp-level" data-v="${l}" title="${esc(PokerBot.LEVELS[l])}">${LEVEL_NAMES[l]}</button>`).join("");
      seats = `<div class="seat" style="--pc:${COLORS[0]}"><span class="pdot"></span><input type="text" maxlength="24" data-mp-name="0" value="${esc(su.name)}" aria-label="Your name" placeholder="You"></div>
        <div class="seat" style="--pc:${COLORS[1]}"><span class="pdot"></span><span class="pname">Bot</span><span class="tabs" role="radiogroup" aria-label="Bot level">${lv}</span>
        <span class="muted" style="font-size:13px">${esc(PokerBot.LEVELS[su.level])}</span></div>`;
    } else {
      const count = [2, 3, 4].map((n) => `<button class="tab" role="radio" aria-checked="${su.n === n}" data-act="mp-n" data-v="${n}">${n}</button>`).join("");
      seats = `<div class="row"><label class="k">Players</label><span class="tabs" role="radiogroup" aria-label="Number of players">${count}</span></div>` +
        su.players.slice(0, su.n).map((p, i) => `<div class="seat" style="--pc:${COLORS[i]}"><span class="pdot"></span>
          <input type="text" maxlength="24" data-mp-name="${i}" value="${esc(p.name)}" aria-label="Player ${i + 1} name" placeholder="Player ${i + 1}">
          <select data-mp-type="${i}" aria-label="Player ${i + 1}: human or bot">
            <option value=""${!p.bot ? " selected" : ""}>Human</option>
            ${Object.keys(LEVEL_NAMES).map((l) => `<option value="${l}"${p.bot === l ? " selected" : ""}>Bot · ${LEVEL_NAMES[l]}</option>`).join("")}
          </select></div>`).join("");
    }
    const rulesLine = M.rules === "classic" ? "Classic (the contest's)" : `${UI.rulesTitle(M.rules)}: ${UI.rulesChanges(M.rules).length} changes from classic`;
    return `<section class="panel setup" aria-label="Set up a match">
      <h2>${esc(KINDS[kind])}</h2>
      <p class="lead">${esc(MODE_TEXT[kind])}</p>
      <div class="grid">
        <div class="row"><label class="k" for="mp-seed">Seed</label><input type="number" id="mp-seed" value="${su.seed}" step="1" inputmode="numeric">${btn("Random", "mp-seed-random")}</div>
        <div class="row"><span class="k" style="min-width:5.5em;color:var(--muted);font-size:13px;font-weight:600">Rules</span><span>${esc(rulesLine)} <span class="muted" style="font-size:13px">· switch with Rules above</span></span></div>
        ${seats}
        <div class="actions" style="margin-top:4px">${btn("Start match", "mp-start", { cls: "primary" })}</div>
        <div class="msg" id="mp-msg" role="status" aria-live="polite"></div>
      </div>
    </section>`;
  }

  function setupSideHTML(kind) {
    return `<section class="panel" aria-label="How it works"><h2>How ${esc(KINDS[kind])} works</h2>${modeRulesHTML(kind)}</section>${rulesBoxHTML(M.rules)}`;
  }

  // ---- results
  function renderResults(st) {
    const mt = st.match, rows = mt.standings(), win = mt.winners();
    let title;
    if (mt.mode === "race") title = win.length > 1 ? "A tie!" : win[0] === 0 ? `${mt.players[0].name === "You" ? "You win" : mt.players[0].name + " wins"}!` : "The bot wins";
    else title = win.length > 1 ? `Tie: ${win.map((s) => mt.players[s].name).join(" & ")}` : `${mt.players[win[0]].name} wins!`;
    const podium = rows.map((r, i) => {
      const pl = mt.players[r.seat], g = pl.game;
      const how = g.cleared === mt.inst.rounds ? `cleared all ${mt.inst.rounds} rounds` : `cleared ${g.cleared} of ${mt.inst.rounds}, out in round ${g.round + 1}`;
      return `<div class="pl${r.place === 1 ? " first" : ""}" style="--pc:${COLORS[r.seat]};--d:${i * 120}ms"><span class="place">${r.place}</span>
        <span style="min-width:0"><span class="pdot"></span> <span class="pname">${esc(pl.name)}</span>${pl.bot ? ` <span class="muted" style="font-size:12px">${esc(LEVEL_NAMES[pl.bot])} bot</span>` : ""}</span>
        <span class="pts" data-to="${g.total}">${UI.num(g.total)}</span><span class="sub">${esc(how)} · ${pl.moves.length} moves · $${g.money}</span></div>`;
    }).join("");
    const col = COLORS[win[0] || 0];
    $("play-main").innerHTML = `<section class="panel summary results" style="--pc:${win.length > 1 ? "var(--gold)" : col}" aria-label="Results">
        <div class="kicker">${esc(KINDS[st.kind])} · seed ${st.seed} · ${esc(UI.rulesTitle(mt.rules))} rules</div>
        <div class="winner">${esc(title)}</div>
        <div class="podium">${podium}</div>
        <div class="actions" style="justify-content:center;margin-top:14px">${btn("Rematch (same seed)", "mp-rematch", { cls: "primary" })}${btn("New seed", "mp-new-seed")}${btn("Change setup", "mp-setup")}</div>
      </section>${boardHTML(st, -1, true)}`;
    const outs = mt.players.map((pl) => {
      const [code, v] = PR.check(st.text, mt.output(pl.seat), mt.rules);
      const verdict = code === 0 ? `valid · ${UI.num(v.score)}` : "invalid";
      return `<details style="--pc:${COLORS[pl.seat]}"><summary><span class="pdot"></span> <span class="pname">${esc(pl.name)}</span> <span class="muted">· ${pl.moves.length} moves · ${esc(verdict)}</span></summary>
        <textarea readonly spellcheck="false" id="mp-out-${pl.seat}" aria-label="${esc(pl.name)}'s output file">${esc(mt.output(pl.seat))}</textarea>
        <div class="actions" style="margin-top:6px">${btn("Copy", "mp-copy", { v: pl.seat, cls: "small" })}${btn("Download", "mp-download", { v: pl.seat, cls: "small" })}</div>
        <div class="msg" id="mp-out-msg-${pl.seat}" role="status" aria-live="polite"></div></details>`;
    }).join("");
    $("play-side").innerHTML = `<section class="panel outputs" aria-label="Move lists"><h2>Move lists</h2>
      <p class="muted" style="margin:0;font-size:13px">Each is an output file for seed ${st.seed}${mt.rules !== "classic" ? `, scored with <span class="mono">--rules ${esc(mt.rules)}</span>` : ""}; check it with <span class="mono">python -m poker_run check</span> or the Replay tab.</p>${outs}</section>`;
    if (!st.celebrated) {
      st.celebrated = true;
      document.querySelectorAll(".podium .pts").forEach((el) => Feel.countUp(el, 0, Number(el.dataset.to), ""));
      const human = mt.players.some((p) => !p.bot && win.includes(p.seat));
      setTimeout(() => { if (human || mt.mode !== "race") Sound.clear(); else Sound.lose(); }, 250);
      const first = document.querySelector(".podium .pl.first");
      if (first) setTimeout(() => Feel.motes(30, first), 300);
    }
  }

  function mpOutputName(st, seat) {
    const slug = st.match.players[seat].name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `player${seat + 1}`;
    return `poker_run_seed${st.seed}${st.match.rules !== "classic" ? "_" + st.match.rules : ""}_${slug}_out.txt`;
  }

  // ---------- actions
  function readFile(input, cb) {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cb(String(r.result));
    r.onerror = () => cb(null);
    r.readAsText(f);
  }

  function dealSeed(seed) {
    if (!Number.isSafeInteger(seed)) { S.msg = { kind: "err", text: "The seed must be a whole number." }; render(); return; }
    startFromSource({ type: "seed", seed });
    S.msg = null;
    render();
  }

  const actions = {
    mode(el) {
      S.mode = el.dataset.v; Sound.tap(); render();
      if (S.mode === "replay" && S.rp && S.rp.rules !== S.rules) runReplay();   // checked with other rules
    },
    rules(el) {
      const v = el.dataset.v;
      if (S.mode === "play" && S.kind !== "solo") { mpRules(v); return; }
      if (v === S.rules || !Object.prototype.hasOwnProperty.call(PR.RULESETS, v)) return;
      if (S.moves.length && !S.game.over &&
          !window.confirm(`Switch to the ${UI.rulesTitle(v)} rules? Your current run (${S.moves.length} moves) starts again from the first move.`)) return;
      S.rules = v;
      Sound.shuffle();
      startFromSource(S.source, []);
      S.msg = { kind: "ok", text: `${UI.rulesTitle(v)} rules: ${v === "classic" ? "the contest's rules" : UI.rulesChanges(v).length + " changes from classic (see the side panel)"}. The run starts again.` };
      if (S.mode === "replay" && S.rp) runReplay();   // re-check the loaded replay with the new rules
      render();
    },
    deal() { Sound.shuffle(); dealSeed(Number($("seed").value)); },
    "random-seed"() { const s = Math.floor(Math.random() * 1000000) + 1; S.mode = "play"; dealSeed(s); },
    "toggle-load"() {
      const p = $("load-panel"); p.classList.toggle("hidden");
      document.querySelectorAll('[data-act="toggle-load"]').forEach((b) => b.setAttribute("aria-expanded", String(!p.classList.contains("hidden"))));
      if (!p.classList.contains("hidden")) $("load-text").focus();
    },
    "load-input"() {
      const text = $("load-text").value;
      try { startFromSource({ type: "text", text }); } catch (e) {
        if (e instanceof PR.BadInput) { flash("load-msg", "err", "Bad input: " + e.message); return; }
        throw e;
      }
      flash("load-msg", "ok", "Loaded. Good luck.");
      S.msg = null;
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
      render();
    },
    card(el) {
      const id = Number(el.dataset.id);
      const i = S.sel.indexOf(id);
      if (i >= 0) { S.sel.splice(i, 1); Sound.deselect(S.game.rank[id]); }
      else if (S.sel.length < 5) { S.sel.push(id); Sound.select(S.game.rank[id]); }
      else { S.msg = { kind: "err", text: "At most 5 cards: deselect one first." }; Sound.oops(); renderKeepFocus(); return; }
      S.msg = null;
      renderKeepFocus();
    },
    "clear-sel"() { S.sel = []; Sound.tap(); render(); },
    sound() { Sound.toggle(); soundIcon(); },
    play() { doMove("play " + S.sel.join(" ")); },
    discard() { doMove("discard " + S.sel.join(" ")); },
    end() { doMove("end"); },
    buy(el) { doMove("buy " + el.dataset.v); },
    sell(el) { doMove("sell " + el.dataset.v); },
    level(el) { doMove("level " + el.dataset.v); },
    reroll() { doMove("reroll"); },
    discards() { doMove("discards"); },
    handsize() { doMove("handsize"); },
    next() { doMove("next"); },
    "deck-pick"(el) {
      const v = el.dataset.id !== undefined ? Number(el.dataset.id) : null;
      S.deckPick = v === null || v === S.deckPick ? null : v;
      renderKeepFocus();
    },
    remove() { if (S.deckPick !== null) doMove("remove " + S.deckPick); },
    paint(el) { if (S.deckPick !== null) doMove(`paint ${S.deckPick} ${PR.SUITS[Number(el.dataset.v)]}`); },
    promote() { if (S.deckPick !== null) doMove("promote " + S.deckPick); },
    undo() { undo(); },
    copy() {
      const text = outputText();
      const done = () => flash("export-msg", "ok", "Copied to the clipboard.");
      const fallback = () => {
        const ta = $("export-text"); ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) done(); else flash("export-msg", "err", "Couldn't copy automatically: the text is selected, press Ctrl/Cmd+C.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    },
    download() {
      const blob = new Blob([outputText()], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const tag = S.rules !== "classic" ? "_" + S.rules : "";
      a.download = S.source.type === "seed" ? `poker_run_seed${S.source.seed}${tag}_out.txt` : `poker_run${tag}_out.txt`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      flash("export-msg", "ok", `Saved ${a.download}.`);
    },
    "rp-seed"() {
      const s = Number($("rp-seed").value);
      if (!Number.isSafeInteger(s)) { $("rp-verdict").innerHTML = '<div class="err">The seed must be a whole number.</div>'; return; }
      $("rp-input").value = PR.formatInstance(PR.generate(s));
    },
    "rp-run"() { runReplay(); },
    "rp-from-play"() {
      $("rp-input").value = S.inputText;
      $("rp-output").value = outputText();
      S.mode = "replay";
      render();
      runReplay();
      S.rpStep = S.rp && S.rp.states ? S.rp.states.length - 1 : 0;
      renderReplay();
    },
    "rp-step"(el) {
      if (!S.rp || !S.rp.states) return;
      const n = S.rp.states.length - 1, v = el.dataset.v;
      S.rpStep = v === "first" ? 0 : v === "last" ? n : Math.max(0, Math.min(n, S.rpStep + Number(v)));
      Sound.tap();
      renderReplay();
    },
    kind(el) { setKind(el.dataset.v); },
    "mp-level"(el) {
      if (!LEVEL_NAMES[el.dataset.v]) return;
      M.setups.bot.level = el.dataset.v; saveMP(); Sound.tap(); renderKeepFocus();
    },
    "mp-n"(el) {
      const su = M.setups[S.kind];
      if (!su || !su.players) return;
      su.n = Number(el.dataset.v); saveMP(); Sound.tap(); renderKeepFocus();
    },
    "mp-seed-random"() { $("mp-seed").value = String(randomSeed()); Sound.shuffle(); },
    "mp-start"() {
      const seed = Number($("mp-seed").value);
      if (!Number.isSafeInteger(seed)) { flash("mp-msg", "err", "The seed must be a whole number."); Sound.oops(); return; }
      mpStart(S.kind, seed); Sound.shuffle(); render(); scrollTop();
    },
    "mp-reveal"() {
      const st = mpCur();
      if (!st || !st.match.turn) return;
      st.viewer = st.match.turn.seat; st.screen = "turn"; saveMP();
      Sound.next(); render(); scrollTop();
    },
    "mp-rematch"() { const st = mpCur(); if (st) { mpStart(S.kind, st.seed); Sound.shuffle(); render(); scrollTop(); } },
    "mp-new-seed"() { mpStart(S.kind, randomSeed()); Sound.shuffle(); render(); scrollTop(); },
    "mp-restart"() {
      const st = mpCur();
      if (!st || !window.confirm("Restart this match from round 1 on the same seed?")) return;
      mpStart(S.kind, st.seed); Sound.shuffle(); render(); scrollTop();
    },
    "mp-setup"() {
      const st = mpCur();
      if (st && !st.match.over && !window.confirm("Leave this match for the setup? It can't be resumed.")) return;
      M.games[S.kind] = null; saveMP(); Sound.tap(); render(); scrollTop();
    },
    "mp-copy"(el) {
      const seat = Number(el.dataset.v), ta = $("mp-out-" + seat);
      if (!ta) return;
      const done = () => flash("mp-out-msg-" + seat, "ok", "Copied to the clipboard.");
      const fallback = () => {
        ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) done(); else flash("mp-out-msg-" + seat, "err", "Couldn't copy automatically: the text is selected, press Ctrl/Cmd+C.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
      else fallback();
    },
    "mp-download"(el) {
      const st = mpCur(), seat = Number(el.dataset.v);
      if (!st || !st.match.players[seat]) return;
      const blob = new Blob([st.match.output(seat)], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = mpOutputName(st, seat);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      flash("mp-out-msg-" + seat, "ok", `Saved ${a.download}.`);
    },
    "rp-continue"() {
      if (!S.rp || !S.rp.states) return;
      const text = $("rp-input").value;
      if (S.kind !== "solo") setKind("solo", true);
      try { startFromSource({ type: "text", text }, S.rp.moves.slice(0, S.rpStep)); } catch (e) {
        if (e instanceof PR.BadInput) return;
        throw e;
      }
      S.mode = "play";
      S.msg = { kind: "ok", text: `Loaded ${S.moves.length} moves from the replay.` };
      render();
    },
  };

  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest("[data-act], .tab");
    if (el && !el.disabled) Feel.ripple(ev);
  });
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
    const li = ev.target.closest("#rp-log li[data-step]");
    if (li) { S.rpStep = Number(li.dataset.step); renderReplay(); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "sort-hand") { S.sort = ev.target.value; save(); render(); }
    const type = ev.target.dataset && ev.target.dataset.mpType;
    if (type !== undefined && M.setups[S.kind] && M.setups[S.kind].players) {
      const v = ev.target.value;
      M.setups[S.kind].players[Number(type)].bot = LEVEL_NAMES[v] ? v : null;
      saveMP(); Sound.tap();
    }
  });
  document.addEventListener("input", (ev) => {
    const i = ev.target.dataset && ev.target.dataset.mpName;
    if (i === undefined || !M.setups[S.kind]) return;
    const su = M.setups[S.kind], name = ev.target.value.slice(0, 24);
    if (S.kind === "bot") su.name = name; else su.players[Number(i)].name = name;
    saveMP();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.id === "mp-seed") actions["mp-start"]();
  });
  $("seed").addEventListener("keydown", (ev) => { if (ev.key === "Enter") actions.deal(); });
  $("rp-slider").addEventListener("input", (ev) => { S.rpStep = Number(ev.target.value); renderReplay(); });
  $("load-file").addEventListener("change", (ev) => readFile(ev.target, (t) => {
    if (t === null) flash("load-msg", "err", "Couldn't read that file.");
    else { $("load-text").value = t; flash("load-msg", "ok", "File read. Press “Start with this input”."); }
  }));
  $("rp-input-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-input").value = t; }));
  $("rp-output-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-output").value = t; }));

  // ---------- boot
  // #seed= and #rules= set up the solo game; #mode=solo|bot|hotseat|draft picks the mode.
  // A multiplayer #mode= link leaves the solo game alone: its seed and rules preset that mode's setup.
  const hash = UI.parseHash(location.hash);
  const hashKind = hash.mode !== null && Object.prototype.hasOwnProperty.call(KINDS, hash.mode) ? hash.mode : null;
  const mpLink = hashKind !== null && hashKind !== "solo";
  const hashSeed = !mpLink && hash.seed !== null && Number.isSafeInteger(hash.seed) ? hash.seed : null;
  const hashRules = mpLink ? null : hash.rules;
  const saved = restore();
  if (saved && saved.sort) S.sort = saved.sort;
  const known = (r) => typeof r === "string" && Object.prototype.hasOwnProperty.call(PR.RULESETS, r);
  const savedRules = saved && known(saved.rules) ? saved.rules : "classic";
  S.rules = known(hashRules) ? hashRules : hashSeed !== null ? "classic" : savedRules;
  // Saved moves only make sense with the rules they were played by.
  if (saved && savedRules !== S.rules) saved.moves = [];
  try {
    if (hashSeed !== null) {
      const seed = hashSeed;
      const same = saved && saved.source && saved.source.type === "seed" && saved.source.seed === seed;
      startFromSource({ type: "seed", seed }, same ? saved.moves : []);
    } else if (saved && saved.source) startFromSource(saved.source, saved.moves || []);
    else startFromSource({ type: "seed", seed: 1 });
  } catch (e) {
    startFromSource({ type: "seed", seed: 1 });
  }
  $("rp-seed").value = $("seed").value;
  for (const k of Object.keys(M.setups)) M.setups[k].seed = S.source.type === "seed" ? S.source.seed : 1;
  restoreMP();
  let kind = "solo";
  try { kind = localStorage.getItem(KIND_KEY) || "solo"; } catch (e) { /* storage unavailable */ }
  if (hashSeed !== null || !Object.prototype.hasOwnProperty.call(KINDS, kind)) kind = "solo";   // a #seed= link opens solo
  if (hashKind) kind = hashKind;
  if (mpLink) {
    // Open the mode's setup (a match still being played is resumed, a finished one makes way).
    if (known(hash.rules)) M.rules = hash.rules;
    if (hash.seed !== null && Number.isSafeInteger(hash.seed)) M.setups[hashKind].seed = hash.seed;
    if (M.games[hashKind] && M.games[hashKind].match.over) M.games[hashKind] = null;
    saveMP();
  }
  setKind(kind, true);
  if (hashKind) { try { localStorage.setItem(KIND_KEY, kind); } catch (e) { /* storage unavailable */ } }   // remembered like a click on Mode
  soundIcon();
  render();

  // A small handle for automated browser tests: make a move as if clicked, read the state.
  window.PokerRunApp = {
    move: (line) => doMove(line),
    game: () => S.game,
    kind: () => S.kind,
    match: () => { const st = mpCur(); return st ? st.match : null; },
    screen: () => { const st = mpCur(); return S.kind === "solo" ? "solo" : st ? st.screen : "setup"; },
    viewer: () => { const st = mpCur(); return st ? st.viewer : -1; },
  };
}

if (typeof document !== "undefined") startApp(PokerRun);
if (typeof module === "object" && module.exports) module.exports = UI;
</script>
</body>
</html>
