<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Poker Run</title>
<style>
:root {
  color-scheme: dark;
  --felt-in: #185440;
  --felt-mid: #0f3a2c;
  --felt-out: #082018;
  --cream: #f4efe3;
  --muted: #a0beb0;
  --gold: #f2c14e;
  --gold-soft: rgba(242, 193, 78, 0.18);
  --red: #e2584c;
  --card: #faf7f0;
  --card-edge: #e3dccb;
  --suit-red: #c82830;
  --suit-black: #1c1c1e;
  --panel: rgba(0, 0, 0, 0.32);
  --panel-2: rgba(0, 0, 0, 0.22);
  --line: rgba(244, 239, 227, 0.12);
  --ok: #7fd1a4;
  --cw: 76px;
  --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: Menlo, ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html { background: var(--felt-out); }
body {
  margin: 0; min-height: 100vh; color: var(--cream); font-family: var(--sans); font-size: 15px; line-height: 1.4;
  background: radial-gradient(ellipse at 50% 35%, var(--felt-in) 0%, var(--felt-mid) 55%, var(--felt-out) 100%) fixed;
  background-color: var(--felt-out);
  overflow-x: hidden;
}
a { color: var(--gold); }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 14px 16px 40px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 14px; }
header.top h1 { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; }
header.top h1 span { color: var(--gold); }
.tabs { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 10px; }
.tab { background: transparent; border: 0; color: var(--muted); padding: 6px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"], .tab[aria-checked="true"] { background: var(--gold); color: #1b1a14; }
.rules-pick { align-items: center; }
.rules-pick .lbl { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px 0 8px; }
.rules-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(127, 209, 164, 0.16); color: var(--ok); margin-right: 6px; }
table.hands td.changed { color: var(--ok); }
.rules-notes { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.rules-notes li { margin: 3px 0; }
.rules-notes b { color: var(--cream); font-weight: 600; }
details.rules-box summary { cursor: pointer; font-weight: 700; }
details.rules-box[open] summary { margin-bottom: 8px; }
.source { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.source label { color: var(--muted); font-size: 13px; }
input[type="number"], input[type="text"], textarea, select {
  background: rgba(0, 0, 0, 0.35); color: var(--cream); border: 1px solid var(--line); border-radius: 8px;
  font: 14px var(--mono); padding: 6px 8px;
}
input[type="number"] { width: 100px; }
textarea { width: 100%; min-height: 110px; resize: vertical; }
select { font-family: var(--sans); }
.btn {
  background: rgba(244, 239, 227, 0.08); color: var(--cream); border: 1px solid rgba(244, 239, 227, 0.22);
  border-radius: 8px; padding: 7px 12px; font: 600 14px var(--sans); cursor: pointer; white-space: nowrap;
  transition: background 0.12s, transform 0.12s;
}
.btn:hover:not(:disabled) { background: rgba(244, 239, 227, 0.16); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1b1a14; }
.btn.primary:hover:not(:disabled) { background: #f6cf6f; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn .price { opacity: 0.8; font-weight: 500; margin-left: 4px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.gold { color: var(--gold); }
.err { color: #ffb4a8; background: rgba(226, 88, 76, 0.16); border: 1px solid rgba(226, 88, 76, 0.5); border-radius: 8px; padding: 8px 10px; }
.okmsg { color: var(--ok); background: rgba(127, 209, 164, 0.1); border: 1px solid rgba(127, 209, 164, 0.4); border-radius: 8px; padding: 8px 10px; }
.msg { margin: 8px 0 0; font-size: 14px; }
.msg:empty { display: none; }
.hidden { display: none !important; }

/* ---------- layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.col { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- status */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat.money .v { color: var(--gold); }
.progress { margin-top: 10px; height: 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.4); overflow: hidden; position: relative; }
.progress .bar { height: 100%; background: linear-gradient(90deg, #c99a2e, var(--gold)); width: 0; transition: width 0.25s; }
.progress .ghost { position: absolute; top: 0; height: 100%; background: rgba(242, 193, 78, 0.35); }
.progress.done .bar { background: linear-gradient(90deg, #4fa77a, var(--ok)); }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.phase-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--gold-soft); color: var(--gold); }

/* ---------- cards */
.card {
  --w: var(--cw);
  width: var(--w); height: calc(var(--w) * 1.4); flex: none; position: relative;
  background: var(--card); border-radius: calc(var(--w) * 0.1); border: 1px solid var(--card-edge);
  color: var(--suit-black); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45); font-family: var(--sans);
  user-select: none; padding: 0; text-align: left; transition: transform 0.14s, box-shadow 0.14s;
}
.card.red { color: var(--suit-red); }
button.card { cursor: pointer; }
button.card:hover { transform: translateY(-3px); }
.card .tl { position: absolute; top: calc(var(--w) * 0.05); left: calc(var(--w) * 0.08); line-height: 0.95; text-align: center; font-weight: 800; font-size: calc(var(--w) * 0.25); }
.card .tl i { display: block; font-style: normal; font-size: calc(var(--w) * 0.2); font-weight: 400; }
.card .br { position: absolute; bottom: calc(var(--w) * 0.05); right: calc(var(--w) * 0.08); line-height: 0.95; text-align: center; font-weight: 800; font-size: calc(var(--w) * 0.25); transform: rotate(180deg); }
.card .br i { display: block; font-style: normal; font-size: calc(var(--w) * 0.2); font-weight: 400; }
.card .mid { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--w) * 0.56); line-height: 1; padding-top: calc(var(--w) * 0.06); }
.card .cid { position: absolute; top: calc(var(--w) * 0.06); right: calc(var(--w) * 0.08); font: 600 calc(var(--w) * 0.14) / 1 var(--mono); color: #8f897a; }
.card .dot { position: absolute; bottom: calc(var(--w) * 0.07); left: calc(var(--w) * 0.08); width: calc(var(--w) * 0.1); height: calc(var(--w) * 0.1); border-radius: 50%; background: var(--gold); border: 1px solid #b38a25; }
.card .tag { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font: 700 10px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 6px; border-radius: 999px; white-space: nowrap; }
.card.sel { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--gold), 0 10px 18px rgba(0, 0, 0, 0.5); }
button.card.sel:hover { transform: translateY(-14px); }
.card.sel.scored .tag { background: var(--gold); color: #1b1a14; }
.card.sel.kicker .tag { background: #3c4a44; color: var(--cream); }
.card.sel.kicker { box-shadow: 0 0 0 3px rgba(160, 190, 176, 0.8), 0 10px 18px rgba(0, 0, 0, 0.5); }
.card.hl { box-shadow: 0 0 0 3px var(--red), 0 0 16px rgba(226, 88, 76, 0.7); }
.card.hl.scored { box-shadow: 0 0 0 3px var(--gold), 0 0 16px rgba(242, 193, 78, 0.7); }
.card.gone { opacity: 0.22; }
.card.next-draw { box-shadow: 0 0 0 2px var(--gold); }
.card.mini { --w: 40px; border-radius: 5px; }
.card.mini .br, .card.mini .mid { display: none; }
.card.mini .tl { font-size: 15px; left: 4px; top: 3px; }
.card.mini .tl i { font-size: 14px; }
.card.mini .cid { top: auto; bottom: 3px; right: 4px; font-size: 9px; }
.card.mini .dot { left: auto; right: 4px; top: 4px; bottom: auto; width: 5px; height: 5px; }
.card.deckc { --w: 50px; }
.card.deckc .br { display: none; }
.card.deckc .mid { font-size: 22px; padding-top: 14px; }
.card.deckc .cid { font-size: 9px; }
.card.deckc.pick { box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0, 0, 0, 0.5); transform: translateY(-3px); }

.hand { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 2px 14px; min-height: calc(var(--cw) * 1.4 + 30px); }
.strip { display: flex; gap: 5px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-color: rgba(244, 239, 227, 0.25) transparent; }
.strip .pos { font: 10px var(--mono); color: var(--muted); text-align: center; margin-top: 2px; }
.strip .slot { flex: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }

/* ---------- preview */
.preview { margin-top: 12px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; min-height: 64px; }
.preview .hand-name { font-size: 20px; font-weight: 800; }
.preview .formula { font: 14px var(--mono); margin-top: 4px; color: var(--cream); overflow-wrap: anywhere; }
.preview .formula b { color: var(--gold); }
.preview .parts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: rgba(244, 239, 227, 0.08); border: 1px solid var(--line); }
.chip.on { border-color: rgba(242, 193, 78, 0.6); color: var(--gold); }

/* ---------- modifiers / shop */
.mods { display: grid; gap: 8px; }
.mod { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; }
.mod .name { font-weight: 700; }
.mod .fx { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.mod .state { grid-column: 1 / -1; font-size: 13px; color: var(--gold); }
.slots-left { font-size: 13px; color: var(--muted); }
.offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.offer { background: linear-gradient(160deg, rgba(122, 31, 43, 0.55), rgba(60, 14, 22, 0.55)); border: 1px solid rgba(242, 193, 78, 0.35); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 130px; }
.offer.sold { opacity: 0.4; background: var(--panel-2); border-style: dashed; }
.offer .name { font-weight: 800; font-size: 16px; }
.offer .fx { font-size: 13px; color: #e8dccb; flex: 1; }
.offer .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.offer .cost { color: var(--gold); font-weight: 800; font-size: 18px; }
.queue-later { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 13px; }
table.hands { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.hands th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
table.hands td { padding: 4px 6px; border-bottom: 1px solid rgba(244, 239, 227, 0.06); }
table.hands td.num, table.hands th.num { text-align: right; }
table.hands tr.lit td { background: var(--gold-soft); }
.scroll-x { overflow-x: auto; }
.deckgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.deck-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; min-height: 34px; }
.shop-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .shop-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- log / export */
.log { max-height: 300px; overflow: auto; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.log li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 3px 4px; border-bottom: 1px solid rgba(244, 239, 227, 0.05); }
.log li .n { color: var(--muted); font-family: var(--mono); text-align: right; }
.log li .m { font-family: var(--mono); overflow-wrap: anywhere; }
.log li .d { color: var(--muted); }
.log li.cur { background: var(--gold-soft); border-radius: 6px; }
.log li.bad { background: rgba(226, 88, 76, 0.2); border-radius: 6px; }
.log li[data-step] { cursor: pointer; }
.export textarea { min-height: 120px; font-size: 12px; }

/* ---------- summary */
.summary { text-align: center; padding: 22px 14px; }
.summary .big { font-size: 44px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.summary .sub { color: var(--muted); font-size: 16px; }

/* ---------- replay */
.replay-io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .replay-io { grid-template-columns: minmax(0, 1fr); } }
.stepper { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stepper input[type="range"] { flex: 1; min-width: 160px; accent-color: var(--gold); }
.verdict { font-size: 15px; }
.lastmove { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.lastmove .cards { display: flex; flex-wrap: wrap; gap: 6px; }
.lastmove .card.sel { transform: none; } /* a record of the move, not a selection: don't lift into the text above */
details summary { cursor: pointer; color: var(--muted); }
.kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }

/* ---------- feel: soft presses, springy releases, gentle motion */
:root { --spring: cubic-bezier(0.34, 1.4, 0.64, 1); --glide: cubic-bezier(0.22, 1, 0.36, 1); }
.btn, .tab {
  transition: background 0.22s ease, border-color 0.22s ease, color 0.22s ease, box-shadow 0.25s ease,
    transform 0.3s var(--spring);
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0, 0, 0, 0.28); }
.btn:active:not(:disabled), .tab:active { transform: scale(0.96); transition-duration: 0.09s; box-shadow: none; }
.card { transition: transform 0.32s var(--spring), box-shadow 0.3s ease, opacity 0.3s ease; }
button.card:active { transform: translateY(-5px) scale(0.97); transition-duration: 0.09s; }
button.card.sel:active { transform: translateY(-10px) scale(0.97); }
.card.dealt { animation: deal 0.55s var(--glide) backwards; animation-delay: var(--d, 0ms); }
@keyframes deal { from { transform: translateY(28px) scale(0.92) rotate(-3deg); opacity: 0.2; } }
.progress .bar { transition: width 0.8s var(--glide); }
.progress.done .bar { box-shadow: 0 0 14px rgba(242, 193, 78, 0.55); }
.msg-in { animation: msg 0.35s var(--glide) backwards; }
@keyframes msg { from { transform: translateY(-4px); opacity: 0; } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
#fx .ripple {
  position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
  background: radial-gradient(circle, rgba(242, 193, 78, 0.42), rgba(242, 193, 78, 0) 70%);
  animation: ripple 0.6s var(--glide) forwards;
}
@keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(5); opacity: 0; } }
#fx .float {
  position: absolute; transform: translate(-50%, -50%); font: 800 28px var(--sans); color: var(--gold);
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); white-space: nowrap; animation: float 1.5s var(--glide) forwards;
}
#fx .float small { display: block; font-size: 14px; font-weight: 600; color: var(--cream); text-align: center; }
@keyframes float { from { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } to { opacity: 0; margin-top: -70px; } }
#fx .mote {
  position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 10px rgba(242, 193, 78, 0.8); animation: mote var(--t, 1.6s) var(--glide) forwards;
}
@keyframes mote { from { opacity: 0.95; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); } }
/* ---------- scroll: panels settle in as they arrive, a progress line, a compact score bar */
@supports (animation-timeline: view()) {
  #view-play .panel, #view-replay .panel {
    animation: settle linear both;
    animation-timeline: view();
    animation-range: entry 0% entry 40%;
  }
  @keyframes settle { from { transform: translateY(34px) scale(0.985); opacity: 0.35; } }
}
#scroll-line {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none;
  background: linear-gradient(90deg, #c99a2e, var(--gold)); transform-origin: 0 50%; transform: scaleX(0);
  box-shadow: 0 0 8px rgba(242, 193, 78, 0.6);
}
#mini {
  position: fixed; top: 10px; left: 50%; z-index: 55; display: flex; align-items: center; gap: 14px;
  padding: 8px 16px; border-radius: 999px; cursor: pointer; font: 600 14px var(--sans); color: var(--cream);
  background: rgba(10, 34, 26, 0.78); border: 1px solid rgba(242, 193, 78, 0.35);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  transform: translate(-50%, -140%); opacity: 0; transition: transform 0.45s var(--glide), opacity 0.35s ease;
  white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden;
}
#mini.show { transform: translate(-50%, 0); opacity: 1; }
#mini .k { color: var(--muted); font-weight: 500; margin-right: 4px; }
#mini .gold { color: var(--gold); }
#mini .meter { width: 90px; height: 6px; border-radius: 3px; background: rgba(244, 239, 227, 0.12); overflow: hidden; }
#mini .meter i { display: block; height: 100%; background: linear-gradient(90deg, #c99a2e, var(--gold)); transition: width 0.6s var(--glide); }
@media (max-width: 600px) { #mini .opt { display: none; } }
.card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 30%), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 55%);
  transition: opacity 0.3s ease; mix-blend-mode: soft-light;
}
button.card:hover::after { opacity: 1; }
.btn.icon { padding: 7px 9px; line-height: 0; }
.btn.icon svg { width: 18px; height: 18px; }
.btn.icon[aria-pressed="false"] { color: var(--muted); }

@media (max-width: 600px) {
  :root { --cw: 54px; }
  .wrap { padding: 10px 10px 30px; }
  header.top h1 { font-size: 22px; }
  .source { margin-left: 0; }
  .hand { gap: 6px; }
  .stat .v { font-size: 17px; }
  .card .tag { font-size: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  .card.sel, button.card:hover, button.card.sel:hover, .card.deckc.pick { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>POKER <span>RUN</span></h1>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button class="tab" role="tab" id="tab-play" aria-selected="true" aria-controls="view-play" data-act="mode" data-v="play">Play</button>
      <button class="tab" role="tab" id="tab-replay" aria-selected="false" aria-controls="view-replay" data-act="mode" data-v="replay">Replay</button>
    </div>
    <div class="tabs rules-pick" role="radiogroup" aria-label="Rules" id="rules-pick">
      <span class="lbl" aria-hidden="true">Rules</span>
      <button class="tab" role="radio" aria-checked="true" data-act="rules" data-v="classic" title="Classic rules: the contest's">Classic</button>
      <button class="tab" role="radio" aria-checked="false" data-act="rules" data-v="balanced" title="Balanced rules: an optional variant with rebalanced hands, modifiers and prices">Balanced</button>
    </div>
    <div class="source" id="source-bar">
      <label for="seed">Seed</label>
      <input type="number" id="seed" value="1" step="1" inputmode="numeric">

      </section>
      <div class="layout hidden" id="rp-board">
