  function onlineTopHTML(v) {
    const me = onMe(v);
    const t = v.mode === "race" ? me : v.turn ? onPlayer(v, v.turn.seat) : me;
    const yours = t && t.seat === me.seat;
    const bar = `<section class="panel turnbar" style="--pc:${COLORS[t.seat]}" aria-label="Whose turn" aria-live="polite">
      <span class="who"><span class="pdot"></span><span class="pname">${yours && v.mode !== "race" ? "Your turn" : esc(t.name)}</span></span><span class="what">${esc(turnText(v, t))}</span>
      <span class="tags"><span class="mp-chip">Online · ${esc(ONLINE_MODES[v.mode])}</span><span class="mp-chip">room <b class="mono">${esc(v.code)}</b></span></span></section>`;
    return bannerHTML() + bar + (v.mode === "race" ? onlineRaceHTML(v) : "");
  }

  function waitingHTML(v) {
    const me = onMe(v), t = v.turn ? onPlayer(v, v.turn.seat) : null;
    if (!t || t.seat === me.seat) {
      return `<section class="panel handoff" aria-label="Waiting"><div class="fan" aria-hidden="true">${[0, 1, 2].map((i) => `<span class="card back" style="rotate:${(i - 1) * 7}deg;--d:${i * 0.18}s"></span>`).join("")}</div><p class="task">Sending your move…</p></section>`;
    }
    const backs = [0, 1, 2, 3, 4].map((i) => `<span class="card back" style="rotate:${(i - 2) * 7}deg;--d:${i * 0.18}s"></span>`).join("");
    const away = !t.bot && !t.online ? ` <span class="presence">away</span>` : "";
    return `<section class="panel handoff" style="--pc:${COLORS[t.seat]}" aria-label="Waiting for ${esc(t.name)}">
      <div class="kicker">Online · ${esc(ONLINE_MODES[v.mode])} · room ${esc(v.code)}</div>
      <div class="fan" aria-hidden="true">${backs}</div>
      <div class="to">Waiting for</div>
      <div class="big-name">${esc(t.name)}${away}</div>
      <p class="task">${esc(t.name)} ${esc(turnText(v, t).replace(/^round/, "plays round").replace(/^shop/, "shops"))}.</p>
      ${t.removable ? `<p class="muted" style="font-size:13px">${esc(t.name)} has been away for a while. ${btn(`Remove ${esc(t.name)}`, "on-remove", { v: t.seat, cls: "small" })}</p>` : `<p class="muted" style="margin:-8px 0 0;font-size:13px">You'll hear a soft chime when it's your turn. Your hand is below.</p>`}
    </section>`;
  }

  function myDoneHTML(v, g) {
    const o = UI.outcome(g), me = onMe(v);
    const left = me.status !== "in";
    return `<section class="panel summary" aria-label="Your run">
      <div class="muted" style="text-transform:uppercase;letter-spacing:.14em;font-size:13px">${left ? "You left this game" : o.won ? "Run complete" : "Run over"}</div>
      <div class="big">${UI.num(g.total)}</div>
      <div class="sub">points · cleared ${g.cleared} of ${g.inst.rounds} rounds</div>
      <p class="muted">Waiting for the others to finish; the results show up here.</p></section>`;
  }

  function onlineResultsHTML(v) {
    const R = onInst(v.seed).rounds;
    const rows = v.players.slice().sort((a, b) => a.place - b.place || a.seat - b.seat);
    const win = rows.filter((p) => p.place === 1);
    const me = onMe(v);
    const title = win.length > 1 ? `Tie: ${win.map((p) => p.name).join(" & ")}` : win[0].you ? "You win!" : `${win[0].name} wins!`;
    const prow = rows.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : p.you ? "you" : "", total: p.total, cleared: p.cleared,
      moves: (p.moves || []).length, place: p.place, note: p.status === "left" ? "left early" : p.status === "removed" ? "removed (away)" : "" }));
    const rematchOther = v.rematch ? btn(`Join the rematch (${v.rematch})`, "on-open", { v: v.rematch, cls: "primary" }) : btn("Rematch", "on-rematch", { cls: "primary", title: "A new room with the same settings and bots; the others get a button to join it" });
    const board = boardTableHTML(v.players.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : "", rounds: p.rounds, total: p.total, place: p.place, over: true })), R, me ? me.seat : -1);
    return `<section class="panel summary results" style="--pc:${win.length > 1 ? "var(--gold)" : COLORS[win[0].seat]}" aria-label="Results">
        <div class="kicker">Online · ${settingsLine(v)}${v.ended === "expired" ? " · ended after a long pause" : ""}</div>
        <div class="winner">${esc(title)}</div>
        <div class="podium">${podiumHTML(prow, R)}</div>
        <div class="actions" style="justify-content:center;margin-top:14px">${rematchOther}${btn("Rematch on the same seed", "on-rematch", { v: "same", title: "A new room, same seed" , err: v.rematch ? "A rematch room exists already" : "" })}${btn("Back to online play", "on-home")}</div>
        ${onMsgHTML()}
      </section>${board}`;
  }

  // Renders the online screens and returns true, or points S at your game and returns false.
  function onlineRender() {
    let main = null, side = "";
    const v = ON.view;
    if (!ON.api) main = noServerHTML();
    else if (ON.me === undefined) main = `<section class="panel"><p class="muted">Checking your account…</p></section>`;
    else if (ON.me === null) { main = signedOutHTML(); side = onlineSideHowHTML(); }
    else if (ON.error) main = errorHTML();
    else if (!ON.code && ON.detail) {
      const d = ON.detail;
      main = matchDetailHTML(d);
      side = outputsHTML(PR.formatInstance(onInst(d.seed)), d.rules, d.seed, d.players.map((p) => ({ seat: p.seat, name: p.name, moves: p.moves })), d.id);
    } else if (!ON.code) { main = homeHTML(); side = onlineSideHowHTML() + rulesBoxHTML(ON.form.rules); }
    else if (!v) main = `${bannerHTML()}<section class="panel"><p class="muted">Opening room ${esc(ON.code)}…</p></section>`;
    else if (v.status === "lobby") { main = lobbyHTML(v); side = onlineSideHowHTML(v.mode) + rulesBoxHTML(v.rules); }
    else if (v.status === "finished") {
      main = onlineResultsHTML(v);
      side = outputsHTML(PR.formatInstance(onInst(v.seed)), v.rules, v.seed, v.players.map((p) => ({ seat: p.seat, name: p.name, moves: p.moves || [] })), v.match_id);
    } else {
      const me = onMe(v);
      if (!me) main = `<section class="panel setup"><h2>Room ${esc(v.code)}</h2><p class="lead">This game started without you. Ask the host for a rematch, or make your own room.</p><div class="actions">${btn("Back to online play", "on-home", { cls: "primary" })}</div></section>`;
      else {
        if (!ON.game || ON.seed !== v.seed) syncGame(v, me);
        showGame(`online:${v.code}`, v.seed, PR.formatInstance(onInst(v.seed)), onInst(v.seed), ON.game, ON.moves, movesLabels(ON.labels, "me", onInst(v.seed), v.rules, ON.moves));
        return false;
      }
    }
    useSolo();
    $("play-main").innerHTML = main;
    $("play-side").innerHTML = side;
    if (v && v.status === "finished" && ON.celebrated !== v.code) {
      ON.celebrated = v.code;
      const me = onMe(v);
      celebrate(!!(me && me.place === 1));
    }
    Scroll.request();
    return true;
  }

  // The play view of your own online game.
  function onlinePlayHTML(g) {
    const v = ON.view, me = onMe(v);
    let main = onlineTopHTML(v);
    const mine = canIMove(v, g);
    if (g.over || me.status !== "in") {
      main += myDoneHTML(v, g);
      main += boardTableHTML(v.players.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : "", rounds: p.rounds, total: p.total, over: p.over })), g.inst.rounds, me.seat);
      return main;
    }
    if (!mine && v.mode !== "race") main += waitingHTML(v);
    main += statusHTML(g);
    if (g.phase === "play") {
      main += mine ? playPanelHTML(g, true) : `<section class="panel" aria-label="Your hand"><h2>Your hand</h2><div class="hand">${handHTML(g, { interactive: false, sort: S.sort })}</div></section>`;
      main += pileHTML(g, g.pile, "Draw pile", "next card first", mine && S.sel.length ? Math.min(S.sel.length, g.pile.length) : 0);
      main += handTableHTML(g, mine, mine && S.sel.length && S.sel.length <= 5 ? g.evaluate(S.sel).hand : null);
    } else if (g.phase === "shop") {
      if (mine) main += shopHTML(g);
      main += handTableHTML(g, !!mine, null);
      main += pileHTML(g, UI.nextRoundPile(g), `Round ${g.round + 2} draw order`, "in draw order · gold = your opening hand", Math.min(g.hand_size, UI.nextRoundPile(g).length));
    }
    if (v.mode !== "race") main += boardTableHTML(v.players.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : "", rounds: p.rounds, total: p.total, over: p.over })), g.inst.rounds, me.seat);
    return main;
  }

  // The shared shop: who owns what, as seen by the player in the shop.
  function shopCtx(g) {
    if (S.kind === "online" && M.stash && ON.view && ON.view.status === "playing") {
      const v = ON.view, me = onMe(v);
      const owner = (name) => { const s = v.owners[name]; return s !== undefined && me && s !== me.seat ? onPlayer(v, s) : null; };
      let note = "";
      if (v.mode === "draft" && v.shop_order && me) {
        const k = v.shop_order.indexOf(me.seat) + 1;
        note = `Shared shop: you pick ${ordinal(k)} of ${v.shop_order.length} (lowest total first). A modifier another player owns is gone for you; one they sell comes back.`;
      }
      return { owner, buyErr: (n) => { const o = owner(n); return o ? `${n} was drafted by ${o.name}` : g.tryMove("buy " + n); },
        next: v.mode === "draft" ? "Done shopping →" : v.mode === "rounds" ? "Next round · end turn →" : "Next round →", note };
    }
    return { owner: () => null, buyErr: (n) => g.tryMove("buy " + n), next: "Next round →", note: "" };
  }

  // ---------- actions
  function readFile(input, cb) {
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => cb(String(r.result));
    r.onerror = () => cb(null);
    r.readAsText(f);
  }

  function dealSeed(seed) {
    if (!Number.isSafeInteger(seed)) { S.msg = { kind: "err", text: "The seed must be a whole number." }; render(); return; }
    startFromSource({ type: "seed", seed });
    S.msg = null;
    render();
  }

  const actions = {
    mode(el) {
      S.mode = el.dataset.v; Sound.tap(); render();
      if (S.mode === "replay" && S.rp && S.rp.rules !== (S.rpRules || S.rules)) runReplay();   // checked with other rules
    },
    rules(el) {
      const v = el.dataset.v;
      if (S.mode === "play" && S.kind === "bot") { mpRules(v); return; }
      if (S.mode === "play" && S.kind === "online") return;
      if (S.mode === "replay" && S.rpRules) { S.rpRules = null; if (v === S.rules) { Sound.tap(); runReplay(); render(); return; } }
      if (v === S.rules || !Object.prototype.hasOwnProperty.call(PR.RULESETS, v)) return;
      if (S.moves.length && !S.game.over &&
          !window.confirm(`Switch to the ${UI.rulesTitle(v)} rules? Your current run (${S.moves.length} moves) starts again from the first move.`)) return;
      S.rules = v;
      Sound.shuffle();
      startFromSource(S.source, []);
      S.msg = { kind: "ok", text: `${UI.rulesTitle(v)} rules: ${v === "classic" ? "the contest's rules" : UI.rulesChanges(v).length + " changes from classic (see the side panel)"}. The run starts again.` };
      if (S.mode === "replay" && S.rp) runReplay();   // re-check the loaded replay with the new rules
      render();
    },
    deal() { Sound.shuffle(); dealSeed(Number($("seed").value)); },
    "random-seed"() { const s = Math.floor(Math.random() * 1000000) + 1; S.mode = "play"; dealSeed(s); },
    "toggle-load"() {
      const p = $("load-panel"); p.classList.toggle("hidden");
      document.querySelectorAll('[data-act="toggle-load"]').forEach((b) => b.setAttribute("aria-expanded", String(!p.classList.contains("hidden"))));
      if (!p.classList.contains("hidden")) $("load-text").focus();
    },
    "load-input"() {
      const text = $("load-text").value;
      try { startFromSource({ type: "text", text }); } catch (e) {
        if (e instanceof PR.BadInput) { flash("load-msg", "err", "Bad input: " + e.message); return; }
        throw e;
      }
      flash("load-msg", "ok", "Loaded. Good luck.");
      S.msg = null;
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
      render();
    },
    card(el) {
      const id = Number(el.dataset.id);
      const i = S.sel.indexOf(id);
      if (i >= 0) { S.sel.splice(i, 1); Sound.deselect(S.game.rank[id]); }
      else if (S.sel.length < 5) { S.sel.push(id); Sound.select(S.game.rank[id]); }
      else { S.msg = { kind: "err", text: "At most 5 cards: deselect one first." }; Sound.oops(); renderKeepFocus(); return; }
      S.msg = null;
      renderKeepFocus();
    },
    "clear-sel"() { S.sel = []; Sound.tap(); render(); },
    sound() { Sound.toggle(); soundIcon(); },
    play() { doMove("play " + S.sel.join(" ")); },
    discard() { doMove("discard " + S.sel.join(" ")); },
    end() { doMove("end"); },
    buy(el) { doMove("buy " + el.dataset.v); },
    sell(el) { doMove("sell " + el.dataset.v); },
    level(el) { doMove("level " + el.dataset.v); },
    reroll() { doMove("reroll"); },
    discards() { doMove("discards"); },
    handsize() { doMove("handsize"); },
    next() { doMove("next"); },
    "deck-pick"(el) {
      const v = el.dataset.id !== undefined ? Number(el.dataset.id) : null;
      S.deckPick = v === null || v === S.deckPick ? null : v;
      renderKeepFocus();
    },
    remove() { if (S.deckPick !== null) doMove("remove " + S.deckPick); },
    paint(el) { if (S.deckPick !== null) doMove(`paint ${S.deckPick} ${PR.SUITS[Number(el.dataset.v)]}`); },
    promote() { if (S.deckPick !== null) doMove("promote " + S.deckPick); },
    undo() { undo(); },
    copy() {
      const text = outputText();
      const done = () => flash("export-msg", "ok", "Copied to the clipboard.");
      const fallback = () => {
        const ta = $("export-text"); ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) done(); else flash("export-msg", "err", "Couldn't copy automatically: the text is selected, press Ctrl/Cmd+C.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    },
    download() {
      const blob = new Blob([outputText()], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const tag = S.rules !== "classic" ? "_" + S.rules : "";
      a.download = S.source.type === "seed" ? `poker_run_seed${S.source.seed}${tag}_out.txt` : `poker_run${tag}_out.txt`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      flash("export-msg", "ok", `Saved ${a.download}.`);
    },
    "rp-seed"() {
      const s = Number($("rp-seed").value);
      if (!Number.isSafeInteger(s)) { $("rp-verdict").innerHTML = '<div class="err">The seed must be a whole number.</div>'; return; }
      $("rp-input").value = PR.formatInstance(PR.generate(s));
    },
    "rp-run"() { runReplay(); },
    "rp-from-play"() {
      $("rp-input").value = S.inputText;
      $("rp-output").value = outputText();
      S.mode = "replay";
      render();
      runReplay();
      S.rpStep = S.rp && S.rp.states ? S.rp.states.length - 1 : 0;
      renderReplay();
    },
    "rp-step"(el) {
      if (!S.rp || !S.rp.states) return;
      const n = S.rp.states.length - 1, v = el.dataset.v;
      S.rpStep = v === "first" ? 0 : v === "last" ? n : Math.max(0, Math.min(n, S.rpStep + Number(v)));
      Sound.tap();
      renderReplay();
    },
    kind(el) { setKind(el.dataset.v); },
    "mp-level"(el) {
      if (!LEVEL_NAMES[el.dataset.v]) return;
      M.setups.bot.level = el.dataset.v; saveMP(); Sound.tap(); renderKeepFocus();
    },
    "mp-seed-random"() { $("mp-seed").value = String(randomSeed()); Sound.shuffle(); },
    "mp-start"() {
      const seed = Number($("mp-seed").value);
      if (!Number.isSafeInteger(seed)) { flash("mp-msg", "err", "The seed must be a whole number."); Sound.oops(); return; }
      mpStart(seed); Sound.shuffle(); render(); scrollTop();
    },
    "mp-rematch"() { const st = mpCur(); if (st) { mpStart(st.seed); Sound.shuffle(); render(); scrollTop(); } },
    "mp-new-seed"() { mpStart(randomSeed()); Sound.shuffle(); render(); scrollTop(); },
    "mp-restart"() {
      const st = mpCur();
      if (!st || !window.confirm("Restart this match from round 1 on the same seed?")) return;
      mpStart(st.seed); Sound.shuffle(); render(); scrollTop();
    },
    "mp-setup"() {
      const st = mpCur();
      if (st && !st.match.over && !window.confirm("Leave this match for the setup? It can't be resumed.")) return;
      M.games.bot = null; saveMP(); Sound.tap(); render(); scrollTop();
    },
    "mp-copy"(el) {
      const seat = Number(el.dataset.v), ta = $("mp-out-" + seat);
      if (!ta) return;
      const done = () => flash("mp-out-msg-" + seat, "ok", "Copied to the clipboard.");
      const fallback = () => {
        ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        if (ok) done(); else flash("mp-out-msg-" + seat, "err", "Couldn't copy automatically: the text is selected, press Ctrl/Cmd+C.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
      else fallback();
    },
    "mp-download"(el) {
      const o = shownOutputs(), seat = Number(el.dataset.v), pl = o && o.players.find((p) => p.seat === seat);
      if (!pl) return;
      const blob = new Blob([PR.formatOutput(pl.moves)], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = outputName(o.seed, o.rules, pl.name, seat);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      flash("mp-out-msg-" + seat, "ok", `Saved ${a.download}.`);
    },
    "mp-replay"(el) {
      const o = shownOutputs(), seat = Number(el.dataset.v), pl = o && o.players.find((p) => p.seat === seat);
      if (pl) openReplay(o.text, pl.moves, o.rules);
    },
    // ---- online
    "on-retry"() { ON.me = undefined; ON.api = true; ON.apiErr = null; render(); onlineEnter(); },
    "on-form-mode"(el) { if (ONLINE_MODES[el.dataset.v]) { ON.form.mode = el.dataset.v; Sound.tap(); renderKeepFocus(); } },
    "on-form-rules"(el) { if (isRules(el.dataset.v)) { ON.form.rules = el.dataset.v; Sound.tap(); renderKeepFocus(); } },
    "on-form-max"(el) {
      const n = Number(el.dataset.v);
      if (![2, 3, 4].includes(n)) return;
      ON.form.max = n; ON.form.bots = Math.min(ON.form.bots, n - 1); Sound.tap(); renderKeepFocus();
    },
    "on-form-bots"(el) {
      const n = Number(el.dataset.v);
      if (!(n >= 0 && n < ON.form.max)) return;
      ON.form.bots = n; Sound.tap(); renderKeepFocus();
    },
    "on-form-level"(el) { if (LEVEL_NAMES[el.dataset.v]) { ON.form.level = el.dataset.v; Sound.tap(); renderKeepFocus(); } },
    async "on-create"() {
      const f = ON.form;
      let seed = null;
      if (!f.random) {
        seed = Number(f.seed);
        if (String(f.seed).trim() === "" || !Number.isSafeInteger(seed) || seed < 0 || seed > 4294967295) {
          ON.msg = { kind: "err", text: "The seed must be a whole number from 0 to 4294967295 (or tick Random)." }; Sound.oops(); render(); return;
        }
      }
      if (ON.busy) return;
      ON.busy = true; ON.msg = null;
      try {
        const v = await api("POST", "/api/rooms", { mode: f.mode, rules: f.rules, seed, max_players: f.max, bots: Array(Math.min(f.bots, f.max - 1)).fill(f.level) });
        ON.busy = false;
        Sound.shuffle();
        enterRoom(v.code, v);
      } catch (e) {
        ON.busy = false;
        if (e.status === 401) ON.me = null;
        ON.msg = { kind: "err", text: e.message }; Sound.oops(); render();
      }
    },
    async "on-join"() {
      const code = String(ON.form.join || "").trim().toUpperCase();
      if (!ROOM_RE.test(code)) { ON.msg = { kind: "err", text: "A room code is 5 letters and digits, like K7M3Q." }; Sound.oops(); render(); return; }
      await joinRoom(code);
    },
    async "on-open"(el) {
      const code = el.dataset.v;
      if (!ROOM_RE.test(code)) return;
      Sound.tap();
      if (ON.view && ON.view.rematch === code) { await joinRoom(code); return; }
      ON.detail = null;
      enterRoom(code);
    },
    "on-take-seat"() { roomAction("join").then((v) => { if (v) Sound.shuffle(); }); },
    "on-ready"() { const me = onMe(); if (me) { Sound.tap(); roomAction("ready", { ready: !me.ready }); } },
    "on-start"() { Sound.shuffle(); roomAction("start"); },
    "on-kick"(el) {
      const p = ON.view && onPlayer(ON.view, Number(el.dataset.v));
      if (!p || (!p.bot && !window.confirm(`Remove ${p.name} from the room? They can't join it again.`))) return;
      roomAction("kick", { seat: p.seat });
    },
    "on-add-bot"(el) {
      if (!ON.view || !LEVEL_NAMES[el.dataset.v]) return;
      const bots = ON.view.players.filter((p) => p.bot).map((p) => p.bot).concat([el.dataset.v]);
      Sound.tap(); roomAction("settings", { bots });
    },
    "on-set-mode"(el) { if (ONLINE_MODES[el.dataset.v]) roomAction("settings", { mode: el.dataset.v }); },
    "on-set-rules"(el) { if (isRules(el.dataset.v)) roomAction("settings", { rules: el.dataset.v }); },
    "on-set-max"(el) { const n = Number(el.dataset.v); if ([2, 3, 4].includes(n)) roomAction("settings", { max_players: n }); },
    "on-set-seed"() { Sound.shuffle(); roomAction("settings", { random_seed: true }); },
    "on-copy-link"() {
      const link = roomLink(ON.code);
      copyText(link, () => { toast(`Link copied: <span class="mono">${esc(link)}</span>`); Sound.tap(); }, () => toast(`Copy this link: <span class="mono">${esc(link)}</span>`));
    },
    "on-copy-code"() { const c = ON.code; copyText(c, () => { toast(`Code <b class="mono">${esc(c)}</b> copied.`); Sound.tap(); }, () => toast(`The code is <b class="mono">${esc(c)}</b>.`)); },
    async "on-leave"() {
      const v = ON.view, me = onMe(v);
      if (v && me && v.status === "playing" && me.status === "in" && !me.over &&
          !window.confirm("Leave this game? Your run stops here and scores what it has; the others play on.")) return;
      if (v && me && (v.status !== "finished" || me.status === "in")) {
        try { await api("POST", `/api/rooms/${v.code}/leave`); } catch (e) { /* gone already */ }
      }
      Sound.tap();
      leaveRoomScreen();
    },
    "on-home"() { Sound.tap(); ON.detail = null; leaveRoomScreen(); },
    "on-remove"(el) {
      const p = ON.view && onPlayer(ON.view, Number(el.dataset.v));
      if (!p || !window.confirm(`Remove ${p.name} from the game? Their run stops and scores what it has.`)) return;
      roomAction("remove", { seat: p.seat });
    },
    async "on-rematch"(el) {
      try {
        const r = await api("POST", `/api/rooms/${ON.code}/rematch`, { same_seed: el.dataset.v === "same" });
        Sound.shuffle();
        enterRoom(r.code);
      } catch (e) { ON.msg = { kind: "err", text: e.message }; Sound.oops(); render(); }
    },
    async "on-replay"(el) {
      try {
        const d = await api("GET", `/api/matches/${Number(el.dataset.v)}`);
        const me = d.players.find((p) => p.you) || d.players[0];
        openReplay(PR.formatInstance(onInst(d.seed)), me.moves, d.rules);
      } catch (e) { ON.msg = { kind: "err", text: e.message }; Sound.oops(); render(); }
    },
    async "on-match"(el) { await showMatch(Number(el.dataset.v)); },
    "on-match-close"() { ON.detail = null; onlineHash(); Sound.tap(); render(); },
    "rp-continue"() {
      if (!S.rp || !S.rp.states) return;
      const text = $("rp-input").value;
      if (S.kind !== "solo") setKind("solo", true);
      S.rpRules = null;
      try { startFromSource({ type: "text", text }, S.rp.moves.slice(0, S.rpStep)); } catch (e) {
        if (e instanceof PR.BadInput) return;
        throw e;
      }
      S.mode = "play";
      S.msg = { kind: "ok", text: `Loaded ${S.moves.length} moves from the replay.` };
      render();
    },
  };

  async function joinRoom(code) {
    if (ON.busy) return;
    ON.busy = true; ON.msg = null;
    try {
      const v = await api("POST", `/api/rooms/${code}/join`);
      ON.busy = false;
      Sound.shuffle();
      ON.form.join = "";
      ON.detail = null;
      enterRoom(code, v);
    } catch (e) {
      ON.busy = false;
      if (e.status === 401) ON.me = null;
      ON.msg = { kind: "err", text: e.status === 404 ? `No room ${code}: check the code (rooms close after a while without activity).` : e.message };
      Sound.oops();
      render();
    }
  }

  // A saved match (from Your matches or a #match= link): results and move lists.
  async function showMatch(id) {
    try {
      ON.detail = await api("GET", `/api/matches/${id}`);
      ON.msg = null;
      try { history.replaceState(null, "", "#match=" + id); } catch (e) { /* no URL updates */ }
    } catch (e) { ON.detail = null; ON.msg = { kind: "err", text: e.message }; }
    if (S.kind === "online") { render(); scrollTop(); }
  }

  // Each round's score from a move list (saved matches keep only the moves).
  function roundsOf(inst, rules, moves) {
    const g = new PR.Game(inst, rules), out = [];
    for (const m of moves) {
      const r = g.round, was = g.phase;
      try { g.apply(m); } catch (e) { break; }
      if (was === "play") out[r] = { score: g.round_score, cleared: g.phase === "play" ? null : g.cleared > r };
    }
    return out;
  }

  function matchDetailHTML(d) {
    const inst = onInst(d.seed), R = inst.rounds;
    const rows = d.players.slice().sort((a, b) => a.place - b.place || a.seat - b.seat);
    const win = rows.filter((p) => p.place === 1);
    const prow = rows.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : p.you ? "you" : "", total: p.total, cleared: p.cleared, moves: p.moves.length, place: p.place, note: p.left ? "left early" : "" }));
    const board = boardTableHTML(d.players.map((p) => ({ seat: p.seat, name: p.name, tag: p.bot ? `${LEVEL_NAMES[p.bot]} bot` : "", rounds: roundsOf(inst, d.rules, p.moves), total: p.total, place: p.place, over: true })), R, d.you === null ? -1 : d.you, "Rounds");
    return `<section class="panel summary results" style="--pc:${win.length > 1 ? "var(--gold)" : COLORS[win[0].seat]}" aria-label="Match ${d.id}">
      <div class="kicker">Online match · ${esc(ONLINE_MODES[d.mode] || d.mode)} · ${esc(UI.rulesTitle(d.rules))} rules · seed ${d.seed} · ${esc(fmtDate(d.finished))}${d.ended === "expired" ? " · ended after a long pause" : ""}</div>
      <div class="winner">${esc(win.length > 1 ? `Tie: ${win.map((p) => p.name).join(" & ")}` : `${win[0].name} won`)}</div>
      <div class="podium">${podiumHTML(prow, R)}</div>
      <div class="actions" style="justify-content:center;margin-top:14px">${btn("Back", "on-match-close", { cls: "primary" })}</div></section>${board}`;
  }

  document.addEventListener("pointerdown", (ev) => {
    const el = ev.target.closest("[data-act], .tab");
    if (el && !el.disabled) Feel.ripple(ev);
  });
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (el && !el.disabled && actions[el.dataset.act]) { actions[el.dataset.act](el); return; }
    const li = ev.target.closest("#rp-log li[data-step]");
    if (li) { S.rpStep = Number(li.dataset.step); renderReplay(); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "sort-hand") { S.sort = ev.target.value; save(); render(); }
    const f = ev.target.dataset && ev.target.dataset.onForm;
    if (f === "random") { ON.form.random = ev.target.checked; Sound.tap(); renderKeepFocus(); if (!ON.form.random && $("on-seed")) $("on-seed").focus(); }
  });
  document.addEventListener("input", (ev) => {
    const f = ev.target.dataset && ev.target.dataset.onForm;
    if (f === "seed") ON.form.seed = ev.target.value.slice(0, 12);
    if (f === "join") {
      const v = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
      if (v !== ev.target.value) ev.target.value = v;
      ON.form.join = v;
    }
    if (ev.target.dataset && ev.target.dataset.mpName !== undefined) { M.setups.bot.name = ev.target.value.slice(0, 24); saveMP(); }
  });
  document.addEventListener("toggle", (ev) => {
    if (ev.target.classList && ev.target.classList.contains("host-settings")) ON.settingsOpen = ev.target.open;
  }, true);
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    if (ev.target.id === "mp-seed") actions["mp-start"]();
    else if (ev.target.id === "on-join") { ev.preventDefault(); actions["on-join"](); }
    else if (ev.target.id === "on-seed") actions["on-create"]();
  });
  $("seed").addEventListener("keydown", (ev) => { if (ev.key === "Enter") actions.deal(); });
  $("rp-slider").addEventListener("input", (ev) => { S.rpStep = Number(ev.target.value); renderReplay(); });
  $("load-file").addEventListener("change", (ev) => readFile(ev.target, (t) => {
    if (t === null) flash("load-msg", "err", "Couldn't read that file.");
    else { $("load-text").value = t; flash("load-msg", "ok", "File read. Press “Start with this input”."); }
  }));
  $("rp-input-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-input").value = t; }));
  $("rp-output-file").addEventListener("change", (ev) => readFile(ev.target, (t) => { if (t !== null) $("rp-output").value = t; }));

  // Online links within the page (#room=CODE, #match=ID) and pasted into the address bar.
  function followHash(h) {
    if (h.room && ROOM_RE.test(h.room)) {
      S.mode = "play";
      ON.detail = null;
      if (S.kind !== "online") {   // the room is opened as the Online screen starts
        onlineStop();
        Object.assign(ON, { code: h.room, view: null, error: null, lost: false, msg: null, key: "", game: null, moves: [], seed: null, pending: 0 });
        setKind("online", true);
      } else if (ON.code !== h.room) {
        if (ON.me) enterRoom(h.room); else { ON.code = h.room; ON.view = null; ON.error = null; onlineEnter(); }
      }
      render();
      return true;
    }
    if (h.match !== null && Number.isSafeInteger(h.match)) {
      if (S.kind !== "online") setKind("online", true);
      S.mode = "play";
      if (ON.code) { onlineStop(); ON.code = null; ON.view = null; }
      const go = () => showMatch(h.match);
      if (ON.me) go(); else onlineEnter().then(() => { if (ON.me) go(); });
      render();
      return true;
    }
    return false;
  }
  addEventListener("hashchange", () => followHash(UI.parseHash(location.hash)));

  // ---------- boot
  // #seed= and #rules= set up the solo game; #mode=solo|bot|online picks the mode (#mode=online&create=draft
  // presets the room form); #room=CODE opens an online room, #match=ID a saved online match.
  // The removed same-device modes' links (#mode=hotseat, #mode=draft) open Online.
  const hash = UI.parseHash(location.hash);
  const oldKind = hash.mode !== null && Object.prototype.hasOwnProperty.call(OLD_KINDS, hash.mode) ? hash.mode : null;
  const onlineLink = oldKind !== null || hash.mode === "online" || (hash.room !== null && ROOM_RE.test(hash.room)) || hash.match !== null;
  const hashKind = onlineLink ? "online" : hash.mode !== null && Object.prototype.hasOwnProperty.call(KINDS, hash.mode) ? hash.mode : null;
  const mpLink = hashKind !== null && hashKind !== "solo";
  const hashSeed = !mpLink && hash.seed !== null && Number.isSafeInteger(hash.seed) ? hash.seed : null;
  const hashRules = mpLink ? null : hash.rules;
  const saved = restore();
  if (saved && saved.sort) S.sort = saved.sort;
  const known = (r) => typeof r === "string" && Object.prototype.hasOwnProperty.call(PR.RULESETS, r);
  const savedRules = saved && known(saved.rules) ? saved.rules : "classic";
  S.rules = known(hashRules) ? hashRules : hashSeed !== null ? "classic" : savedRules;
  // Saved moves only make sense with the rules they were played by.
  if (saved && savedRules !== S.rules) saved.moves = [];
  try {
    if (hashSeed !== null) {
      const seed = hashSeed;
      const same = saved && saved.source && saved.source.type === "seed" && saved.source.seed === seed;
      startFromSource({ type: "seed", seed }, same ? saved.moves : []);
    } else if (saved && saved.source) startFromSource(saved.source, saved.moves || []);
    else startFromSource({ type: "seed", seed: 1 });
  } catch (e) {
    startFromSource({ type: "seed", seed: 1 });
  }
  $("rp-seed").value = $("seed").value;
  M.setups.bot.seed = S.source.type === "seed" ? S.source.seed : 1;
  restoreMP();
  let kind = "solo";
  try { kind = localStorage.getItem(KIND_KEY) || "solo"; } catch (e) { /* storage unavailable */ }
  if (Object.prototype.hasOwnProperty.call(OLD_KINDS, kind)) kind = "online";   // a saved same-device mode
  if (hashSeed !== null || !Object.prototype.hasOwnProperty.call(KINDS, kind)) kind = "solo";   // a #seed= link opens solo
  if (hashKind) kind = hashKind;
  if (hashKind === "bot") {
    // Open the setup (a match still being played is resumed, a finished one makes way).
    if (known(hash.rules)) M.rules = hash.rules;
    if (hash.seed !== null && Number.isSafeInteger(hash.seed)) M.setups.bot.seed = hash.seed;
    if (M.games.bot && M.games.bot.match.over) M.games.bot = null;
    saveMP();
  }
  if (hashKind === "online") {
    const preset = oldKind ? OLD_KINDS[oldKind] : hash.create;
    if (preset && ONLINE_MODES[preset]) ON.form.mode = preset;
    if (known(hash.rules)) ON.form.rules = hash.rules;
    if (hash.room !== null && ROOM_RE.test(hash.room)) ON.code = hash.room;
  }
  setKind(kind, true);
  if (hashKind) { try { localStorage.setItem(KIND_KEY, kind); } catch (e) { /* storage unavailable */ } }   // remembered like a click on Mode
  if (kind === "online" && hash.match !== null && Number.isSafeInteger(hash.match)) onlineEnter().then(() => { if (ON.me) showMatch(hash.match); });
  soundIcon();
  render();

  // A small handle for automated browser tests: make a move as if clicked, read the state.
  window.PokerRunApp = {
    move: (line) => doMove(line),
    game: () => S.game,
    kind: () => S.kind,
    match: () => { const st = mpCur(); return st ? st.match : null; },
    screen: () => {
      if (S.kind === "solo") return "solo";
      if (S.kind === "online") return !ON.me ? "signin" : ON.error ? "error" : !ON.code ? "home" : !ON.view ? "loading" : ON.view.status;
      const st = mpCur(); return st ? st.screen : "setup";
    },
    viewer: () => { const st = mpCur(); return st ? st.viewer : -1; },
    room: () => ON.view,
    pending: () => ON.pending,
  };
}

if (typeof document !== "undefined") startApp(PokerRun);
if (typeof module === "object" && module.exports) module.exports = UI;
</script>
</body>
</html>
